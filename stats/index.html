<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Stats — SonicSandbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #0a0b0d;
    --surface:  #13151a;
    --surface2: #1a1d24;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --text:     #dde2ee;
    --muted:    #6b7280;
    --accent:   #5b6aff;
    --accent2:  #8892ff;
    --green:    #3ecf8e;
    --amber:    #f59e0b;
    --red:      #f45b69;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }

  /* ── Nav ─────────────────────────────────────────────── */
  nav {
    max-width: 1100px; margin: 0 auto;
    padding: 20px 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .nav-logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px; font-weight: 600;
    color: var(--text); text-decoration: none;
  }
  .nav-logo span { color: var(--accent2); }
  .nav-sep { color: var(--border2); }
  .nav-page { font-size: 14px; color: var(--muted); }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    transition: color 0.15s, border-color 0.15s;
    margin-left: auto;
  }
  .back-btn:hover { color: var(--text); border-color: var(--border2); }

  .reset-btn {
    font-size: 11px; color: var(--muted);
    background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px;
    cursor: pointer; font-family: inherit;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .reset-btn:hover { color: var(--red); border-color: var(--red); background: rgba(244,91,105,0.07); }
  .reset-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Page layout ─────────────────────────────────────── */
  .page { max-width: 1100px; margin: 0 auto; padding: 0 28px 80px; }

  .page-header { margin-bottom: 40px; }
  .page-header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 600; letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .page-header p { font-size: 14px; color: var(--muted); }

  /* ── Overall summary row ─────────────────────────────── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px; margin-bottom: 40px;
  }
  @media (max-width: 700px) { .summary-row { grid-template-columns: 1fr 1fr; } }

  .summary-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 18px;
  }
  .summary-tile .val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; font-weight: 600;
    color: var(--accent2); margin-bottom: 4px;
  }
  .summary-tile .lbl {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ── Section label ───────────────────────────────────── */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }

  /* ── Game cards ──────────────────────────────────────── */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px; margin-bottom: 48px;
  }
  @media (max-width: 700px) { .game-grid { grid-template-columns: 1fr; } }

  .game-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px;
  }
  .game-card-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 16px;
  }
  .game-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 600; color: var(--text);
  }
  .game-rounds {
    font-size: 12px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .stat-row {
    display: flex; gap: 24px; margin-bottom: 14px;
  }
  .stat-item { flex: 1; }
  .stat-item .val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px; font-weight: 600; color: var(--text);
  }
  .stat-item .lbl {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em;
    margin-top: 2px;
  }

  /* Accuracy bar */
  .acc-bar-wrap { background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
  .acc-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

  /* ── Recent activity ─────────────────────────────────── */
  .activity-list { display: flex; flex-direction: column; gap: 8px; }
  .activity-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    font-size: 13px;
  }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .activity-dot.correct { background: var(--green); }
  .activity-dot.wrong   { background: var(--red); }
  .activity-game { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent2); flex: 1; }
  .activity-score { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--text); }
  .activity-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── States ──────────────────────────────────────────── */
  .loading-state, .empty-state, .auth-wall {
    text-align: center; padding: 80px 20px;
    color: var(--muted); font-size: 15px; line-height: 1.7;
  }
  .auth-wall a {
    color: var(--accent2); text-decoration: none;
  }
  .auth-wall a:hover { text-decoration: underline; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 20px;
    border: 3px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="../">Sonic<span>Sandbox</span></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">My Stats</span>
  <a class="back-btn" href="../">← Back</a>
</nav>

<div class="page">

  <div class="page-header">
    <h1>Your Progress</h1>
    <p id="subheader">Loading your stats…</p>
  </div>

  <!-- Auth wall (shown when not logged in) -->
  <div class="auth-wall" id="authWall" style="display:none;">
    <p>Sign in to see your stats.<br>
    <a href="../">Go back to SonicSandbox</a> and sign in from the top nav.</p>
  </div>

  <!-- Main content (shown when logged in) -->
  <div id="mainContent" style="display:none;">

    <!-- Overall summary -->
    <div class="summary-row" id="summaryRow">
      <div class="summary-tile">
        <div class="val" id="statTotal">—</div>
        <div class="lbl">Total Rounds</div>
      </div>
      <div class="summary-tile">
        <div class="val" id="statAccuracy">—</div>
        <div class="lbl">Overall Accuracy</div>
      </div>
      <div class="summary-tile">
        <div class="val" id="statAvgScore">—</div>
        <div class="lbl">Avg Score</div>
      </div>
      <div class="summary-tile">
        <div class="val" id="statGames">—</div>
        <div class="lbl">Games Played</div>
      </div>
    </div>

    <!-- Per-game breakdown -->
    <div class="section-label">Per Game</div>
    <div class="game-grid" id="gameGrid"></div>

    <!-- Recent activity -->
    <div class="section-label">Recent Activity</div>
    <div class="activity-list" id="activityList"></div>

  </div>

  <!-- Loading -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    Loading your stats…
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script>
const GAME_LABELS = {
  'eq-match':           'EQ Match',
  'compressor':         'Compressor',
  'quick-compress':     'Quick Compress',
  'reverb-master':      'Reverb Master',
  'distortion-master':  'Distortion Master',
  'freq-quiz':          'Freq Quiz',
  'freq-hunter':        'Freq Hunter',
  'spatial-specialist': 'Spatial Specialist',
};

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60)   return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function accColor(pct) {
  if (pct >= 70) return 'var(--green)';
  if (pct >= 45) return 'var(--amber)';
  return 'var(--red)';
}

function buildGameCard(game, rows) {
  const total   = rows.length;
  const correct = rows.filter(r => r.correct).length;
  const accPct  = total ? Math.round(correct / total * 100) : 0;
  const scored  = rows.filter(r => r.round_score !== null);
  const avgScore = scored.length
    ? Math.round(scored.reduce((s, r) => s + r.round_score, 0) / scored.length)
    : null;

  const col = accColor(accPct);

  return `
    <div class="game-card">
      <div class="game-card-header">
        <div class="game-name">${GAME_LABELS[game] || game}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="game-rounds">${total} round${total !== 1 ? 's' : ''}</div>
          <button class="reset-btn" onclick="resetGame('${game}', this)">Reset</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-item">
          <div class="val" style="color:${col}">${accPct}%</div>
          <div class="lbl">Accuracy</div>
        </div>
        <div class="stat-item">
          <div class="val">${correct}</div>
          <div class="lbl">Correct</div>
        </div>
        ${avgScore !== null ? `
        <div class="stat-item">
          <div class="val">${avgScore}</div>
          <div class="lbl">Avg Score</div>
        </div>` : ''}
      </div>
      <div class="acc-bar-wrap">
        <div class="acc-bar-fill" style="width:${accPct}%; background:${col};"></div>
      </div>
    </div>`;
}

function buildActivityRow(row) {
  const label = GAME_LABELS[row.game] || row.game;
  const scoreStr = row.round_score !== null ? row.round_score : (row.correct ? '✓' : '✗');
  return `
    <div class="activity-row">
      <div class="activity-dot ${row.correct ? 'correct' : 'wrong'}"></div>
      <div class="activity-game">${label}</div>
      <div class="activity-score">${scoreStr}</div>
      <div class="activity-time">${timeAgo(row.created_at)}</div>
    </div>`;
}

async function loadStats(user) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').style.display  = 'block';
  document.getElementById('subheader').textContent = user.email;

  const scores = await SonicSandbox.getScores();

  if (!scores.length) {
    document.getElementById('summaryRow').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">No rounds played yet — jump into a game!</div>';
    document.getElementById('gameGrid').innerHTML = '';
    document.getElementById('activityList').innerHTML = '';
    return;
  }

  // Overall stats
  const total    = scores.length;
  const correct  = scores.filter(s => s.correct).length;
  const accPct   = Math.round(correct / total * 100);
  const scored   = scores.filter(s => s.round_score !== null);
  const avgScore = scored.length
    ? Math.round(scored.reduce((s, r) => s + r.round_score, 0) / scored.length)
    : '—';
  const gamesPlayed = new Set(scores.map(s => s.game)).size;

  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statAccuracy').textContent = accPct + '%';
  document.getElementById('statAvgScore').textContent = avgScore;
  document.getElementById('statGames').textContent    = gamesPlayed;

  // Group by game
  const byGame = {};
  scores.forEach(s => { (byGame[s.game] = byGame[s.game] || []).push(s); });

  // Sort games by most rounds played
  const sortedGames = Object.keys(byGame).sort((a, b) => byGame[b].length - byGame[a].length);
  document.getElementById('gameGrid').innerHTML = sortedGames.map(g => buildGameCard(g, byGame[g])).join('');

  // Recent 20 rounds
  const recent = scores.slice(0, 20);
  document.getElementById('activityList').innerHTML = recent.map(buildActivityRow).join('');
}

async function resetGame(game, btn) {
  const label = GAME_LABELS[game] || game;
  if (!confirm(`Reset all scores for ${label}? This cannot be undone.`)) return;

  btn.disabled = true;
  btn.textContent = '…';

  const user = SonicSandbox.getUser();
  const { error } = await SonicSandbox.client
    .from('scores')
    .delete()
    .eq('user_id', user.id)
    .eq('game', game);

  if (error) {
    btn.textContent = 'Error';
    btn.disabled = false;
    console.warn('Reset failed:', error.message);
    return;
  }

  // Reload the full stats view
  await loadStats(user);
}

// Wait for auth to initialize
document.addEventListener('ss:authchange', e => {
  const user = e.detail;
  document.getElementById('loadingState').style.display = 'none';
  if (user) {
    loadStats(user);
  } else {
    document.getElementById('authWall').style.display = 'block';
    document.getElementById('subheader').textContent  = 'Sign in to view your stats';
  }
});
</script>
</body>
</html>
