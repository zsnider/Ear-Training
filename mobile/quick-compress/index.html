<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quick Compress">
<title>Quick Compress</title>
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:       #080c0a;
  --bg2:      #0b0f0d;
  --surface:  #101a14;
  --surface2: #172019;
  --surface3: #1e2a20;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --text:     #ddf0e4;
  --muted:    #4a6054;
  --accent:   #2dd4a0;
  --accent2:  #5eefc0;
  --a-col:    #5b8fff;
  --a-col2:   #8ab4ff;
  --b-col:    #e8a030;
  --b-col2:   #f0c060;
  --green:    #3ecf8e;
  --red:      #f45b69;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  user-select: none;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 8px;
  flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); text-decoration: none;
  font-size: 18px; line-height: 1; flex-shrink: 0;
  margin-right: 6px;
}
.back-btn:active { background: var(--surface3); }

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.brand-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.06em;
}
.brand-name span { color: var(--accent2); }

.stats {
  display: flex;
  gap: 12px;
  align-items: center;
}
.stat { text-align: center; }
.stat-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 17px; font-weight: 700;
  color: var(--accent2);
  line-height: 1;
}
.stat-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em;
  margin-top: 2px;
}
.vdiv { width: 1px; height: 18px; background: var(--border2); }

/* ── Prompt card ── */
.prompt-card {
  margin: 0 12px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  flex-shrink: 0;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.prompt-card.correct-flash {
  border-color: var(--green);
  box-shadow: 0 0 18px rgba(62,207,142,0.15);
}
.prompt-card.wrong-flash {
  border-color: var(--red);
  box-shadow: 0 0 14px rgba(244,91,105,0.13);
}

.prompt-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.prompt-text {
  font-size: 13px;
  color: var(--text);
  flex: 1;
  line-height: 1.4;
}
.prompt-text span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

.result-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px; font-weight: 700;
  white-space: nowrap;
  opacity: 0; transition: opacity 0.15s;
}
.result-badge.good { opacity: 1; color: var(--green); }
.result-badge.bad  { opacity: 1; color: var(--red); }

/* Switch pill */
.switch-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}
.switch-lbl {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: 600;
}
.switch-pill {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  overflow: hidden;
}
.sw-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 600;
  padding: 5px 14px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.sw-btn.active-a { background: rgba(91,143,255,0.18); color: var(--a-col2); }
.sw-btn.active-b { background: rgba(232,160,48,0.18); color: var(--b-col2); }

/* GR meter */
.gr-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  display: none;
}
.gr-lbl {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  white-space: nowrap; font-weight: 600;
  width: 78px;
}
.gr-track {
  flex: 1; height: 6px;
  background: var(--surface3);
  border-radius: 3px; overflow: hidden;
}
.gr-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(to right, var(--accent), var(--accent2));
  width: 0%; transition: width 0.08s;
}
.gr-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--text);
  width: 46px; text-align: right; flex-shrink: 0;
}

/* ── Main game area: A/B cards ── */
.game-area {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0 12px;
}

.ab-card {
  background: var(--surface);
  border-radius: 18px;
  border: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  transition: all 0.15s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Color borders */
.card-a { border-color: rgba(91,143,255,0.25); }
.card-b { border-color: rgba(232,160,48,0.25); }

/* Playing state */
.ab-card.playing.card-a {
  background: rgba(91,143,255,0.10);
  border-color: var(--a-col);
  box-shadow: 0 0 28px rgba(91,143,255,0.18);
}
.ab-card.playing.card-b {
  background: rgba(232,160,48,0.10);
  border-color: var(--b-col);
  box-shadow: 0 0 28px rgba(232,160,48,0.18);
}

/* Answer states */
.ab-card.correct {
  background: rgba(62,207,142,0.10);
  border-color: var(--green);
  box-shadow: 0 0 24px rgba(62,207,142,0.22);
}
.ab-card.wrong {
  background: rgba(244,91,105,0.07);
  border-color: var(--red);
}
.ab-card.dimmed {
  opacity: 0.32;
}
/* Revealed correct answer when user picked wrong */
.ab-card.reveal {
  background: rgba(62,207,142,0.05);
  border-color: rgba(62,207,142,0.45);
  border-style: dashed;
}
.ab-card.reveal .ab-ring {
  background: rgba(62,207,142,0.08);
  border-color: rgba(62,207,142,0.4);
  border-style: dashed;
}
.ab-card.reveal .ab-letter { color: var(--green); }
.ab-card.reveal .card-result {
  opacity: 1;
  background: rgba(62,207,142,0.15);
  color: var(--green);
}
.ab-card.reveal .card-tier {
  opacity: 1;
  color: var(--accent2);
  background: rgba(45,212,160,0.10);
}

/* Listen ring — the big button inside each card */
.ab-ring {
  width: 112px; height: 112px;
  border-radius: 50%;
  border: 2.5px solid;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
}
.card-a .ab-ring { background: rgba(91,143,255,0.07);  border-color: rgba(91,143,255,0.30); }
.card-b .ab-ring { background: rgba(232,160,48,0.07); border-color: rgba(232,160,48,0.30); }

.ab-card.playing.card-a .ab-ring {
  background: rgba(91,143,255,0.18);
  border-color: var(--a-col);
  box-shadow: 0 0 28px rgba(91,143,255,0.32);
}
.ab-card.playing.card-b .ab-ring {
  background: rgba(232,160,48,0.18);
  border-color: var(--b-col);
  box-shadow: 0 0 28px rgba(232,160,48,0.32);
}
.ab-card.correct .ab-ring {
  background: rgba(62,207,142,0.14);
  border-color: var(--green);
  box-shadow: 0 0 22px rgba(62,207,142,0.24);
}
.ab-card.wrong .ab-ring {
  background: rgba(244,91,105,0.10);
  border-color: var(--red);
}
.ab-card.dimmed .ab-ring { opacity: 0.35; }
.ab-card:active .ab-ring { transform: scale(0.92); }

/* Letter */
.ab-letter {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 62px;
  font-weight: 700;
  line-height: 1;
  transition: color 0.2s;
}
.card-a .ab-letter { color: var(--a-col2); }
.card-b .ab-letter { color: var(--b-col2); }
.ab-card.correct .ab-letter { color: var(--green); }
.ab-card.wrong .ab-letter   { color: var(--red); }

/* Sub label */
.ab-sub {
  font-size: 11px; color: var(--muted);
  font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase;
}

/* Pulse ring */
.pulse-ring {
  position: absolute; top: 12px; right: 12px;
  width: 10px; height: 10px; border-radius: 50%;
  opacity: 0; transition: opacity 0.2s;
}
.card-a .pulse-ring { background: var(--a-col); }
.card-b .pulse-ring { background: var(--b-col); }
.ab-card.playing .pulse-ring {
  opacity: 1;
  animation: pring 1.1s infinite;
}
@keyframes pring {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.3; transform:scale(0.55); }
}

/* Result badge on card */
.card-result {
  position: absolute; top: 10px; left: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 5px;
  opacity: 0; transition: opacity 0.2s;
}
.ab-card.correct .card-result {
  opacity: 1;
  background: rgba(62,207,142,0.2);
  color: var(--green);
}
.ab-card.wrong .card-result {
  opacity: 1;
  background: rgba(244,91,105,0.15);
  color: var(--red);
}
.ab-card.dimmed .card-result {
  opacity: 1;
  background: rgba(255,255,255,0.06);
  color: var(--muted);
}

/* Tier label on card (revealed after answer) */
.card-tier {
  position: absolute; bottom: 10px;
  left: 50%; transform: translateX(-50%);
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  opacity: 0; transition: opacity 0.3s;
  padding: 2px 7px; border-radius: 4px;
  white-space: nowrap;
}
.ab-card.correct .card-tier {
  opacity: 1;
  color: var(--accent2);
  background: rgba(45,212,160,0.12);
}
.ab-card.dimmed .card-tier {
  opacity: 1;
  color: var(--muted);
  background: rgba(255,255,255,0.05);
}

/* ── History strip ── */
.history-strip {
  display: flex;
  gap: 5px;
  padding: 6px 12px 4px;
  flex-wrap: wrap;
  min-height: 22px;
  flex-shrink: 0;
}
.hist-dot {
  width: 9px; height: 9px; border-radius: 50%;
}
.hist-dot.c { background: var(--green); }
.hist-dot.w { background: var(--red); }

/* ── Footer pills ── */
.footer {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 12px 8px;
  flex-shrink: 0;
}
.footer-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.footer-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 600; white-space: nowrap;
  width: 34px;
}
.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 500;
  padding: 5px 12px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.pill.active {
  border-color: var(--accent2);
  color: var(--accent2);
  background: rgba(45,212,160,0.08);
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="back-btn" href="/mobile/">‹</a>
  <div class="brand">
    <div class="brand-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="6" width="9" height="12" rx="3" stroke="white" stroke-width="1.8" fill="none" opacity="0.5"/>
        <rect x="13" y="9" width="9" height="6" rx="2.5" stroke="white" stroke-width="1.8" fill="none"/>
        <line x1="11" y1="12" x2="13" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>
    <span class="brand-name">Quick Compress</span>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="scoreVal">0</div>
      <div class="stat-lbl">Score</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-lbl">Streak</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="accuracyVal">—</div>
      <div class="stat-lbl">Acc</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="roundVal">0</div>
      <div class="stat-lbl">Round</div>
    </div>
  </div>
</div>

<!-- Prompt card -->
<div class="prompt-card" id="promptCard">
  <div class="prompt-top">
    <div class="prompt-text" id="promptText">
      Tap <span>A</span> or <span>B</span> to start — pick the <span>compressed</span> signal
    </div>
    <div class="result-badge" id="resultBadge"></div>
  </div>

  <!-- Switch row (visible during active round) -->
  <div class="switch-row" id="switchRow" style="display:none;">
    <span class="switch-lbl">Listening</span>
    <div class="switch-pill">
      <button class="sw-btn" id="swA" ontouchend="onSwitchTap(event,'A')">A</button>
      <button class="sw-btn" id="swB" ontouchend="onSwitchTap(event,'B')">B</button>
    </div>
  </div>

  <!-- GR meter (shown after answer) -->
  <div class="gr-row" id="grRow">
    <span class="gr-lbl">Gain Reduction</span>
    <div class="gr-track"><div class="gr-fill" id="grFill"></div></div>
    <span class="gr-val" id="grVal">—</span>
  </div>
</div>

<!-- A / B cards -->
<div class="game-area">
  <div class="ab-card card-a" id="cardA">
    <div class="pulse-ring"></div>
    <div class="card-result" id="cardResultA"></div>
    <div class="ab-ring">
      <div class="ab-letter">A</div>
    </div>
    <div class="ab-sub" id="subA">Tap to start</div>
    <div class="card-tier" id="cardTierA"></div>
  </div>
  <div class="ab-card card-b" id="cardB">
    <div class="pulse-ring"></div>
    <div class="card-result" id="cardResultB"></div>
    <div class="ab-ring">
      <div class="ab-letter">B</div>
    </div>
    <div class="ab-sub" id="subB">Tap to start</div>
    <div class="card-tier" id="cardTierB"></div>
  </div>
</div>

<!-- History -->
<div class="history-strip" id="historyStrip"></div>

<!-- Footer -->
<div class="footer">
  <div class="footer-row">
    <span class="footer-lbl">Comp</span>
    <div class="pill active" id="pillEasy"   ontouchend="onTierTap(event,'easy')">Easy</div>
    <div class="pill"        id="pillMedium" ontouchend="onTierTap(event,'medium')">Med</div>
    <div class="pill"        id="pillHard"   ontouchend="onTierTap(event,'hard')">Hard</div>
    <div class="pill"        id="pillSubtle" ontouchend="onTierTap(event,'subtle')">Subtle</div>
  </div>
  <div class="footer-row">
    <span class="footer-lbl">Src</span>
    <div class="pill active" id="srcPink"  ontouchend="onSrcTap(event,'pink')">Pink</div>
    <div class="pill"        id="srcLoops" ontouchend="onSrcTap(event,'loops')">Loops</div>
  </div>
</div>

<script>
// ── IOS Loops ─────────────────────────────────────────────────────────────────
const IOS_LOOPS = [
  'alex-morgan-acid-jazz-groove-517096.mp3',
  'alex-morgan-bebop-coffee-shop-517090.mp3',
  'atlasaudio-house-518082.mp3',
  'cyberwave-orchestra-orchestral-music-loop-287416.mp3',
  'joyinsound-corporate-background-music-quiet-progress-507151.mp3',
  'leberch-spain-518570.mp3',
  'mkgomez-minimal-techno-background-loop-475852.mp3',
  'nastelbom-lounge-house-314576.mp3',
  'ohpalmusic-passive-hip-hop-beat-90bpm-d-minor-177334.mp3',
  'openmindaudio-deep-club-organic-house-music-ashen-palms-524258.mp3',
  'openmindaudio-epic-organic-house-music-driftwood-ritual-524274.mp3',
  'prettyjohn1-chill-520383.mp3',
  'prettyjohn1-disco-funk-520385.mp3',
  'prettyjohn1-retro-funk-523181.mp3',
  'sonican-acoustic-senses-loop-313230.mp3',
  'sonican-feelgood-acoustic-loop-320856.mp3',
  'sonican-positive-corporate-music-optimistic-loop-464544.mp3',
  'sonofevan-gravel-in-my-lungs-470048.mp3',
  'the_mountain-deep-house-483808.mp3',
  'the_mountain-event-522459.mp3',
  'the_mountain-hi-tech-loop-151203.mp3',
  'the_mountain-loop-beat-130010.mp3',
  'the_mountain-soft-loop-130012.mp3',
  'the_mountain-vlog-522479.mp3',
  'tunetank-soft-house-music-348241.mp3',
];

// ── Compression tiers ─────────────────────────────────────────────────────────
const TIERS = {
  easy:   { threshold:-30, ratio:20,  attack:0.003, release:0.05,  knee:2  },
  medium: { threshold:-24, ratio:8,   attack:0.005, release:0.08,  knee:4  },
  hard:   { threshold:-18, ratio:4,   attack:0.008, release:0.12,  knee:6  },
  subtle: { threshold:-14, ratio:2.5, attack:0.012, release:0.18,  knee:8  },
};

const TIER_LABELS = {
  easy:   '20:1 · −30dB thresh',
  medium: '8:1 · −24dB thresh',
  hard:   '4:1 · −18dB thresh',
  subtle: '2.5:1 · −14dB thresh',
};

// ── State ─────────────────────────────────────────────────────────────────────
let gameStarted    = false;
let roundActive    = false;
let answered       = false;
let compressedSide = null;   // 'A' or 'B'
let listeningTo    = 'A';
let currentTier    = 'easy';
let sourceType     = 'pink';
let loopIdx        = 0;

let totalScore = 0, streak = 0, totalRounds = 0, correctCount = 0;

// Audio
let audioCtx       = null;
let sourceA        = null, sourceB = null;
let compNode       = null;
let gainA          = null, gainB   = null;
let junctionA      = null, junctionB = null;
let kNodesA        = [],   kNodesB   = [];
let analyserA      = null, analyserB = null;
let sourceBusA     = null, sourceBusB = null;
let masterOut      = null;
let loopAudioEl    = null, loopMediaSrc = null;
let animFrameId    = null, lufsIntervalId = null, shotTimerA = null;
let pathGainA = 0.55, pathGainB = 0.55;
let nextTimeout    = null;

// ── Touch handlers ────────────────────────────────────────────────────────────
document.getElementById('cardA').addEventListener('touchend', e => {
  e.preventDefault();
  e.stopPropagation(); // prevent document touchend from double-firing
  handleCardTap('A');
}, { passive: false });

document.getElementById('cardB').addEventListener('touchend', e => {
  e.preventDefault();
  e.stopPropagation(); // prevent document touchend from double-firing
  handleCardTap('B');
}, { passive: false });

function handleCardTap(side) {
  if (!gameStarted) {
    startGame(side);
    return;
  }
  if (answered && roundActive) {
    newRound();
    return;
  }
  if (!roundActive) return;
  selectAnswer(side);
}

function onSwitchTap(e, side) {
  e.preventDefault();
  if (!roundActive || answered) return;
  listenTo(side);
}

function onTierTap(e, tier) {
  e.preventDefault();
  setTier(tier);
}

function onSrcTap(e, src) {
  e.preventDefault();
  setSource(src);
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(firstTap) {
  gameStarted = true;
  newRound(firstTap);
}

function newRound(forceListen) {
  clearTimeout(nextTimeout);
  stopAudio();

  answered    = false;
  roundActive = true;
  totalRounds++;
  document.getElementById('roundVal').textContent = totalRounds;

  compressedSide = Math.random() > 0.5 ? 'A' : 'B';
  pathGainA = pathGainB = 0.55;
  listeningTo = forceListen || 'A';

  // Reset prompt card
  const pc = document.getElementById('promptCard');
  pc.classList.remove('correct-flash','wrong-flash');
  document.getElementById('resultBadge').className  = 'result-badge';
  document.getElementById('resultBadge').textContent = '';
  document.getElementById('promptText').innerHTML =
    `Which signal is <span>compressed</span>? Listen to <span>A</span> & <span>B</span>, then tap your answer`;
  document.getElementById('switchRow').style.display = 'flex';
  document.getElementById('grRow').style.display     = 'none';

  // Reset cards
  resetCard('A');
  resetCard('B');
  document.getElementById('subA').textContent = 'Tap to answer';
  document.getElementById('subB').textContent = 'Tap to answer';

  if (sourceType === 'loops') loopIdx = Math.floor(Math.random() * IOS_LOOPS.length);

  buildAudioGraph();
  updateSwitchUI();
  updatePlayingCards();
}

function resetCard(side) {
  const card = document.getElementById(`card${side}`);
  card.className = `ab-card card-${side.toLowerCase()}`;
  document.getElementById(`cardResult${side}`).textContent = '';
  document.getElementById(`cardTier${side}`).textContent   = '';
}

// ── Answer ────────────────────────────────────────────────────────────────────
function selectAnswer(side) {
  if (!roundActive || answered) return;
  answered = true;

  const correct  = (side === compressedSide);
  const maxPts   = window.ScoringEngine ? ScoringEngine.points('quick-compress-ios', { tier: currentTier }) : 100;
  const multLbl  = window.ScoringEngine ? ScoringEngine.label('quick-compress-ios', { tier: currentTier }) : '×1.0';
  if (correct) { totalScore += maxPts; streak++; correctCount++; }
  else streak = 0;

  document.getElementById('scoreVal').textContent    = totalScore;
  document.getElementById('streakVal').textContent   = streak;
  document.getElementById('accuracyVal').textContent =
    totalRounds > 0 ? Math.round(correctCount / totalRounds * 100) + '%' : '—';

  const wrongSide = compressedSide === 'A' ? 'B' : 'A';
  const correctCard = document.getElementById(`card${compressedSide}`);
  const wrongCard   = document.getElementById(`card${wrongSide}`);

  if (correct) {
    // User nailed it — full green on their pick
    correctCard.classList.add('correct');
    wrongCard.classList.add('dimmed');
  } else {
    // Wrong — red on user's pick, subtle dashed green on the correct card
    document.getElementById(`card${side}`).classList.add('wrong');
    correctCard.classList.add('reveal');
    // The other non-picked, non-correct card (if any) gets dimmed
    if (wrongSide !== side) wrongCard.classList.add('dimmed');
  }

  // Card result labels
  document.getElementById(`cardResult${compressedSide}`).textContent = correct ? '✓ Compressed' : '→ Compressed';
  document.getElementById(`cardResult${wrongSide}`).textContent      = 'Dry';
  document.getElementById(`cardTier${compressedSide}`).textContent   =
    `${TIER_LABELS[currentTier]}`;
  document.getElementById(`cardTier${wrongSide}`).textContent = 'No compression';

  // Prompt card
  const pc = document.getElementById('promptCard');
  pc.classList.add(correct ? 'correct-flash' : 'wrong-flash');
  const rb = document.getElementById('resultBadge');
  rb.textContent = correct ? `✓  +${maxPts} pts  ${multLbl}` : `✗ It was ${compressedSide}`;
  rb.className   = `result-badge ${correct ? 'good' : 'bad'}`;
  document.getElementById('promptText').innerHTML = correct
    ? `🎯 <span>${compressedSide}</span> was compressed — ${TIER_LABELS[currentTier]} — tap anywhere to continue`
    : `✗ <span>${compressedSide}</span> was the compressed one — keep training — tap anywhere to continue`;

  // Hide switch, show GR
  document.getElementById('switchRow').style.display = 'none';
  document.getElementById('grRow').style.display     = 'flex';

  // Clear playing state from cards
  document.getElementById('cardA').classList.remove('playing');
  document.getElementById('cardB').classList.remove('playing');

  // Sub labels
  document.getElementById('subA').textContent = '';
  document.getElementById('subB').textContent = '';

  if (window.SonicSandbox) {
    const rawScore = correct ? 100 : 0;
    SonicSandbox.saveScore({ game: 'quick-compress-ios', correct, roundScore: correct ? maxPts : 0, rawScore });
  }

  addHistory(correct);

  // Play compressed side so user can hear it clearly
  listenTo(compressedSide);
}

// ── Listen ─────────────────────────────────────────────────────────────────────
function listenTo(side) {
  if (!audioCtx || !gainA || !gainB) return;
  listeningTo = side;
  const now = audioCtx.currentTime;
  gainA.gain.setTargetAtTime(side === 'A' ? pathGainA : 0, now, 0.02);
  gainB.gain.setTargetAtTime(side === 'B' ? pathGainB : 0, now, 0.02);
  updateSwitchUI();
  updatePlayingCards();
}

function updateSwitchUI() {
  const swA = document.getElementById('swA');
  const swB = document.getElementById('swB');
  swA.className = 'sw-btn' + (listeningTo === 'A' ? ' active-a' : '');
  swB.className = 'sw-btn' + (listeningTo === 'B' ? ' active-b' : '');
}

function updatePlayingCards() {
  if (answered) return;
  document.getElementById('cardA').classList.toggle('playing', listeningTo === 'A');
  document.getElementById('cardB').classList.toggle('playing', listeningTo === 'B');
}

// ── K-weighted LUFS matching ──────────────────────────────────────────────────
function createKWeightedAnalyser(src) {
  const shelf = audioCtx.createBiquadFilter();
  shelf.type = 'highshelf'; shelf.frequency.value = 1681.97; shelf.gain.value = 4.0;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 38.13; hp.Q.value = 0.5;
  const analyser = audioCtx.createAnalyser(); analyser.fftSize = 8192;
  src.connect(shelf); shelf.connect(hp); hp.connect(analyser);
  return { analyser, nodes: [shelf, hp] };
}

function getKWeightedRms(analyser) {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}

function matchLufsLevels() {
  if (!analyserA || !analyserB || !compressedSide || !gainA || !gainB) return;
  const lufsA = getKWeightedRms(analyserA);
  const lufsB = getKWeightedRms(analyserB);
  if (lufsA < 0.00003 || lufsB < 0.00003) return;

  let lufsWet, lufsDry;
  if (compressedSide === 'A') { lufsWet = lufsA; lufsDry = lufsB; }
  else                        { lufsWet = lufsB; lufsDry = lufsA; }

  const ratio   = lufsWet / lufsDry;
  const gainWet = Math.min(Math.max(1.1 / (ratio + 1), 0.05), 1.0);
  const gainDry = Math.min(Math.max(ratio * gainWet, 0.05), 1.0);

  if (compressedSide === 'A') { pathGainA = gainWet; pathGainB = gainDry; }
  else                        { pathGainA = gainDry; pathGainB = gainWet; }

  const now = audioCtx.currentTime;
  gainA.gain.setTargetAtTime(listeningTo === 'A' ? pathGainA : 0, now, 0.6);
  gainB.gain.setTargetAtTime(listeningTo === 'B' ? pathGainB : 0, now, 0.6);
}

function startLufsMatching() {
  if (lufsIntervalId) { clearInterval(lufsIntervalId); lufsIntervalId = null; }
  setTimeout(() => {
    if (!roundActive) return;
    lufsIntervalId = setInterval(matchLufsLevels, 200);
  }, 250);
}

// ── Audio graph ───────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(secs) {
  const rate = audioCtx.sampleRate, len = Math.ceil(rate * secs);
  const buf = audioCtx.createBuffer(1, len, rate);
  const d   = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.loop = true; return src;
}

function buildAudioGraph() {
  stopAudio();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const tier = TIERS[currentTier];

  masterOut = audioCtx.createGain(); masterOut.gain.value = 1;
  masterOut.connect(audioCtx.destination);

  gainA = audioCtx.createGain(); gainA.gain.value = listeningTo === 'A' ? pathGainA : 0;
  gainB = audioCtx.createGain(); gainB.gain.value = listeningTo === 'B' ? pathGainB : 0;
  gainA.connect(masterOut); gainB.connect(masterOut);

  sourceBusA = audioCtx.createGain(); sourceBusA.gain.value = 1;
  sourceBusB = audioCtx.createGain(); sourceBusB.gain.value = 1;

  compNode = audioCtx.createDynamicsCompressor();
  compNode.threshold.value = tier.threshold;
  compNode.ratio.value     = tier.ratio;
  compNode.attack.value    = tier.attack;
  compNode.release.value   = tier.release;
  compNode.knee.value      = tier.knee;

  junctionA = audioCtx.createGain(); junctionA.gain.value = 1;
  junctionB = audioCtx.createGain(); junctionB.gain.value = 1;

  if (compressedSide === 'A') {
    sourceBusA.connect(compNode); compNode.connect(junctionA);
    sourceBusB.connect(junctionB);
  } else {
    sourceBusB.connect(compNode); compNode.connect(junctionB);
    sourceBusA.connect(junctionA);
  }

  junctionA.connect(gainA);
  junctionB.connect(gainB);

  const measA = createKWeightedAnalyser(junctionA);
  const measB = createKWeightedAnalyser(junctionB);
  analyserA = measA.analyser; kNodesA = measA.nodes;
  analyserB = measB.analyser; kNodesB = measB.nodes;

  if (sourceType === 'loops') buildLoopSources();
  else                        buildPinkSources();

  startGRMeter();
  startLufsMatching();
}

function buildPinkSources() {
  sourceA = makePinkNoise(5);
  sourceB = makePinkNoise(5);
  const pgA = audioCtx.createGain(); pgA.gain.value = 0.18;
  const pgB = audioCtx.createGain(); pgB.gain.value = 0.18;
  sourceA.connect(pgA); pgA.connect(sourceBusA);
  sourceB.connect(pgB); pgB.connect(sourceBusB);
  sourceA.start(0); sourceB.start(0);
}

function buildLoopSources() {
  if (!loopAudioEl) {
    loopAudioEl = new Audio(); loopAudioEl.loop = true;
    loopAudioEl.crossOrigin = 'anonymous';
  }
  if (!loopMediaSrc) {
    loopMediaSrc = audioCtx.createMediaElementSource(loopAudioEl);
  }

  const fname = IOS_LOOPS[loopIdx % IOS_LOOPS.length];
  if (loopAudioEl._currentFname !== fname) {
    loopAudioEl.src = `../../samples/loops/${fname}`;
    loopAudioEl._currentFname = fname;
  }

  const pgA = audioCtx.createGain(); pgA.gain.value = 0.18;
  const pgB = audioCtx.createGain(); pgB.gain.value = 0.18;
  loopMediaSrc.connect(pgA); pgA.connect(sourceBusA);
  loopMediaSrc.connect(pgB); pgB.connect(sourceBusB);
  loopAudioEl.play().catch(() => {});
}

// ── GR meter ──────────────────────────────────────────────────────────────────
function startGRMeter() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  const loop = () => {
    animFrameId = requestAnimationFrame(loop);
    if (!compNode) return;
    const gr  = -compNode.reduction;
    const pct = Math.min(100, (gr / 20) * 100);
    document.getElementById('grFill').style.width = pct + '%';
    document.getElementById('grVal').textContent  = gr > 0.1 ? `−${gr.toFixed(1)} dB` : '0.0 dB';
  };
  loop();
}

// ── Stop audio ────────────────────────────────────────────────────────────────
function stopAudio() {
  if (lufsIntervalId) { clearInterval(lufsIntervalId); lufsIntervalId = null; }
  if (animFrameId)    { cancelAnimationFrame(animFrameId); animFrameId = null; }
  if (shotTimerA)     { clearInterval(shotTimerA); shotTimerA = null; }

  [sourceA, sourceB].forEach(s => { if (s) { try { s.stop(); } catch(e){} } });
  sourceA = sourceB = null;

  if (loopAudioEl)   loopAudioEl.pause();
  if (loopMediaSrc)  { try { loopMediaSrc.disconnect(); } catch(e){} }

  [...kNodesA, ...kNodesB, analyserA, analyserB,
   junctionA, junctionB, compNode,
   sourceBusA, sourceBusB, gainA, gainB, masterOut].forEach(n => {
    if (n) { try { n.disconnect(); } catch(e){} }
  });
  kNodesA = []; kNodesB = [];
  analyserA = analyserB = junctionA = junctionB = null;
  compNode = sourceBusA = sourceBusB = gainA = gainB = masterOut = null;
}

// ── Settings ──────────────────────────────────────────────────────────────────
function setTier(t) {
  currentTier = t;
  ['Easy','Medium','Hard','Subtle'].forEach(n => {
    const el = document.getElementById(`pill${n}`);
    if (el) el.classList.toggle('active', n.toLowerCase() === t);
  });
  if (roundActive) newRound();
}

function setSource(src) {
  sourceType = src;
  document.getElementById('srcPink').classList.toggle('active',  src === 'pink');
  document.getElementById('srcLoops').classList.toggle('active', src === 'loops');
  if (roundActive) buildAudioGraph();
}

// ── History ───────────────────────────────────────────────────────────────────
function addHistory(correct) {
  const strip = document.getElementById('historyStrip');
  const dot   = document.createElement('div');
  dot.className = `hist-dot ${correct ? 'c' : 'w'}`;
  strip.appendChild(dot);
  while (strip.children.length > 30) strip.removeChild(strip.firstChild);
}

// ── Tap anywhere to advance after answering ───────────────────────────────────
// Card taps stopPropagation so they never reach here — this catches taps on
// the prompt card, history strip, and any other non-card, non-footer area.
document.addEventListener('touchend', e => {
  if (!answered || !roundActive) return;
  if (e.target.closest('.footer')) return;
  if (e.target.closest('.header')) return;
  if (e.target.closest('#switchRow')) return;
  newRound();
}, { passive: true });
</script>
