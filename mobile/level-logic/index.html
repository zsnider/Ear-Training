<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Level Logic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #080a0e;
    --surface:  #111520;
    --surface2: #181e2e;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --text:     #e8edf8;
    --muted:    #5a6480;
    --accent:   #f0b429;
    --accent2:  #ffd166;
    --up:       #3ecf8e;
    --down:     #f45b69;
    --correct:  #3ecf8e;
    --wrong:    #f45b69;
    --a-color:  #8892ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    user-select: none;
    touch-action: manipulation;
  }

  /* ── Layout shell ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    color: var(--muted);
    font-size: 18px;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--surface2); }

  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.06em;
  }
  .brand-name span { color: var(--accent); }

  .stats-row { display: flex; align-items: center; gap: 14px; }
  .stat { text-align: center; }
  .stat-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px; font-weight: 700;
    color: var(--accent2); line-height: 1;
  }
  .stat-label {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
  }
  .vdiv { width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; }

  /* ── Main game area ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
    gap: 10px;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Prompt card ── */
  .prompt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    flex-shrink: 0;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .prompt-card.correct-flash {
    border-color: var(--correct);
    box-shadow: 0 0 24px rgba(62,207,142,0.2);
  }
  .prompt-card.wrong-flash {
    border-color: var(--wrong);
    box-shadow: 0 0 24px rgba(244,91,105,0.2);
  }

  /* A / B monitor buttons */
  .monitor-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .btn-monitor {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 700;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
    letter-spacing: 0.04em;
  }
  .btn-monitor:active:not(:disabled) { transform: scale(0.97); }
  .btn-monitor:disabled { opacity: 0.35; }
  .btn-monitor.monitor-a.active {
    background: rgba(136,146,255,0.12);
    border-color: var(--a-color);
    color: var(--a-color);
  }
  .btn-monitor.monitor-b.active {
    background: rgba(240,180,41,0.12);
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .prompt-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .prompt-text {
    font-size: 15px; font-weight: 500;
    color: var(--text); line-height: 1.35;
  }
  .prompt-text span {
    color: var(--accent2);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }

  .result-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px; font-weight: 700;
    opacity: 0; transition: opacity 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .result-badge.show-correct { opacity: 1; color: var(--correct); }
  .result-badge.show-wrong   { opacity: 1; color: var(--wrong); }

  /* ── Progress bar ── */
  .progress-bar {
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
    display: none;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    background: var(--accent); width: 100%; transition: none;
  }

  /* ── Playing indicator ── */
  .playing-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 11px; color: var(--muted);
    flex-shrink: 0; height: 16px;
  }
  .playing-bar .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: pdot 1.1s infinite;
  }
  @keyframes pdot {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.3; transform: scale(0.6); }
  }
  .playing-bar.hidden { visibility: hidden; }

  /* ── Level meter (revealed after answer) ── */
  .meter-wrap {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: none;
  }
  .meter-wrap.visible { display: block; }
  canvas#meterCanvas { display: block; width: 100%; height: 80px; }

  /* ── dB answer grid — always 2×2 ── */
  .db-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  .db-btn {
    background: var(--surface);
    border: 1.5px solid var(--border2);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .db-btn:active:not(:disabled) { transform: scale(0.95); }
  .db-btn:disabled { cursor: not-allowed; }

  /* Idle state (before first tap) */
  .db-btn.idle {
    border-color: rgba(240,180,41,0.2);
  }
  .db-btn.idle:active {
    border-color: var(--accent);
    background: rgba(240,180,41,0.06);
  }

  .db-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em; line-height: 1;
  }
  .db-val.positive { color: var(--up); }
  .db-val.negative { color: var(--down); }
  .db-sub {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* Answer states */
  .db-btn.correct { background: rgba(62,207,142,0.15); border-color: var(--correct); box-shadow: 0 0 20px rgba(62,207,142,0.2); }
  .db-btn.correct .db-val { color: var(--correct); }
  .db-btn.wrong   { background: rgba(244,91,105,0.1); border-color: var(--wrong); }
  .db-btn.wrong .db-val { color: var(--wrong); }
  .db-btn.reveal  { background: rgba(62,207,142,0.08); border-color: rgba(62,207,142,0.45); border-style: dashed; }
  .db-btn.reveal .db-val { color: var(--correct); }
  .db-btn.dimmed  { opacity: 0.22; }

  /* ── History strip ── */
  .history-strip {
    display: flex; gap: 5px; flex-wrap: wrap;
    justify-content: center; min-height: 12px; flex-shrink: 0;
  }
  .hist-dot { width: 8px; height: 8px; border-radius: 50%; }
  .hist-dot.c { background: var(--correct); }
  .hist-dot.w { background: var(--wrong); }

  /* ── Footer ── */
  footer {
    padding: 8px 16px 12px;
    display: flex; flex-direction: column; gap: 7px; flex-shrink: 0;
  }

  .footer-row {
    display: flex; gap: 7px; align-items: center;
  }

  .ctrl-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 9px 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    white-space: nowrap;
  }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.active {
    background: rgba(240,180,41,0.1);
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .row-divider {
    width: 1px; align-self: stretch;
    background: var(--border2); flex-shrink: 0; margin: 0 1px;
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="header-left">
      <a class="back-btn" href="/mobile/">‹</a>
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <rect x="2"  y="6"  width="4.5" height="10" rx="1.3" fill="black" opacity="0.9"/>
            <rect x="11" y="2"  width="4.5" height="14" rx="1.3" fill="black" opacity="0.9"/>
          </svg>
        </div>
        <span class="brand-name">LEVEL <span>LOGIC</span></span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-val" id="scoreVal">0</div>
        <div class="stat-label">Score</div>
      </div>
      <div class="vdiv"></div>
      <div class="stat">
        <div class="stat-val" id="streakVal">0</div>
        <div class="stat-label">Streak</div>
      </div>
      <div class="vdiv"></div>
      <div class="stat">
        <div class="stat-val" id="accuracyVal">—</div>
        <div class="stat-label">Acc</div>
      </div>
    </div>
  </header>

  <!-- Game -->
  <main>

    <!-- Prompt card -->
    <div class="prompt-card" id="promptCard">
      <div class="monitor-row">
        <button class="btn-monitor monitor-a" id="btnA" onclick="setMonitor('A')" disabled>A — Original</button>
        <button class="btn-monitor monitor-b active" id="btnB" onclick="setMonitor('B')" disabled>B — Adjusted</button>
      </div>
      <div class="prompt-bottom">
        <div class="prompt-text" id="promptText">Tap any tile to begin</div>
        <div class="result-badge" id="resultBadge"></div>
      </div>
    </div>

    <!-- Progress countdown bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Playing indicator -->
    <div class="playing-bar hidden" id="playingBar">
      <div class="dot"></div>
      <span>Listening…</span>
    </div>

    <!-- Level meter — hidden until answer revealed -->
    <div class="meter-wrap" id="meterWrap">
      <canvas id="meterCanvas"></canvas>
    </div>

    <!-- dB answer grid — filled by JS -->
    <div class="db-grid" id="dbGrid"></div>

    <!-- History strip -->
    <div class="history-strip" id="historyStrip"></div>

  </main>

  <!-- Footer: difficulty / direction / source -->
  <footer>
    <div class="footer-row">
      <button class="ctrl-btn active" id="diffEasy"   onclick="setDifficulty('easy',this)">Easy</button>
      <button class="ctrl-btn"        id="diffMedium" onclick="setDifficulty('medium',this)">Medium</button>
      <button class="ctrl-btn"        id="diffHard"   onclick="setDifficulty('hard',this)">Hard</button>
      <button class="ctrl-btn"        id="diffExpert" onclick="setDifficulty('expert',this)">Expert</button>
    </div>
    <div class="footer-row">
      <button class="ctrl-btn active" id="dirBoth" onclick="setDirection('both',this)">↕ Both</button>
      <button class="ctrl-btn"        id="dirUp"   onclick="setDirection('up',this)">↑ Boost</button>
      <button class="ctrl-btn"        id="dirDown" onclick="setDirection('down',this)">↓ Cut</button>
      <div class="row-divider"></div>
      <button class="ctrl-btn active" id="srcPink" onclick="setSource('pink')">Pink</button>
      <button class="ctrl-btn"        id="srcLoop" onclick="setSource('loop')">Loops</button>
    </div>
  </footer>

</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const DB_SETS = {
  easy:   [3, 6, 9, 12],
  medium: [2, 3, 6, 9],
  hard:   [1, 2, 3, 6],
  expert: [0.5, 1, 2, 3],
};

const IOS_LOOPS = [
  'alex-morgan-acid-jazz-groove-517096.mp3',
  'alex-morgan-bebop-coffee-shop-517090.mp3',
  'atlasaudio-house-518082.mp3',
  'cyberwave-orchestra-orchestral-music-loop-287416.mp3',
  'joyinsound-corporate-background-music-quiet-progress-507151.mp3',
  'leberch-spain-518570.mp3',
  'mkgomez-minimal-techno-background-loop-475852.mp3',
  'nastelbom-lounge-house-314576.mp3',
  'ohpalmusic-passive-hip-hop-beat-90bpm-d-minor-177334.mp3',
  'openmindaudio-deep-club-organic-house-music-ashen-palms-524258.mp3',
  'openmindaudio-epic-organic-house-music-driftwood-ritual-524274.mp3',
  'prettyjohn1-chill-520383.mp3',
  'prettyjohn1-disco-funk-520385.mp3',
  'prettyjohn1-retro-funk-523181.mp3',
  'sonican-acoustic-senses-loop-313230.mp3',
  'sonican-feelgood-acoustic-loop-320856.mp3',
  'sonican-positive-corporate-music-optimistic-loop-464544.mp3',
  'sonofevan-gravel-in-my-lungs-470048.mp3',
  'the_mountain-deep-house-483808.mp3',
  'the_mountain-event-522459.mp3',
  'the_mountain-hi-tech-loop-151203.mp3',
  'the_mountain-loop-beat-130010.mp3',
  'the_mountain-soft-loop-130012.mp3',
  'the_mountain-vlog-522479.mp3',
  'tunetank-soft-house-music-348241.mp3',
];

// ── State ──────────────────────────────────────────────────────────────────────
let difficulty     = 'easy';
let direction      = 'both';
let sourceType     = 'pink';
let targetDb       = null;
let lastTargetDb   = null;
let currentMonitor = 'B';
let roundActive    = false;
let answered       = false;
let gameStarted    = false;
let currentChoices = [];
let score = 0, streak = 0, totalRounds = 0, correctCount = 0;
let nextTimeout    = null;

// ── Audio state ────────────────────────────────────────────────────────────────
let audioCtx    = null;
let gainNode    = null;
let outGain     = null;
let noiseSource = null;
let isPlaying   = false;
let loopIdx     = 0;
let loopAudioEl = null, loopMediaSrc = null;

// ── Helpers ────────────────────────────────────────────────────────────────────
function dbToLinear(db) { return Math.pow(10, db / 20); }

function fmtDb(v) {
  const abs = Math.abs(v);
  const str = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
  return (v > 0 ? '+' : '−') + str;
}

function randNext(len, cur) {
  if (len <= 1) return 0;
  let n;
  do { n = Math.floor(Math.random() * len); } while (n === cur);
  return n;
}

// ── Audio ──────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(secs) {
  const rate = audioCtx.sampleRate;
  const len  = Math.ceil(rate * secs);
  const buf  = audioCtx.createBuffer(1, len, rate);
  const d    = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  return src;
}

function stopPlayback() {
  if (noiseSource && noiseSource !== loopMediaSrc) {
    try { noiseSource.stop(); } catch(e) {}
  }
  noiseSource = null;
  if (loopAudioEl) loopAudioEl.pause();
  if (loopMediaSrc) { try { loopMediaSrc.disconnect(); } catch(e) {} }
  if (gainNode) { try { gainNode.disconnect(); } catch(e) {} gainNode = null; }
  if (outGain)  { try { outGain.disconnect();  } catch(e) {} outGain  = null; }
  isPlaying = false;
}

function playRound() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopPlayback();

  gainNode = audioCtx.createGain();
  gainNode.gain.value = dbToLinear(targetDb); // start in B (adjusted) mode
  outGain  = audioCtx.createGain();
  outGain.gain.value = 0.7;
  gainNode.connect(outGain);
  outGain.connect(audioCtx.destination);

  if (sourceType === 'loop') {
    if (!loopAudioEl) { loopAudioEl = new Audio(); loopAudioEl.loop = true; }
    if (!loopMediaSrc) { loopMediaSrc = audioCtx.createMediaElementSource(loopAudioEl); }
    const fname = IOS_LOOPS[loopIdx % IOS_LOOPS.length];
    if (loopAudioEl._currentFname !== fname) {
      loopAudioEl.src = `../../samples/loops/${fname}`;
      loopAudioEl._currentFname = fname;
    }
    loopMediaSrc.connect(gainNode);
    loopAudioEl.play().catch(e => console.warn('loop blocked:', e));
    noiseSource = loopMediaSrc;
  } else {
    const src = makePinkNoise(6);
    src.loop = true;
    src.connect(gainNode);
    src.start(0);
    noiseSource = src;
  }

  isPlaying = true;
}

// ── Monitor toggle ─────────────────────────────────────────────────────────────
function setMonitor(m) {
  if (!roundActive || answered) return;
  currentMonitor = m;
  if (gainNode && audioCtx) {
    const target = m === 'A' ? 1.0 : dbToLinear(targetDb);
    gainNode.gain.setTargetAtTime(target, audioCtx.currentTime, 0.008);
  }
  document.getElementById('btnA').classList.toggle('active', m === 'A');
  document.getElementById('btnB').classList.toggle('active', m === 'B');
}

// ── Settings ───────────────────────────────────────────────────────────────────
function setDifficulty(d, el) {
  difficulty = d;
  ['diffEasy','diffMedium','diffHard','diffExpert'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
  if (roundActive && !answered) newRound();
  else if (!gameStarted) buildIdleGrid();
}

function setDirection(d, el) {
  direction = d;
  ['dirBoth','dirUp','dirDown'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
  if (roundActive && !answered) newRound();
  else if (!gameStarted) buildIdleGrid();
}

function setSource(type) {
  sourceType = type;
  document.getElementById('srcPink').classList.toggle('active', type === 'pink');
  document.getElementById('srcLoop').classList.toggle('active', type === 'loop');
}

// ── Option pool (all valid values for current settings) ───────────────────────
function getPool() {
  const abs = DB_SETS[difficulty];
  let opts = [];
  if (direction !== 'down') opts = opts.concat(abs.map(v => +v));
  if (direction !== 'up')   opts = opts.concat(abs.map(v => -v));
  return opts;
}

function pickTarget() {
  let pool = getPool();
  if (pool.length > 1 && lastTargetDb !== null)
    pool = pool.filter(v => v !== lastTargetDb);
  return pool[Math.floor(Math.random() * pool.length)];
}

// Pick 4 choices: the correct answer + 3 random distractors, sorted numerically
function pickChoices(target) {
  const pool = getPool().filter(v => v !== target);
  // Shuffle pool
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const choices = [target, ...pool.slice(0, 3)];
  return choices.sort((a, b) => a - b);
}

// ── Build grid ─────────────────────────────────────────────────────────────────
function buildGrid(choices, idle) {
  const grid = document.getElementById('dbGrid');
  grid.innerHTML = '';

  choices.forEach(db => {
    const btn = document.createElement('button');
    btn.id = `db-${db}`;
    btn.dataset.db = db;
    btn.className = 'db-btn' + (idle ? ' idle' : '');
    btn.disabled = idle;
    const cls = db > 0 ? 'positive' : db < 0 ? 'negative' : '';
    btn.innerHTML = `<div class="db-val ${cls}">${fmtDb(db)}</div><div class="db-sub">dB</div>`;
    btn.addEventListener('click', () => {
      if (!gameStarted) { startGame(); return; }
      submitAnswer(db);
    });
    grid.appendChild(btn);
  });
}

function buildIdleGrid() {
  // Show 4 values from the current pool as a teaser
  const pool = getPool();
  const sample = [...pool].sort(() => Math.random() - 0.5).slice(0, 4).sort((a, b) => a - b);
  buildGrid(sample, true);
}

// ── Game flow ──────────────────────────────────────────────────────────────────
function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  gameStarted = true;
  newRound();
}

function newRound() {
  clearTimeout(nextTimeout);
  stopPlayback();
  hideMeter();

  if (sourceType === 'loop')
    loopIdx = randNext(IOS_LOOPS.length, loopIdx);

  answered       = false;
  roundActive    = true;
  currentMonitor = 'B';
  targetDb       = pickTarget();
  lastTargetDb   = targetDb;
  totalRounds++;

  // Prompt
  document.getElementById('promptText').innerHTML =
    `Compare <span>A</span> and <span>B</span>. How many dB did the level change?`;
  document.getElementById('promptCard').classList.remove('correct-flash', 'wrong-flash');
  const rb = document.getElementById('resultBadge');
  rb.className = 'result-badge'; rb.textContent = '';
  document.getElementById('progressBar').style.display = 'none';

  // A/B buttons — enabled, B active
  document.getElementById('btnA').disabled = false;
  document.getElementById('btnB').disabled = false;
  document.getElementById('btnA').classList.remove('active');
  document.getElementById('btnB').classList.add('active');

  currentChoices = pickChoices(targetDb);
  buildGrid(currentChoices, false);
  showPlayingBar(true);
  playRound();
}

// ── Answer ─────────────────────────────────────────────────────────────────────
function submitAnswer(clickedDb) {
  if (!roundActive || answered) return;
  answered = true;
  stopPlayback();
  showPlayingBar(false);

  const isCorrect = (parseFloat(clickedDb) === parseFloat(targetDb));
  if (isCorrect) { score++; streak++; correctCount++; } else { streak = 0; }

  if (window.SonicSandbox) {
    SonicSandbox.saveScore({ game: 'level-logic', correct: isCorrect, roundScore: isCorrect ? 100 : 0 });
  }

  document.getElementById('scoreVal').textContent    = score;
  document.getElementById('streakVal').textContent   = streak;
  document.getElementById('accuracyVal').textContent =
    totalRounds > 0 ? Math.round(correctCount / totalRounds * 100) + '%' : '—';

  // Colour the buttons
  currentChoices.forEach(db => {
    const btn = document.getElementById(`db-${db}`);
    if (!btn) return;
    btn.disabled = true;
    const isTarget  = parseFloat(db) === parseFloat(targetDb);
    const isClicked = parseFloat(db) === parseFloat(clickedDb);
    if      (isTarget && isCorrect)        btn.classList.add('correct');
    else if (isClicked && !isCorrect)      btn.classList.add('wrong');
    else if (isTarget && !isCorrect)       btn.classList.add('reveal');
    else                                   btn.classList.add('dimmed');
  });

  // Disable A/B monitors
  document.getElementById('btnA').disabled = true;
  document.getElementById('btnB').disabled = true;

  // Prompt card flash
  document.getElementById('promptCard').classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
  rb.textContent = isCorrect ? '✓' : `✗ ${fmtDb(targetDb)} dB`;
  rb.className   = `result-badge ${isCorrect ? 'show-correct' : 'show-wrong'}`;

  // Reveal meter
  showMeter(targetDb);
  addHistory(isCorrect);

  // Countdown to next round
  const delay = isCorrect ? 1200 : 2000;
  const bar  = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  bar.style.display = 'block';
  fill.style.transition = 'none'; fill.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${delay}ms linear`;
    fill.style.width = '0%';
  }));
  nextTimeout = setTimeout(newRound, delay);
}

// Need rb in submitAnswer scope
const rb = document.getElementById('resultBadge');

// ── Level meter ────────────────────────────────────────────────────────────────
function showMeter(db) {
  const wrap   = document.getElementById('meterWrap');
  const canvas = document.getElementById('meterCanvas');
  wrap.classList.add('visible');

  const dpr = window.devicePixelRatio || 1;
  const W   = wrap.clientWidth;
  const H   = 80;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);
  c.fillStyle = '#0c0f14';
  c.fillRect(0, 0, W, H);

  const barW   = Math.min(42, W / 7);
  const gap    = barW * 2.2;
  const totalW = barW * 2 + gap;
  const startX = (W - totalW) / 2;
  const baseY  = H - 14;
  const maxH   = H - 22;
  const refH   = maxH * 0.55;

  // 0 dB reference line
  c.strokeStyle = 'rgba(255,255,255,0.08)';
  c.lineWidth = 1; c.setLineDash([3,4]);
  c.beginPath(); c.moveTo(0, baseY - refH); c.lineTo(W, baseY - refH); c.stroke();
  c.setLineDash([]);

  c.fillStyle = 'rgba(255,255,255,0.18)';
  c.font = `9px 'IBM Plex Mono', monospace`;
  c.textAlign = 'left';
  c.fillText('0 dB', 8, baseY - refH - 4);

  // A bar (reference)
  const gradA = c.createLinearGradient(0, baseY - refH, 0, baseY);
  gradA.addColorStop(0, 'rgba(136,146,255,0.85)');
  gradA.addColorStop(1, 'rgba(91,106,255,0.22)');
  c.fillStyle = gradA;
  c.fillRect(startX, baseY - refH, barW, refH);
  c.fillStyle = '#8892ff';
  c.fillRect(startX, baseY - refH, barW, 2);

  // B bar (gain-adjusted)
  const linear = Math.pow(10, db / 20);
  const adjH   = Math.max(4, Math.min(maxH, refH * linear));
  const bX     = startX + barW + gap;
  const bIsUp  = db >= 0;
  const gradB  = c.createLinearGradient(0, baseY - adjH, 0, baseY);
  gradB.addColorStop(0, bIsUp ? 'rgba(62,207,142,0.85)' : 'rgba(244,91,105,0.85)');
  gradB.addColorStop(1, bIsUp ? 'rgba(62,207,142,0.2)'  : 'rgba(244,91,105,0.2)');
  c.fillStyle = gradB;
  c.fillRect(bX, baseY - adjH, barW, adjH);
  c.fillStyle = bIsUp ? '#3ecf8e' : '#f45b69';
  c.fillRect(bX, baseY - adjH, barW, 2);

  // Bar labels
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.font = `10px 'IBM Plex Mono', monospace`; c.textAlign = 'center';
  c.fillText('A', startX + barW / 2, baseY + 10);
  c.fillText('B', bX + barW / 2, baseY + 10);

  // dB connector + label
  const aTopY = baseY - refH, bTopY = baseY - adjH;
  const midX  = startX + barW + gap / 2;
  c.strokeStyle = bIsUp ? 'rgba(62,207,142,0.45)' : 'rgba(244,91,105,0.45)';
  c.lineWidth = 1.5; c.setLineDash([3,3]);
  c.beginPath(); c.moveTo(startX + barW, aTopY); c.lineTo(bX, bTopY); c.stroke();
  c.setLineDash([]);
  const labelY = Math.min(aTopY, bTopY) - 7;
  c.fillStyle = bIsUp ? '#3ecf8e' : '#f45b69';
  c.font = `bold 12px 'IBM Plex Mono', monospace`; c.textAlign = 'center';
  c.fillText(fmtDb(db) + ' dB', midX, labelY);
}

function hideMeter() {
  document.getElementById('meterWrap').classList.remove('visible');
}

// ── History ────────────────────────────────────────────────────────────────────
function addHistory(correct) {
  const strip = document.getElementById('historyStrip');
  const dot   = document.createElement('div');
  dot.className = `hist-dot ${correct ? 'c' : 'w'}`;
  strip.appendChild(dot);
  while (strip.children.length > 30) strip.removeChild(strip.firstChild);
}

function showPlayingBar(show) {
  document.getElementById('playingBar').classList.toggle('hidden', !show);
}

// ── Init ───────────────────────────────────────────────────────────────────────
buildIdleGrid();
</script>
