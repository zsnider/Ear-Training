<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickEQ">
<title>QuickEQ</title>
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:       #080a0e;
  --bg2:      #0c0f14;
  --surface:  #111520;
  --surface2: #181e2e;
  --surface3: #1f2638;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --text:     #e8edf8;
  --muted:    #5a6480;
  --accent:   #818cf8;
  --accent2:  #a5b4fc;
  --green:    #3ecf8e;
  --red:      #f45b69;
  --col-a:    #00d4ff;
  --col-b:    #f0a862;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  user-select: none;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 8px;
  flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); text-decoration: none;
  font-size: 18px; line-height: 1; flex-shrink: 0;
  margin-right: 6px;
}
.back-btn:active { background: var(--surface3); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.brand-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
}
.brand-name span { color: var(--accent2); }
.stats { display: flex; gap: 12px; align-items: center; }
.stat { text-align: center; }
.stat-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px; font-weight: 700;
  color: var(--accent2); line-height: 1;
}
.stat-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px;
}
.vdiv { width: 1px; height: 16px; background: var(--border2); }

/* ── Prompt card ── */
.prompt-card {
  margin: 0 12px 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 9px 12px;
  flex-shrink: 0;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.prompt-card.correct-flash { border-color: var(--green); box-shadow: 0 0 16px rgba(62,207,142,0.14); }
.prompt-card.wrong-flash   { border-color: var(--red);   box-shadow: 0 0 14px rgba(244,91,105,0.12); }

.prompt-top {
  display: flex; align-items: center; gap: 8px;
}
.prompt-text {
  font-size: 12px; color: var(--text); flex: 1; line-height: 1.4;
}
.prompt-text span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.result-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 700;
  white-space: nowrap; opacity: 0; transition: opacity 0.15s;
}
.result-badge.good { opacity:1; color: var(--green); }
.result-badge.bad  { opacity:1; color: var(--red); }

/* TARGET/DRY toggle */
.monitor-row {
  display: flex; align-items: center; gap: 6px; margin-top: 7px;
}
.monitor-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.monitor-pill {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px; overflow: hidden;
}
.mon-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 5px 12px;
  border: none; background: transparent;
  color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.mon-btn.active {
  background: rgba(129,140,248,0.2);
  color: var(--accent2);
}

/* ── Panels row ── */
.panels-row {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: 8px;
  margin: 0 12px;
}

.eq-panel {
  flex: 1; min-width: 0; min-height: 0;
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 14px;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.eq-panel.panel-a { --pc: var(--col-a); }
.eq-panel.panel-b { --pc: var(--col-b); }

.eq-panel.reveal-correct {
  border-color: var(--green) !important;
  box-shadow: 0 0 16px rgba(62,207,142,0.18);
}
.eq-panel.reveal-wrong {
  border-color: var(--red) !important;
}
/* Shown when user guessed wrong — subtle hint where the target was */
.eq-panel.reveal-hint {
  border-color: rgba(62,207,142,0.5) !important;
  border-style: dashed !important;
}
/* Decoy panel when user guessed correctly — muted, not red */
.eq-panel.reveal-dimmed {
  opacity: 0.35;
}

/* Panel header */
.panel-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 700; color: var(--pc);
}
.panel-result {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
  opacity: 0; transition: opacity 0.3s;
}
.panel-result.show-correct { opacity:1; color: var(--green); }
.panel-result.show-wrong   { opacity:1; color: var(--red); }

/* Canvas */
.canvas-wrap {
  flex-shrink: 0;
  height: 90px;
  position: relative;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
canvas {
  display: block;
  width: 100%; height: 100%;
}
.canvas-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); flex-direction: column; gap: 4px;
}
.overlay-glyph {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px; color: var(--muted); opacity: 0.5;
}
.overlay-hint {
  font-size: 9px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* Panel bottom row: band info + pick button side-by-side */
.panel-bottom {
  flex: 1; min-height: 0;
  display: flex; flex-direction: row;
  border-top: 1px solid var(--border);
}

/* Band info */
.band-info {
  flex: 1; min-width: 0;
  padding: 7px 10px;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
}
.band-row {
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.band-num  {
  color: rgba(255,255,255,0.25); font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 10px; min-width: 16px; flex-shrink: 0;
}
.band-type {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px;
  min-width: 58px; flex-shrink: 0;
}
.band-freq {
  font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px;
  color: var(--text); flex-shrink: 0;
}
.band-gain {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px;
  flex-shrink: 0;
}
.band-gain.pos { color: var(--green); }
.band-gain.neg { color: var(--red); }
.band-gain.neutral { color: var(--muted); }

/* Panel footer / pick button */
.panel-foot {
  flex-shrink: 0;
  padding: 6px 8px;
  display: flex; align-items: center;
  border-left: 1px solid var(--border);
}
.pick-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 700;
  padding: 10px 18px;
  background: transparent;
  border: 1px solid var(--pc);
  border-radius: 9px;
  color: var(--pc);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.pick-btn:active { background: rgba(255,255,255,0.05); }
.pick-btn:disabled { opacity: 0.35; }

/* ── History ── */
.history-strip {
  display: flex; gap: 5px; padding: 5px 12px 3px;
  flex-wrap: wrap; min-height: 20px; flex-shrink: 0;
}
.hist-dot { width: 8px; height: 8px; border-radius: 50%; }
.hist-dot.c { background: var(--green); }
.hist-dot.w { background: var(--red); }

/* ── Footer ── */
.footer {
  display: flex; flex-direction: column; gap: 5px;
  padding: 3px 12px 7px; flex-shrink: 0;
}
.footer-row { display: flex; gap: 5px; align-items: center; }
.footer-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 600; white-space: nowrap; width: 36px;
}
.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 500;
  padding: 5px 10px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--muted);
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.pill.active {
  border-color: var(--accent2);
  color: var(--accent2);
  background: rgba(129,140,248,0.09);
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="back-btn" href="/mobile/">‹</a>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
        <path d="M2 12 Q5 4 9 9 Q13 14 16 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand-name">Quick<span>EQ</span></span>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="scoreVal">0</div>
      <div class="stat-lbl">Score</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-lbl">Streak</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="accuracyVal">—</div>
      <div class="stat-lbl">Acc</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="roundVal">0</div>
      <div class="stat-lbl">Round</div>
    </div>
  </div>
</div>

<!-- Prompt card -->
<div class="prompt-card" id="promptCard">
  <div class="prompt-top">
    <div class="prompt-text" id="promptText">
      Tap <span>A</span> or <span>B</span> to start — pick the EQ that matches the <span>target</span> sound
    </div>
    <div class="result-badge" id="resultBadge"></div>
  </div>
  <div class="monitor-row" id="monitorRow" style="display:none;">
    <span class="monitor-lbl">Hear</span>
    <div class="monitor-pill">
      <button class="mon-btn active" id="monTarget" ontouchend="onMonTap(event,'target')">TARGET</button>
      <button class="mon-btn"       id="monDry"    ontouchend="onMonTap(event,'dry')">DRY</button>
    </div>
  </div>
</div>

<!-- EQ Panels -->
<div class="panels-row">
  <!-- Panel A -->
  <div class="eq-panel panel-a" id="panelA">
    <div class="panel-hdr">
      <span class="panel-label">EQ A</span>
      <span class="panel-result" id="resultA"></span>
    </div>
    <div class="canvas-wrap" id="wrapA">
      <canvas id="canvasA"></canvas>
      <div class="canvas-overlay" id="overlayA" style="display:none;">
        <span class="overlay-glyph">?</span>
        <span class="overlay-hint">Hidden</span>
      </div>
    </div>
    <div class="panel-bottom">
      <div class="band-info" id="bandInfoA"></div>
      <div class="panel-foot">
        <button class="pick-btn" id="pickA" ontouchend="onPickTap(event,'A')">Pick A</button>
      </div>
    </div>
  </div>

  <!-- Panel B -->
  <div class="eq-panel panel-b" id="panelB">
    <div class="panel-hdr">
      <span class="panel-label">EQ B</span>
      <span class="panel-result" id="resultB"></span>
    </div>
    <div class="canvas-wrap" id="wrapB">
      <canvas id="canvasB"></canvas>
      <div class="canvas-overlay" id="overlayB" style="display:none;">
        <span class="overlay-glyph">?</span>
        <span class="overlay-hint">Hidden</span>
      </div>
    </div>
    <div class="panel-bottom">
      <div class="band-info" id="bandInfoB"></div>
      <div class="panel-foot">
        <button class="pick-btn" id="pickB" ontouchend="onPickTap(event,'B')">Pick B</button>
      </div>
    </div>
  </div>
</div>

<!-- History -->
<div class="history-strip" id="historyStrip"></div>

<!-- Footer -->
<div class="footer">
  <div class="footer-row">
    <span class="footer-lbl">Curves</span>
    <div class="pill active" id="pillShow" ontouchend="onCurvesTap(event,true)">Show</div>
    <div class="pill"        id="pillHide" ontouchend="onCurvesTap(event,false)">Hide</div>
    <span class="footer-lbl" style="margin-left:4px;">Bands</span>
    <div class="pill active" id="pill1" ontouchend="onBandsTap(event,1)">1</div>
    <div class="pill"        id="pill2" ontouchend="onBandsTap(event,2)">2</div>
    <div class="pill"        id="pill3" ontouchend="onBandsTap(event,3)">3</div>
  </div>
  <div class="footer-row">
    <span class="footer-lbl">Diff</span>
    <div class="pill active" id="pillEasy"   ontouchend="onDiffTap(event,'easy')">Easy</div>
    <div class="pill"        id="pillMedium" ontouchend="onDiffTap(event,'medium')">Med</div>
    <div class="pill"        id="pillHard"   ontouchend="onDiffTap(event,'hard')">Hard</div>
    <span class="footer-lbl" style="margin-left:4px;">Src</span>
    <div class="pill active" id="srcPink"  ontouchend="onSrcTap(event,'pink')">Pink</div>
    <div class="pill"        id="srcLoops" ontouchend="onSrcTap(event,'loops')">Loops</div>
  </div>
</div>

<script>
// ── IOS Loops ─────────────────────────────────────────────────────────────────
const IOS_LOOPS = [
  'alex-morgan-acid-jazz-groove-517096.mp3',
  'alex-morgan-bebop-coffee-shop-517090.mp3',
  'atlasaudio-house-518082.mp3',
  'cyberwave-orchestra-orchestral-music-loop-287416.mp3',
  'joyinsound-corporate-background-music-quiet-progress-507151.mp3',
  'leberch-spain-518570.mp3',
  'mkgomez-minimal-techno-background-loop-475852.mp3',
  'nastelbom-lounge-house-314576.mp3',
  'ohpalmusic-passive-hip-hop-beat-90bpm-d-minor-177334.mp3',
  'openmindaudio-deep-club-organic-house-music-ashen-palms-524258.mp3',
  'openmindaudio-epic-organic-house-music-driftwood-ritual-524274.mp3',
  'prettyjohn1-chill-520383.mp3',
  'prettyjohn1-disco-funk-520385.mp3',
  'prettyjohn1-retro-funk-523181.mp3',
  'sonican-acoustic-senses-loop-313230.mp3',
  'sonican-feelgood-acoustic-loop-320856.mp3',
  'sonican-positive-corporate-music-optimistic-loop-464544.mp3',
  'sonofevan-gravel-in-my-lungs-470048.mp3',
  'the_mountain-deep-house-483808.mp3',
  'the_mountain-event-522459.mp3',
  'the_mountain-hi-tech-loop-151203.mp3',
  'the_mountain-loop-beat-130010.mp3',
  'the_mountain-soft-loop-130012.mp3',
  'the_mountain-vlog-522479.mp3',
  'tunetank-soft-house-music-348241.mp3',
];

// ── EQ math ───────────────────────────────────────────────────────────────────
const DISPLAY_SR = 48000;
const FREQ_MIN = 20, FREQ_MAX = 20000;
const GAIN_RANGE = 18;

function freqToX(f, W) {
  return (Math.log10(f) - Math.log10(FREQ_MIN)) /
         (Math.log10(FREQ_MAX) - Math.log10(FREQ_MIN)) * W;
}
function xToFreq(x, W) {
  return Math.pow(10, Math.log10(FREQ_MIN) +
    (x / W) * (Math.log10(FREQ_MAX) - Math.log10(FREQ_MIN)));
}
function gainToY(g, H) {
  const margin = 10;
  const usable = H - margin * 2;
  return margin + usable * (1 - (Math.max(-GAIN_RANGE, Math.min(GAIN_RANGE, g)) + GAIN_RANGE) / (GAIN_RANGE * 2));
}

function bandResponseDB(freq, band) {
  const { type, freq: f0, gain: g, Q: Qv } = band;
  const Q = Qv || 0.707;
  const A = Math.pow(10, g / 40);
  const w0 = 2 * Math.PI * f0 / DISPLAY_SR;
  const cosW0 = Math.cos(w0), sinW0 = Math.sin(w0);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'peaking') {
    const alpha = sinW0 / (2 * Q);
    b0=1+alpha*A; b1=-2*cosW0; b2=1-alpha*A;
    a0=1+alpha/A; a1=-2*cosW0; a2=1-alpha/A;
  } else if (type === 'lowshelf') {
    const alpha = (sinW0/2)*Math.sqrt((A+1/A)*(1/Q-1)+2);
    b0=A*((A+1)-(A-1)*cosW0+2*Math.sqrt(A)*alpha);
    b1=2*A*((A-1)-(A+1)*cosW0);
    b2=A*((A+1)-(A-1)*cosW0-2*Math.sqrt(A)*alpha);
    a0=(A+1)+(A-1)*cosW0+2*Math.sqrt(A)*alpha;
    a1=-2*((A-1)+(A+1)*cosW0); a2=(A+1)+(A-1)*cosW0-2*Math.sqrt(A)*alpha;
  } else if (type === 'highshelf') {
    const alpha = (sinW0/2)*Math.sqrt((A+1/A)*(1/Q-1)+2);
    b0=A*((A+1)+(A-1)*cosW0+2*Math.sqrt(A)*alpha);
    b1=-2*A*((A-1)+(A+1)*cosW0);
    b2=A*((A+1)+(A-1)*cosW0-2*Math.sqrt(A)*alpha);
    a0=(A+1)-(A-1)*cosW0+2*Math.sqrt(A)*alpha;
    a1=2*((A-1)-(A+1)*cosW0); a2=(A+1)-(A-1)*cosW0-2*Math.sqrt(A)*alpha;
  } else if (type === 'lowpass') {
    const alpha = sinW0/(2*Q);
    b0=(1-cosW0)/2; b1=1-cosW0; b2=(1-cosW0)/2;
    a0=1+alpha; a1=-2*cosW0; a2=1-alpha;
  } else { // highpass
    const alpha = sinW0/(2*Q);
    b0=(1+cosW0)/2; b1=-(1+cosW0); b2=(1+cosW0)/2;
    a0=1+alpha; a1=-2*cosW0; a2=1-alpha;
  }
  b0/=a0; b1/=a0; b2/=a0; a1/=a0; a2/=a0;
  const w = 2*Math.PI*freq/DISPLAY_SR;
  const cw=Math.cos(w), sw=Math.sin(w), c2w=Math.cos(2*w), s2w=Math.sin(2*w);
  const nr=b0+b1*cw+b2*c2w, ni=-b1*sw-b2*s2w;
  const dr=1+a1*cw+a2*c2w, di=-a1*sw-a2*s2w;
  const magSq=(nr*nr+ni*ni)/(dr*dr+di*di);
  return 20*Math.log10(Math.sqrt(Math.max(magSq,1e-30)));
}

function totalResponseDB(freq, bands) {
  return bands.reduce((acc, b) => acc + bandResponseDB(freq, b), 0);
}

// ── Canvas drawing ─────────────────────────────────────────────────────────────
function drawEQCanvas(canvasEl, bands, color) {
  const W = canvasEl.offsetWidth || 160;
  const H = canvasEl.offsetHeight || 108;
  canvasEl.width  = W * devicePixelRatio;
  canvasEl.height = H * devicePixelRatio;
  const ctx = canvasEl.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);

  ctx.fillStyle = '#080a0e';
  ctx.fillRect(0, 0, W, H);

  // Frequency grid lines
  [100, 200, 500, 1000, 2000, 5000, 10000].forEach(f => {
    const x = freqToX(f, W);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  });

  // Gain grid lines + labels
  [-12, -6, 0, 6, 12].forEach(db => {
    const y = gainToY(db, H);
    ctx.strokeStyle = db === 0 ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    if (db !== 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = `8px 'IBM Plex Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`${db>0?'+':''}${db}`, 2, y - 2);
    }
  });

  // Freq labels
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = `8px 'IBM Plex Mono', monospace`;
  ctx.textAlign = 'center';
  [[500,'500'],[1000,'1k'],[5000,'5k'],[10000,'10k']].forEach(([f, label]) => {
    ctx.fillText(label, freqToX(f, W), H - 2);
  });

  // Compute curve points
  const pts = [];
  for (let x = 0; x <= W; x++) {
    const f = xToFreq(x, W);
    const db = totalResponseDB(f, bands);
    pts.push([x, gainToY(db, H)]);
  }
  const zeroY = gainToY(0, H);

  // Fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, color + '44');
  grad.addColorStop(0.5, color + '18');
  grad.addColorStop(1, color + '06');
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  pts.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(W, zeroY);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Curve stroke
  ctx.beginPath();
  pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Band center markers
  bands.forEach(band => {
    const x = freqToX(band.freq, W);
    const markerDB = (band.type === 'lowpass' || band.type === 'highpass')
      ? totalResponseDB(band.freq, [band])
      : band.gain;
    const y = gainToY(markerDB, H);
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2);
    ctx.strokeStyle = '#080a0e'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

function redrawCanvases() {
  if (!roundActive) return;
  if (showCurves) {
    drawEQCanvas(document.getElementById('canvasA'), eqA, '#00d4ff');
    drawEQCanvas(document.getElementById('canvasB'), eqB, '#f0a862');
  }
}

// ── Band generation ────────────────────────────────────────────────────────────
const ZONES = [
  { type:'highpass',  minF:40,    maxF:600   },
  { type:'lowshelf',  minF:60,    maxF:120   },
  { type:'peaking',   minF:120,   maxF:400   },
  { type:'peaking',   minF:400,   maxF:1200  },
  { type:'peaking',   minF:1200,  maxF:4000  },
  { type:'peaking',   minF:4000,  maxF:9000  },
  { type:'highshelf', minF:8000,  maxF:14000 },
  { type:'lowpass',   minF:500,   maxF:10000 },
];
const ROUND_FREQS = [63,125,250,500,1000,2000,4000,8000,12000,16000];

function pickRoundFreq(existingFreqs, zoneIdx) {
  const zone = ZONES[zoneIdx];
  const candidates = ROUND_FREQS.filter(f => f >= zone.minF*0.5 && f <= zone.maxF*2);
  const available = candidates.filter(f =>
    existingFreqs.every(ef => Math.abs(Math.log2(f) - Math.log2(ef)) > 1.2)
  );
  const pool = available.length > 0 ? available : candidates;
  return pool[Math.floor(Math.random() * pool.length)];
}

function coin() { return Math.random() < 0.5; }

function makeTargetBands(nBands, diff) {
  const gainCfg = { easy:{min:9,max:14}, medium:{min:5,max:9}, hard:{min:3,max:6} }[diff];
  const qCfg    = { easy:{min:0.5,max:0.8}, medium:{min:0.6,max:1.4}, hard:{min:0.8,max:2.0} }[diff];
  const zoneIdxs = shuffleArr([0,1,2,3,4,5,6,7]).slice(0, nBands).sort((a,b)=>a-b);
  const usedFreqs = [];
  return zoneIdxs.map(zi => {
    const zone = ZONES[zi];
    const freq = pickRoundFreq(usedFreqs, zi); usedFreqs.push(freq);
    const isShapeOnly = zone.type==='lowpass'||zone.type==='highpass';
    const isShelf = zone.type==='lowshelf'||zone.type==='highshelf';
    const gainMag = gainCfg.min + Math.random()*(gainCfg.max - gainCfg.min);
    const gain = isShapeOnly ? 0 : (coin() ? gainMag : -gainMag);
    const Q = isShelf ? 0.707 : qCfg.min + Math.random()*(qCfg.max - qCfg.min);
    return { type:zone.type, freq, gain:isShapeOnly?0:Math.round(gain*2)/2, Q };
  });
}

function makeDecoyBands(targetBands, diff) {
  return targetBands.map(band => {
    const b = { ...band };
    const isShapeOnly = band.type==='lowpass'||band.type==='highpass';
    if (isShapeOnly) {
      const octaveShift = diff==='easy'?1.5:diff==='medium'?1.0:0.6;
      const dir = coin() ? octaveShift : -octaveShift;
      b.freq = Math.round(Math.max(40, Math.min(18000, band.freq*Math.pow(2,dir))));
      const snap = [40,63,100,125,200,250,315,500,630,1000,1250,2000,2500,4000,5000,8000,10000,16000];
      b.freq = snap.reduce((p,c) => Math.abs(c-b.freq)<Math.abs(p-b.freq)?c:p);
      const qShift = diff==='easy'?0.5:diff==='medium'?0.3:0.2;
      b.Q = Math.max(0.3, Math.min(4, band.Q*(coin()?1+qShift:1-qShift)));
      return b;
    }
    if (diff==='easy') {
      b.gain = -band.gain;
    } else if (diff==='medium') {
      if (Math.random()<0.65) { b.gain=-band.gain; }
      else { const m=1.6+Math.random()*0.9; b.gain=Math.sign(band.gain)*Math.min(Math.abs(band.gain*m),GAIN_RANGE-1); }
    } else {
      const r=0.35+Math.random()*0.30;
      b.gain=Math.sign(band.gain)*Math.max(Math.abs(band.gain)*r,1.5);
      b.gain=Math.round(b.gain*2)/2;
      if (Math.abs(b.gain-band.gain)<2) b.gain=band.gain*(coin()?0.4:1.8);
    }
    return b;
  });
}

function shuffleArr(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

// ── State ─────────────────────────────────────────────────────────────────────
let gameStarted  = false;
let roundActive  = false;
let answered     = false;
let numBands     = 1;
let difficulty   = 'easy';
let showCurves   = true;
let sourceType   = 'pink';
let loopIdx      = 0;

let eqA = [], eqB = [];
let correctChoice = 'A';
let currentMonitor = 'target';

let totalScore  = 0, streak = 0, totalRounds = 0, correctCount = 0;
let nextTimeout = null;

// Audio
let audioCtx      = null;
let noiseSource   = null;
let loopAudioEl   = null;
let loopMediaSrc  = null;
let outGain       = null;
let chainNodes    = [];
let isPlaying     = false;

// ── Touch handlers ─────────────────────────────────────────────────────────────
function onPickTap(e, side) {
  e.preventDefault();
  if (!gameStarted) { startGame(side); return; }
  if (answered && roundActive) { newRound(); return; }
  if (!roundActive) return;
  e.stopPropagation(); // prevent this answering tap from also triggering document touchend
  submitAnswer(side);
}

function onMonTap(e, mode) {
  e.preventDefault();
  if (!roundActive) return;
  setMonitor(mode);
}

function onCurvesTap(e, show) {
  e.preventDefault();
  showCurves = show;
  document.getElementById('pillShow').classList.toggle('active',  show);
  document.getElementById('pillHide').classList.toggle('active', !show);
  updateOverlays();
  if (roundActive && show) {
    requestAnimationFrame(redrawCanvases);
  }
}

function onBandsTap(e, n) {
  e.preventDefault();
  numBands = n;
  [1,2,3].forEach(i => document.getElementById(`pill${i}`).classList.toggle('active', i===n));
}

function onDiffTap(e, d) {
  e.preventDefault();
  difficulty = d;
  document.getElementById('pillEasy').classList.toggle('active',   d==='easy');
  document.getElementById('pillMedium').classList.toggle('active', d==='medium');
  document.getElementById('pillHard').classList.toggle('active',   d==='hard');
}

function onSrcTap(e, src) {
  e.preventDefault();
  sourceType = src;
  document.getElementById('srcPink').classList.toggle('active',  src==='pink');
  document.getElementById('srcLoops').classList.toggle('active', src==='loops');
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  gameStarted = true;
  newRound();
}

function newRound() {
  clearTimeout(nextTimeout);
  stopPlayback();

  const targetBands = makeTargetBands(numBands, difficulty);
  const decoyBands  = makeDecoyBands(targetBands, difficulty);
  correctChoice = coin() ? 'A' : 'B';
  eqA = correctChoice === 'A' ? targetBands : decoyBands;
  eqB = correctChoice === 'B' ? targetBands : decoyBands;

  answered = false;
  roundActive = true;
  currentMonitor = 'target';
  totalRounds++;
  document.getElementById('roundVal').textContent = totalRounds;

  if (sourceType === 'loops') loopIdx = Math.floor(Math.random() * IOS_LOOPS.length);

  // Reset prompt card
  const pc = document.getElementById('promptCard');
  pc.classList.remove('correct-flash','wrong-flash');
  document.getElementById('resultBadge').className  = 'result-badge';
  document.getElementById('resultBadge').textContent = '';
  document.getElementById('promptText').innerHTML =
    `Listen to <span>TARGET</span> vs <span>DRY</span>. Pick the EQ that matches.`;
  document.getElementById('monitorRow').style.display = 'flex';

  // Reset panels
  ['A','B'].forEach(s => {
    document.getElementById(`panel${s}`).classList.remove('reveal-correct','reveal-wrong','reveal-hint','reveal-dimmed');
    const r = document.getElementById(`result${s}`);
    r.className = 'panel-result'; r.textContent = '';
  });

  updateOverlays();
  updateMonitorUI();

  document.getElementById('pickA').disabled = false;
  document.getElementById('pickB').disabled = false;

  // Draw after layout settles
  requestAnimationFrame(() => {
    redrawCanvases();
    renderBandInfo(eqA, 'bandInfoA', '#00d4ff');
    renderBandInfo(eqB, 'bandInfoB', '#f0a862');
  });

  playCurrentRound();
}

// ── Answer ─────────────────────────────────────────────────────────────────────
function submitAnswer(choice) {
  if (!roundActive || answered) return;
  answered = true;
  stopPlayback();

  const correct  = choice === correctChoice;
  const maxPts   = window.ScoringEngine ? ScoringEngine.points('quick-eq-ios', { difficulty, numBands }) : 100;
  const multLbl  = window.ScoringEngine ? ScoringEngine.label('quick-eq-ios', { difficulty, numBands }) : '×1.0';
  if (correct) { totalScore += maxPts; streak++; correctCount++; }
  else streak = 0;

  document.getElementById('scoreVal').textContent    = totalScore;
  document.getElementById('streakVal').textContent   = streak;
  document.getElementById('accuracyVal').textContent =
    totalRounds > 0 ? Math.round(correctCount / totalRounds * 100) + '%' : '—';

  // Panel states — correct pick gets bright green; wrong pick gets red + correct gets subtle dashed green
  const decoyChoice = correctChoice === 'A' ? 'B' : 'A';
  if (correct) {
    document.getElementById(`panel${correctChoice}`).classList.add('reveal-correct');
    document.getElementById(`panel${decoyChoice}`).classList.add('reveal-dimmed');
  } else {
    document.getElementById(`panel${choice}`).classList.add('reveal-wrong');
    document.getElementById(`panel${correctChoice}`).classList.add('reveal-hint');
  }

  // Result labels
  const rA = document.getElementById('resultA');
  const rB = document.getElementById('resultB');
  if (correctChoice === 'A') {
    rA.className='panel-result show-correct'; rA.textContent='✓ Target';
    rB.className='panel-result show-wrong';   rB.textContent='✗ Decoy';
  } else {
    rB.className='panel-result show-correct'; rB.textContent='✓ Target';
    rA.className='panel-result show-wrong';   rA.textContent='✗ Decoy';
  }

  // Reveal curves if they were hidden
  if (!showCurves) {
    document.getElementById('wrapA').style.display = '';
    document.getElementById('wrapB').style.display = '';
    requestAnimationFrame(() => {
      drawEQCanvas(document.getElementById('canvasA'), eqA, '#00d4ff');
      drawEQCanvas(document.getElementById('canvasB'), eqB, '#f0a862');
    });
  }

  // Prompt card
  const pc = document.getElementById('promptCard');
  pc.classList.add(correct ? 'correct-flash' : 'wrong-flash');
  const rb = document.getElementById('resultBadge');
  rb.textContent = correct ? `✓  +${maxPts} pts  ${multLbl}` : `✗ It was ${correctChoice}`;
  rb.className   = `result-badge ${correct ? 'good' : 'bad'}`;
  document.getElementById('promptText').innerHTML = correct
    ? `🎯 Correct — <span>EQ ${correctChoice}</span> was the target — tap anywhere to continue`
    : `✗ <span>EQ ${correctChoice}</span> was the target — tap anywhere to continue`;

  document.getElementById('monitorRow').style.display = 'none';
  document.getElementById('pickA').disabled = true;
  document.getElementById('pickB').disabled = true;

  if (window.SonicSandbox) {
    const rawScore = correct ? 100 : 0;
    SonicSandbox.saveScore({ game: 'quick-eq-ios', correct, roundScore: correct ? maxPts : 0, rawScore });
  }

  addHistory(correct);

  // Play back target EQ after a short beat so user can hear the answer
  setTimeout(() => {
    if (answered && roundActive) {
      currentMonitor = 'target';
      playCurrentRound();
    }
  }, 400);
}

// ── Monitor ───────────────────────────────────────────────────────────────────
function setMonitor(mode) {
  currentMonitor = mode;
  updateMonitorUI();
  if (roundActive && isPlaying) { stopPlayback(); playCurrentRound(); }
}

function updateMonitorUI() {
  document.getElementById('monTarget').classList.toggle('active', currentMonitor === 'target');
  document.getElementById('monDry').classList.toggle('active',    currentMonitor === 'dry');
}

function updateOverlays() {
  const hidden = !showCurves && !answered;
  document.getElementById('wrapA').style.display = hidden ? 'none' : '';
  document.getElementById('wrapB').style.display = hidden ? 'none' : '';
}

function getCurrentEQBands() {
  if (currentMonitor === 'dry') return [];
  return correctChoice === 'A' ? eqA : eqB;
}

// ── Band info render ──────────────────────────────────────────────────────────
function renderBandInfo(bands, containerId, color) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const LABELS = {
    peaking:'PEAK', lowshelf:'LO SHF', highshelf:'HI SHF',
    lowpass:'LO PASS', highpass:'HI PASS'
  };
  bands.forEach((band, i) => {
    const row = document.createElement('div');
    row.className = 'band-row';
    const isShapeOnly = band.type==='lowpass'||band.type==='highpass';
    const freqStr = band.freq >= 1000
      ? (band.freq/1000).toFixed(band.freq%1000===0?0:1)+'k'
      : String(band.freq);
    let gainHtml = '';
    if (!isShapeOnly) {
      const gainClass = band.gain > 0 ? 'pos' : band.gain < 0 ? 'neg' : 'neutral';
      const gainStr = `${band.gain>=0?'+':''}${band.gain.toFixed(1)}dB`;
      gainHtml = `<span class="band-gain ${gainClass}">${gainStr}</span>`;
    }
    row.innerHTML = `<span class="band-num">B${i+1}</span>
      <span class="band-type" style="color:${color};">${LABELS[band.type]}</span>
      <span class="band-freq">${freqStr}Hz</span>
      ${gainHtml}`;
    el.appendChild(row);
  });
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(dur) {
  const rate=audioCtx.sampleRate, len=Math.ceil(rate*dur);
  const buf=audioCtx.createBuffer(1,len,rate);
  const d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
  }
  const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true; return src;
}

function buildBiquadChain(bands, destNode) {
  const filters = bands.map(band => {
    const f = audioCtx.createBiquadFilter();
    f.type = band.type;
    f.frequency.value = band.freq;
    f.gain.value = band.gain;
    f.Q.value = band.Q || 0.707;
    return f;
  });
  for (let i = 0; i < filters.length-1; i++) filters[i].connect(filters[i+1]);
  if (filters.length > 0) filters[filters.length-1].connect(destNode);
  chainNodes = filters;
  return filters.length > 0 ? filters[0] : destNode;
}

function playCurrentRound() {
  if (!roundActive) return;
  stopPlayback();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  outGain = audioCtx.createGain();
  outGain.gain.value = 0.75;
  outGain.connect(audioCtx.destination);

  const bands = getCurrentEQBands();
  const chainHead = buildBiquadChain(bands, outGain);

  if (sourceType === 'loops') {
    buildLoopSource(chainHead);
  } else {
    const src = makePinkNoise(8);
    src.connect(chainHead); src.start(0);
    noiseSource = src;
  }
  isPlaying = true;
}

function buildLoopSource(dest) {
  if (!loopAudioEl) {
    loopAudioEl = new Audio();
    loopAudioEl.loop = true;
    loopAudioEl.crossOrigin = 'anonymous';
  }
  if (!loopMediaSrc) {
    loopMediaSrc = audioCtx.createMediaElementSource(loopAudioEl);
  }
  const fname = IOS_LOOPS[loopIdx % IOS_LOOPS.length];
  if (loopAudioEl._cur !== fname) {
    loopAudioEl.src = `../../samples/loops/${fname}`;
    loopAudioEl._cur = fname;
  }
  loopMediaSrc.connect(dest);
  loopAudioEl.play().catch(() => {});
  noiseSource = loopMediaSrc;
}

function stopPlayback() {
  if (noiseSource && noiseSource !== loopMediaSrc) {
    try { noiseSource.stop(); } catch(e) {}
  }
  noiseSource = null;
  if (loopAudioEl)   loopAudioEl.pause();
  if (loopMediaSrc)  { try { loopMediaSrc.disconnect(); } catch(e) {} }
  chainNodes.forEach(n => { try { n.disconnect(); } catch(e) {} });
  chainNodes = [];
  if (outGain) { try { outGain.disconnect(); } catch(e) {} outGain = null; }
  isPlaying = false;
}

// ── History ───────────────────────────────────────────────────────────────────
function addHistory(correct) {
  const strip = document.getElementById('historyStrip');
  const dot   = document.createElement('div');
  dot.className = `hist-dot ${correct ? 'c' : 'w'}`;
  strip.appendChild(dot);
  while (strip.children.length > 30) strip.removeChild(strip.firstChild);
}

// ── Tap anywhere to continue after answering ──────────────────────────────────
// Pick-button taps call stopPropagation before submitAnswer(), so they never
// reach here when answering. This catches taps on the prompt card, canvases,
// history strip, and any other non-footer area.
document.addEventListener('touchend', e => {
  if (!answered || !roundActive) return;
  if (e.target.closest('.footer')) return;
  if (e.target.closest('.header')) return;
  if (e.target.closest('#monitorRow')) return;
  newRound();
}, { passive: true });

// Redraw on orientation change
window.addEventListener('resize', () => {
  if (roundActive && showCurves) {
    requestAnimationFrame(redrawCanvases);
  }
});
</script>
