<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spatial Specialist">
<title>Spatial Specialist</title>
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:       #080a10;
  --surface:  #101420;
  --surface2: #171c2c;
  --surface3: #1d2438;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --text:     #dde8f8;
  --muted:    #4c5878;
  --accent:   #7c5cfc;
  --accent2:  #a58aff;
  --left:     #f45b69;
  --right:    #3ecf8e;
  --teal:     #00e5cc;
  --green:    #3ecf8e;
  --red:      #f45b69;
  --amber:    #f5a623;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body { height:100%; overflow:hidden; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  user-select: none;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 8px; flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); text-decoration: none;
  font-size: 18px; line-height: 1; flex-shrink: 0;
  margin-right: 6px;
}
.back-btn:active { background: var(--surface3); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon {
  width: 28px; height: 28px; background: var(--accent);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
}
.brand-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
}
.brand-name span { color: var(--accent2); }
.stats { display: flex; gap: 12px; align-items: center; }
.stat { text-align: center; }
.stat-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px; font-weight: 700; color: var(--accent2); line-height: 1;
}
.stat-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px;
}
.vdiv { width: 1px; height: 16px; background: var(--border2); }

/* ── Prompt card ── */
.prompt-card {
  margin: 0 12px 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 14px;
  flex-shrink: 0;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.prompt-card.correct-flash { border-color: var(--green); box-shadow: 0 0 16px rgba(62,207,142,0.14); }
.prompt-card.wrong-flash   { border-color: var(--red);   box-shadow: 0 0 14px rgba(244,91,105,0.12); }

.prompt-top { display: flex; align-items: center; gap: 8px; }
.prompt-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
.prompt-text span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.result-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px; font-weight: 700;
  white-space: nowrap; opacity: 0; transition: opacity 0.15s;
}
.result-badge.good { opacity:1; color: var(--green); }
.result-badge.ok   { opacity:1; color: var(--amber); }
.result-badge.bad  { opacity:1; color: var(--red); }

/* Center reference toggle */
.ref-row {
  display: flex; align-items: center; gap: 6px; margin-top: 8px;
}
.ref-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.ref-pill {
  display: flex; background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 8px; overflow: hidden;
}
.ref-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 5px 12px; border: none; background: transparent;
  color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.ref-btn.active {
  background: rgba(124,92,252,0.2); color: var(--accent2);
}

/* ── Game area ── */
.game-area {
  flex: 1; min-height: 0;
  margin: 0 12px;
  display: flex; flex-direction: column;
}

.stereo-card {
  flex: 1; min-height: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 20px 18px;
  display: flex; flex-direction: column;
  justify-content: space-around; gap: 16px;
}

/* Speaker labels + track row */
.field-row {
  display: flex; align-items: center; gap: 12px;
}
.spk-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  width: 36px; text-align: center; flex-shrink: 0;
  transition: opacity 0.2s, color 0.2s;
}
.spk-l { color: var(--left); }
.spk-r { color: var(--right); }

/* Track */
.pan-track {
  flex: 1; height: 10px;
  background: var(--surface2);
  border-radius: 5px; position: relative;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  touch-action: none;
}

/* Fill */
.pan-fill {
  position: absolute; top: 0; height: 100%;
  border-radius: 5px; pointer-events: none;
  transition: none;
}

/* Tick marks */
.pan-tick {
  position: absolute; top: -10px;
  width: 1px; height: 7px;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.12);
}
.pan-tick.center { background: rgba(245,166,35,0.4); }
.pan-tick-label {
  position: absolute; bottom: -16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px; color: var(--muted);
  transform: translateX(-50%); white-space: nowrap;
}

/* User handle */
.pan-handle {
  position: absolute; top: 50%;
  width: 36px; height: 36px; border-radius: 50%;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid; touch-action: none;
  transition: box-shadow 0.12s;
  z-index: 10;
}
.user-handle {
  background: var(--surface3);
  border-color: var(--accent2);
  box-shadow: 0 0 0 5px rgba(124,92,252,0.18);
  cursor: grab;
}
.user-handle:active { box-shadow: 0 0 0 8px rgba(124,92,252,0.25); }
.target-handle {
  background: rgba(0,229,204,0.15);
  border-color: rgba(0,229,204,0.8);
  pointer-events: none; opacity: 0;
  transition: opacity 0.35s;
  z-index: 9;
}
.target-handle.visible { opacity: 1; }
.handle-lbl {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 700; pointer-events: none;
}

/* Readout */
.readout-row {
  display: flex; justify-content: center; gap: 32px; align-items: baseline;
}
.readout-item { text-align: center; }
.readout-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 24px; font-weight: 700; line-height: 1;
}
.user-read .readout-val  { color: var(--accent2); }
.target-read .readout-val { color: var(--teal); opacity: 0; transition: opacity 0.35s; }
.target-read .readout-val.visible { opacity: 1; }
.readout-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em; margin-top: 4px;
}

/* Position description / diff reveal */
.pos-desc {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 600;
  text-align: center; min-height: 20px; color: var(--muted);
}
.pos-desc .good { color: var(--green); }
.pos-desc .ok   { color: var(--amber); }
.pos-desc .bad  { color: var(--red);   }

/* Error bar */
.error-wrap {
  display: none; flex-direction: column; gap: 5px;
}
.error-wrap.visible { display: flex; }
.error-labels {
  display: flex; justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);
}
.error-track {
  height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden;
}
.error-fill {
  height: 100%; border-radius: 3px; width: 0%;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── History ── */
.history-strip {
  display: flex; gap: 5px; padding: 6px 12px 4px;
  flex-wrap: wrap; min-height: 22px; flex-shrink: 0;
}
.hist-dot { width: 9px; height: 9px; border-radius: 50%; }
.hist-dot.perfect { background: var(--accent2); }
.hist-dot.good    { background: var(--green); }
.hist-dot.ok      { background: var(--amber); }
.hist-dot.bad     { background: var(--red); }

/* ── Footer ── */
.footer {
  display: flex; flex-direction: column; gap: 5px;
  padding: 3px 12px 8px; flex-shrink: 0;
}
.footer-row { display: flex; gap: 5px; align-items: center; }
.footer-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 600; white-space: nowrap; width: 36px;
}
.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 500;
  padding: 5px 12px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--muted);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.pill.active {
  border-color: var(--accent2);
  color: var(--accent2);
  background: rgba(124,92,252,0.08);
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="back-btn" href="/mobile/">‹</a>
  <div class="brand">
    <div class="brand-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <line x1="2" y1="12" x2="22" y2="12" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
        <circle cx="16" cy="12" r="4" fill="none" stroke="white" stroke-width="2.2"/>
        <circle cx="16" cy="12" r="2" fill="white"/>
        <line x1="2" y1="8" x2="2" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        <line x1="22" y1="8" x2="22" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>
    <span class="brand-name">Spatial Specialist</span>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="scoreVal">0</div>
      <div class="stat-lbl">Score</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-lbl">Streak</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="avgErrVal">—</div>
      <div class="stat-lbl">Avg Err</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="roundVal">0</div>
      <div class="stat-lbl">Round</div>
    </div>
  </div>
</div>

<!-- Prompt card -->
<div class="prompt-card" id="promptCard">
  <div class="prompt-top">
    <div class="prompt-text" id="promptText">
      Tap <span>A</span> or <span>B</span> — tap the stereo ruler to place your guess and submit
    </div>
    <div class="result-badge" id="resultBadge"></div>
  </div>
  <!-- Reference toggle (shown during active round) -->
  <div class="ref-row" id="refRow" style="display:none;">
    <span class="ref-lbl">Hear</span>
    <div class="ref-pill">
      <button class="ref-btn active" id="refPanned" ontouchend="onRefTap(event,'panned')">PANNED</button>
      <button class="ref-btn"        id="refCenter" ontouchend="onRefTap(event,'center')">CENTER REF</button>
    </div>
  </div>
</div>

<!-- Game area -->
<div class="game-area">
  <div class="stereo-card" id="stereoCard">

    <!-- Speaker labels + track -->
    <div class="field-row">
      <div class="spk-label spk-l" id="spkL">L</div>
      <div class="pan-track" id="panTrack">
        <!-- Ticks built by JS -->
        <div class="pan-fill" id="panFill"></div>
        <div class="pan-handle user-handle" id="userHandle">
          <span class="handle-lbl" style="color:var(--accent2);">▼</span>
        </div>
        <div class="pan-handle target-handle" id="targetHandle">
          <span class="handle-lbl" style="color:rgba(0,229,204,0.9);">◆</span>
        </div>
      </div>
      <div class="spk-label spk-r" id="spkR">R</div>
    </div>

    <!-- Readout -->
    <div class="readout-row">
      <div class="readout-item user-read">
        <div class="readout-val" id="userReadout">C</div>
        <div class="readout-lbl">Your Guess</div>
      </div>
      <div class="readout-item target-read">
        <div class="readout-val" id="targetReadout">—</div>
        <div class="readout-lbl">Target</div>
      </div>
    </div>

    <!-- Difference reveal (shown after answer) -->
    <div class="pos-desc" id="posDesc"></div>

    <!-- Error bar -->
    <div class="error-wrap" id="errorWrap">
      <div class="error-labels">
        <span>Error</span>
        <span id="errorPct"></span>
      </div>
      <div class="error-track">
        <div class="error-fill" id="errorFill"></div>
      </div>
    </div>

  </div>
</div>

<!-- History -->
<div class="history-strip" id="historyStrip"></div>

<!-- Footer -->
<div class="footer">
  <div class="footer-row">
    <span class="footer-lbl">Mode</span>
    <div class="pill active" id="modePanning" ontouchend="onModeTap(event,'panning')">↔ Panning</div>
    <div class="pill"        id="modeWidth"   ontouchend="onModeTap(event,'width')">⟺ Width</div>
  </div>
  <div class="footer-row">
    <span class="footer-lbl">Src</span>
    <div class="pill active" id="srcPink"  ontouchend="onSrcTap(event,'pink')">Pink</div>
    <div class="pill"        id="srcLoops" ontouchend="onSrcTap(event,'loops')">Loops</div>
  </div>
</div>

<script>
// ── IOS Loops ─────────────────────────────────────────────────────────────────
const IOS_LOOPS = [
  'alex-morgan-acid-jazz-groove-517096.mp3',
  'alex-morgan-bebop-coffee-shop-517090.mp3',
  'atlasaudio-house-518082.mp3',
  'cyberwave-orchestra-orchestral-music-loop-287416.mp3',
  'joyinsound-corporate-background-music-quiet-progress-507151.mp3',
  'leberch-spain-518570.mp3',
  'mkgomez-minimal-techno-background-loop-475852.mp3',
  'nastelbom-lounge-house-314576.mp3',
  'ohpalmusic-passive-hip-hop-beat-90bpm-d-minor-177334.mp3',
  'openmindaudio-deep-club-organic-house-music-ashen-palms-524258.mp3',
  'openmindaudio-epic-organic-house-music-driftwood-ritual-524274.mp3',
  'prettyjohn1-chill-520383.mp3',
  'prettyjohn1-disco-funk-520385.mp3',
  'prettyjohn1-retro-funk-523181.mp3',
  'sonican-acoustic-senses-loop-313230.mp3',
  'sonican-feelgood-acoustic-loop-320856.mp3',
  'sonican-positive-corporate-music-optimistic-loop-464544.mp3',
  'sonofevan-gravel-in-my-lungs-470048.mp3',
  'the_mountain-deep-house-483808.mp3',
  'the_mountain-event-522459.mp3',
  'the_mountain-hi-tech-loop-151203.mp3',
  'the_mountain-loop-beat-130010.mp3',
  'the_mountain-soft-loop-130012.mp3',
  'the_mountain-vlog-522479.mp3',
  'tunetank-soft-house-music-348241.mp3',
];

// ── State ─────────────────────────────────────────────────────────────────────
let gameMode    = 'panning'; // 'panning' | 'width'
let sourceType  = 'pink';
let targetPan   = 0;
let userPan     = 0;
let gameStarted = false;
let roundActive = false;
let answered    = false;
let isCenter    = false;
let loopIdx     = 0;

let totalScore = 0, streak = 0, totalRounds = 0, totalErr = 0;
let nextTimeout = null;

// Audio
let audioCtx     = null;
let pannerNode   = null, pannerNodeR = null;
let noiseSource  = null, noiseSourceR = null;
let loopAudioEl  = null, loopMediaSrc = null;
let outGain      = null;
let isPlaying    = false;

// Drag tracking
let isDragging     = false;
let touchMoved     = false;
let touchStartX    = 0;
let userHandleRatio = 0.5; // raw track position (0–1); 0.5 = center

// ── Build ticks ───────────────────────────────────────────────────────────────
function buildTicks() {
  const track = document.getElementById('panTrack');
  track.querySelectorAll('.pan-tick,.pan-tick-label').forEach(e => e.remove());

  if (gameMode === 'panning') {
    const ticks = [
      { v: -1, lbl: 'L' }, { v: -0.5, lbl: 'L50' }, { v: 0, lbl: 'C' },
      { v: 0.5, lbl: 'R50' }, { v: 1, lbl: 'R' }
    ];
    ticks.forEach(({ v, lbl }) => {
      const pct = ((v + 1) / 2) * 100;
      const tick = document.createElement('div');
      tick.className = 'pan-tick' + (v === 0 ? ' center' : '');
      tick.style.left = pct + '%';
      track.appendChild(tick);
      const label = document.createElement('div');
      label.className = 'pan-tick-label';
      label.style.left = pct + '%';
      label.textContent = lbl;
      track.appendChild(label);
    });
  } else {
    // Width mode: center = Mono, edges = Wide
    const widthTicks = [
      { pos: 0,   lbl: 'Wide' },
      { pos: 25,  lbl: '50%'  },
      { pos: 50,  lbl: 'Mono', isCenter: true },
      { pos: 75,  lbl: '50%'  },
      { pos: 100, lbl: 'Wide' },
    ];
    widthTicks.forEach(({ pos, lbl, isCenter }) => {
      const tick = document.createElement('div');
      tick.className = 'pan-tick' + (isCenter ? ' center' : '');
      tick.style.left = pos + '%';
      track.appendChild(tick);
      const label = document.createElement('div');
      label.className = 'pan-tick-label';
      label.style.left = pos + '%';
      label.textContent = lbl;
      track.appendChild(label);
    });
  }
}

// ── Pan formatting ────────────────────────────────────────────────────────────
function fmtPan(v) {
  if (gameMode === 'width') {
    const pct = Math.round(v * 100);
    if (pct <= 1) return 'Mono';
    if (pct >= 99) return 'Wide';
    return pct + '%';
  }
  if (Math.abs(v) < 0.02) return 'C';
  const pct = Math.round(Math.abs(v) * 100);
  return (v < 0 ? 'L ' : 'R ') + pct + '%';
}

// ── Update handle + fill from raw track ratio (0–1, 0.5 = center) ─────────────
function updatePanUI(ratio) {
  userHandleRatio = Math.max(0, Math.min(1, ratio));
  const fill = document.getElementById('panFill');

  if (gameMode === 'width') {
    // Width: distance from center → value. Both sides of center = wider.
    userPan = Math.abs(userHandleRatio - 0.5) * 2; // 0 at center, 1 at edges
    document.getElementById('userHandle').style.left = (userHandleRatio * 100) + '%';

    const halfFill = userPan * 50;
    fill.style.left  = (50 - halfFill) + '%';
    fill.style.width = (halfFill * 2) + '%';
    fill.style.background = 'linear-gradient(to right, rgba(244,91,105,0.4), rgba(124,92,252,0.6), rgba(62,207,142,0.4))';
    document.getElementById('spkL').style.opacity = 0.2 + userPan * 0.8;
    document.getElementById('spkR').style.opacity = 0.2 + userPan * 0.8;
  } else {
    // Panning: left to right, -1 to 1
    userPan = userHandleRatio * 2 - 1;
    const pct = userHandleRatio * 100;
    document.getElementById('userHandle').style.left = pct + '%';

    const center = 50;
    if (userPan < 0) {
      fill.style.left  = pct + '%';
      fill.style.width = (center - pct) + '%';
      fill.style.background = 'linear-gradient(to left, rgba(124,92,252,0.6), rgba(244,91,105,0.4))';
    } else if (userPan > 0) {
      fill.style.left  = center + '%';
      fill.style.width = (pct - center) + '%';
      fill.style.background = 'linear-gradient(to right, rgba(124,92,252,0.6), rgba(62,207,142,0.4))';
    } else {
      fill.style.width = '0%';
    }
    const absV = Math.abs(userPan);
    document.getElementById('spkL').style.opacity = userPan <= 0 ? 0.4 + absV * 0.6 : Math.max(0.15, 0.5 - absV * 0.4);
    document.getElementById('spkR').style.opacity = userPan >= 0 ? 0.4 + absV * 0.6 : Math.max(0.15, 0.5 - absV * 0.4);
  }

  document.getElementById('userReadout').textContent = fmtPan(userPan);
}

// ── Touch / drag on pan track ─────────────────────────────────────────────────
function ratioFromTrackX(x, trackW) {
  return Math.max(0, Math.min(1, x / trackW));
}

const panTrack = document.getElementById('panTrack');

panTrack.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!gameStarted) { startGame(); return; }
  if (answered) { newRound(); return; }
  if (!roundActive) return;
  isDragging = true;
  touchMoved = false;
  touchStartX = e.touches[0].clientX;
  const rect = panTrack.getBoundingClientRect();
  const x = Math.max(0, Math.min(rect.width, e.touches[0].clientX - rect.left));
  updatePanUI(ratioFromTrackX(x, rect.width));
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = Math.abs(e.touches[0].clientX - touchStartX);
  if (dx > 5) touchMoved = true;
  const rect = panTrack.getBoundingClientRect();
  const x = Math.max(0, Math.min(rect.width, e.touches[0].clientX - rect.left));
  updatePanUI(ratioFromTrackX(x, rect.width));
  e.preventDefault();
}, { passive: false });

window.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  if (!roundActive || answered) return;
  if (!touchMoved) {
    // Tap — submit immediately
    submitAnswer();
  }
  // Drag — just position the handle; user submits by tapping
});

// Tap anywhere on the stereo card (not track) = submit current position
document.getElementById('stereoCard').addEventListener('touchend', e => {
  if (!roundActive || answered || isDragging) return;
  if (!gameStarted) return;
  if (e.target.closest('#panTrack')) return; // handled by track handlers
  e.stopPropagation(); // prevent document touchend from immediately advancing
  submitAnswer();
}, { passive: false });

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  gameStarted = true;
  newRound();
}

function newRound() {
  clearTimeout(nextTimeout);
  stopAudio();

  answered = false;
  isCenter = false;
  roundActive = true;
  totalRounds++;
  document.getElementById('roundVal').textContent = totalRounds;

  // Pick target
  if (gameMode === 'width') {
    targetPan = Math.round((0.1 + Math.random() * 0.85) * 100) / 100;
  } else {
    do { targetPan = Math.round((Math.random() * 2 - 1) * 100) / 100; }
    while (Math.abs(targetPan) < 0.05);
  }

  if (sourceType === 'loops') loopIdx = Math.floor(Math.random() * IOS_LOOPS.length);

  // Reset UI
  userPan = 0;
  updatePanUI(0.5); // 0.5 = center of track = C for panning, Mono for width
  document.getElementById('posDesc').textContent = '';
  document.getElementById('promptCard').classList.remove('correct-flash','wrong-flash');
  document.getElementById('resultBadge').className = 'result-badge';
  document.getElementById('resultBadge').textContent = '';
  document.getElementById('promptText').innerHTML = gameMode === 'width'
    ? `How <span>wide</span> is the stereo image? Drag to guess, then tap to submit`
    : `Where is the sound <span>panned</span>? Drag to guess, then tap to submit`;
  document.getElementById('refRow').style.display = 'flex';
  document.getElementById('refPanned').classList.add('active');
  document.getElementById('refCenter').classList.remove('active');

  document.getElementById('targetHandle').classList.remove('visible');
  document.getElementById('targetReadout').classList.remove('visible');
  document.getElementById('targetReadout').textContent = '—';
  document.getElementById('errorWrap').classList.remove('visible');

  buildTicks();
  startAudio();
}

// ── Submit ────────────────────────────────────────────────────────────────────
function submitAnswer() {
  if (!roundActive || answered) return;
  answered = true;

  const err    = Math.abs(userPan - targetPan);
  const errPct = (err / (gameMode === 'width' ? 1 : 2)) * 100;
  const pts         = Math.round(Math.max(0, 100 - errPct * 1.6));
  const mult        = window.ScoringEngine ? ScoringEngine.multiplier('spatial-specialist-ios', { mode: gameMode }) : 1;
  const weightedPts = Math.round(pts * mult);
  totalScore += weightedPts;
  totalErr    = totalErr === 0 ? errPct : (totalErr * (totalRounds - 1) + errPct) / totalRounds;
  if (pts >= 70) streak++; else streak = 0;

  document.getElementById('scoreVal').textContent   = totalScore;
  document.getElementById('streakVal').textContent  = streak;
  document.getElementById('avgErrVal').textContent  = Math.round(totalErr) + '%';

  // Reveal target handle — width mode shows on right side of center
  const tPct = gameMode === 'width'
    ? 50 + targetPan * 50
    : ((targetPan + 1) / 2) * 100;
  document.getElementById('targetHandle').style.left = tPct + '%';
  document.getElementById('targetHandle').classList.add('visible');
  const tr = document.getElementById('targetReadout');
  tr.textContent = fmtPan(targetPan); tr.classList.add('visible');

  // Route audio to true target position
  if (pannerNode && audioCtx) {
    pannerNode.pan.setTargetAtTime(
      gameMode === 'width' ? -targetPan : targetPan,
      audioCtx.currentTime, 0.04
    );
  }

  // Prompt card
  const tier = pts >= 85 ? 'perfect' : pts >= 65 ? 'good' : pts >= 40 ? 'ok' : 'bad';
  const msgs = { perfect:'🎯 Spot on!', good:'👍 Close!', ok:'🔶 Getting there', bad:'🔻 Keep training' };
  const pc = document.getElementById('promptCard');
  pc.classList.add(pts >= 65 ? 'correct-flash' : 'wrong-flash');
  const rb = document.getElementById('resultBadge');
  rb.textContent = `+${weightedPts} pts  ×${mult.toFixed(1)}`;
  rb.className   = `result-badge ${pts >= 65 ? 'good' : pts >= 40 ? 'ok' : 'bad'}`;

  document.getElementById('promptText').innerHTML =
    `${msgs[tier]} · Target: <span>${fmtPan(targetPan)}</span> — tap anywhere to continue`;
  document.getElementById('refRow').style.display = 'none';

  // Difference reveal in posDesc
  let diffStr;
  if (gameMode === 'width') {
    const d = Math.round((userPan - targetPan) * 100);
    diffStr = d === 0 ? 'exact' : Math.abs(d) + '% off';
  } else {
    const d = Math.round((userPan - targetPan) * 100);
    diffStr = d === 0 ? 'exact' : (d > 0 ? 'R +' : 'L ') + Math.abs(d) + '% off';
  }
  const diffClass = pts >= 65 ? 'good' : pts >= 40 ? 'ok' : 'bad';
  document.getElementById('posDesc').innerHTML =
    `Diff: <span class="${diffClass}">${diffStr}</span>`;

  // Error bar
  const ew = document.getElementById('errorWrap');
  const ef = document.getElementById('errorFill');
  ew.classList.add('visible');
  ef.style.background = pts >= 65 ? 'var(--green)' : pts >= 40 ? 'var(--amber)' : 'var(--red)';
  document.getElementById('errorPct').textContent = Math.round(errPct) + '% off';
  setTimeout(() => { ef.style.width = Math.min(100, errPct * 1.5) + '%'; }, 60);

  if (window.SonicSandbox) {
    SonicSandbox.saveScore({ game: 'spatial-specialist-ios', correct: pts >= 70, roundScore: weightedPts, rawScore: pts });
  }

  addHistory(tier);
}

// ── Reference toggle ──────────────────────────────────────────────────────────
function onRefTap(e, mode) {
  e.preventDefault();
  if (!roundActive || answered) return;
  isCenter = (mode === 'center');
  document.getElementById('refPanned').classList.toggle('active', !isCenter);
  document.getElementById('refCenter').classList.toggle('active',  isCenter);
  // Update audio panning
  if (pannerNode && audioCtx) {
    if (gameMode === 'panning') {
      pannerNode.pan.setTargetAtTime(isCenter ? 0 : targetPan, audioCtx.currentTime, 0.03);
    } else {
      // For width, restart audio since we need two panners vs one
      startAudio();
    }
  }
}

// ── Mode / Source ─────────────────────────────────────────────────────────────
function onModeTap(e, mode) {
  e.preventDefault();
  gameMode = mode;
  document.getElementById('modePanning').classList.toggle('active', mode === 'panning');
  document.getElementById('modeWidth').classList.toggle('active',   mode === 'width');
  // Restore L/R labels for both modes (ticks label Mono/Wide in width mode)
  document.getElementById('spkL').textContent = 'L';
  document.getElementById('spkR').textContent = 'R';
  document.getElementById('spkL').style.color = '';
  document.getElementById('spkR').style.color = '';
  buildTicks();
  updatePanUI(0.5);
}

function onSrcTap(e, src) {
  e.preventDefault();
  sourceType = src;
  document.getElementById('srcPink').classList.toggle('active',  src === 'pink');
  document.getElementById('srcLoops').classList.toggle('active', src === 'loops');
  if (roundActive) startAudio();
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(secs) {
  const rate = audioCtx.sampleRate, len = Math.ceil(rate * secs);
  const buf  = audioCtx.createBuffer(1, len, rate);
  const d    = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6 = w*0.115926;
  }
  const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
  return src;
}

function startAudio() {
  stopAudio();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  outGain = audioCtx.createGain(); outGain.gain.value = 0.65;
  outGain.connect(audioCtx.destination);

  if (gameMode === 'width' && !isCenter) {
    // Two panners at ±targetPan to create stereo width
    pannerNode  = audioCtx.createStereoPanner(); pannerNode.pan.value  = -targetPan;
    pannerNodeR = audioCtx.createStereoPanner(); pannerNodeR.pan.value =  targetPan;
    pannerNode.connect(outGain); pannerNodeR.connect(outGain);
    outGain.gain.value = 0.4;
    connectSources(pannerNode, pannerNodeR);
  } else {
    // Panning mode, or width center-ref (mono)
    pannerNode = audioCtx.createStereoPanner();
    pannerNode.pan.value = isCenter ? 0 : (gameMode === 'panning' ? targetPan : 0);
    pannerNode.connect(outGain);
    connectSources(pannerNode, null);
  }
  isPlaying = true;
}

function connectSources(destA, destB) {
  if (sourceType === 'loops') {
    buildLoopSources(destA, destB);
  } else {
    // Pink noise — two independent sources for width mode (different phase = true stereo width)
    const srcA = makePinkNoise(5);
    srcA.connect(destA); srcA.start(0); noiseSource = srcA;
    if (destB) {
      const srcB = makePinkNoise(5);
      srcB.connect(destB); srcB.start(0); noiseSourceR = srcB;
    }
  }
}

function buildLoopSources(destA, destB) {
  if (!loopAudioEl) {
    loopAudioEl = new Audio(); loopAudioEl.loop = true; loopAudioEl.crossOrigin = 'anonymous';
  }
  if (!loopMediaSrc) {
    loopMediaSrc = audioCtx.createMediaElementSource(loopAudioEl);
  }
  const fname = IOS_LOOPS[loopIdx % IOS_LOOPS.length];
  if (loopAudioEl._cur !== fname) {
    loopAudioEl.src = `../../samples/loops/${fname}`; loopAudioEl._cur = fname;
  }
  loopMediaSrc.connect(destA);
  if (destB) loopMediaSrc.connect(destB);
  loopAudioEl.play().catch(() => {});
  noiseSource = loopMediaSrc;
}

function stopAudio() {
  [noiseSource, noiseSourceR].forEach(s => {
    if (s && s !== loopMediaSrc) { try { s.stop(); } catch(e) {} }
  });
  noiseSource = noiseSourceR = null;
  if (loopAudioEl)   loopAudioEl.pause();
  if (loopMediaSrc)  { try { loopMediaSrc.disconnect(); } catch(e) {} }
  if (pannerNode)    { try { pannerNode.disconnect();   } catch(e) {} pannerNode = null; }
  if (pannerNodeR)   { try { pannerNodeR.disconnect();  } catch(e) {} pannerNodeR = null; }
  if (outGain)       { try { outGain.disconnect();      } catch(e) {} outGain = null; }
  isPlaying = false;
}

// ── History ───────────────────────────────────────────────────────────────────
function addHistory(tier) {
  const strip = document.getElementById('historyStrip');
  const dot   = document.createElement('div');
  dot.className = `hist-dot ${tier}`;
  strip.appendChild(dot);
  while (strip.children.length > 30) strip.removeChild(strip.firstChild);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildTicks();
updatePanUI(0.5);
document.getElementById('promptText').innerHTML =
  `Tap the ruler to place your <span>pan</span> guess — or drag the handle first`;

// ── Tap anywhere to advance after answering ───────────────────────────────────
document.addEventListener('touchend', e => {
  if (!answered || !roundActive || isDragging) return;
  if (e.target.closest('#panTrack')) return; // already handled by panTrack touchstart
  newRound();
}, { passive: true });
</script>
