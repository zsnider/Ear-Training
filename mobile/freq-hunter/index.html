<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Freq Hunter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:      #070b0f;
    --surface: #0f1520;
    --surface2:#161e2e;
    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text:    #e0eaf8;
    --muted:   #4a5870;
    --accent:  #00e5cc;
    --accent2: #50f0d8;
    --green:   #3ecf8e;
    --red:     #f45b69;
    --amber:   #f5a623;
    --purple:  #a855f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    user-select: none;
    touch-action: manipulation;
  }

  /* ── Layout shell ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .back-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; color: var(--muted); font-size: 18px; flex-shrink: 0;
  }
  .back-btn:active { background: var(--surface2); }

  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
  }
  .brand-name span { color: var(--accent); }

  .stats-row { display: flex; align-items: center; gap: 14px; }
  .stat { text-align: center; }
  .stat-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px; font-weight: 700; color: var(--accent2); line-height: 1;
  }
  .stat-label {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
  }
  .vdiv { width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; }

  /* ── Main ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
    gap: 10px;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Prompt card ── */
  .prompt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 58px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .prompt-card.correct-flash { border-color: var(--green); box-shadow: 0 0 20px rgba(62,207,142,0.18); }
  .prompt-card.wrong-flash   { border-color: var(--red);   box-shadow: 0 0 20px rgba(244,91,105,0.15); }

  .prompt-text {
    font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.35; flex: 1;
  }
  .prompt-text span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .prompt-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .btn-dry {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
    padding: 6px 11px; border-radius: 8px;
    border: 1.5px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer; letter-spacing: 0.06em;
    transition: all 0.12s;
    display: none;
  }
  .btn-dry:active { transform: scale(0.95); }
  .btn-dry.active {
    background: rgba(245,166,35,0.12);
    border-color: var(--amber); color: var(--amber);
  }

  .score-delta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px; font-weight: 700;
    opacity: 0; transition: opacity 0.15s; white-space: nowrap;
  }
  .score-delta.show { opacity: 1; }
  .score-delta.good { color: var(--green); }
  .score-delta.ok   { color: var(--amber); }
  .score-delta.bad  { color: var(--red); }

  /* ── Progress countdown bar ── */
  .progress-bar {
    height: 3px; background: var(--border2); border-radius: 2px;
    overflow: hidden; flex-shrink: 0; display: none;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    background: var(--accent); width: 100%; transition: none;
  }

  /* ── Sonar grid ── */
  .grid-card {
    flex: 1;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }

  canvas#sonarGrid {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ── History strip ── */
  .history-strip {
    display: flex; gap: 5px; flex-wrap: wrap;
    justify-content: center; min-height: 12px; flex-shrink: 0;
  }
  .hist-dot { width: 8px; height: 8px; border-radius: 50%; }
  .hist-dot.perfect { background: var(--accent2); }
  .hist-dot.good    { background: var(--green); }
  .hist-dot.ok      { background: var(--amber); }
  .hist-dot.bad     { background: var(--red); }

  /* ── Footer ── */
  footer {
    padding: 8px 16px 12px;
    display: flex; flex-direction: column; gap: 7px; flex-shrink: 0;
  }
  .footer-row { display: flex; gap: 7px; align-items: center; }
  .ctrl-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 9px 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 500;
    color: var(--muted);
    cursor: pointer; transition: all 0.15s;
    text-align: center; white-space: nowrap;
  }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.active {
    background: rgba(0,229,204,0.1);
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .row-divider {
    width: 1px; align-self: stretch;
    background: var(--border2); flex-shrink: 0; margin: 0 1px;
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="header-left">
      <a class="back-btn" href="/mobile/">‹</a>
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="white" stroke-width="2" opacity="0.4" fill="none"/>
            <circle cx="12" cy="12" r="4" stroke="white" stroke-width="2" opacity="0.7" fill="none"/>
            <circle cx="12" cy="12" r="1.5" fill="white"/>
            <line x1="12" y1="2"  x2="12" y2="5"  stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="2"  y1="12" x2="5"  y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="19" y1="12" x2="22" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">Freq Hunter</span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-val" id="scoreVal">0</div>
        <div class="stat-label">Score</div>
      </div>
      <div class="vdiv"></div>
      <div class="stat">
        <div class="stat-val" id="streakVal">0</div>
        <div class="stat-label">Streak</div>
      </div>
      <div class="vdiv"></div>
      <div class="stat">
        <div class="stat-val" id="errorVal">—</div>
        <div class="stat-label">Avg Err</div>
      </div>
    </div>
  </header>

  <!-- Game -->
  <main>

    <!-- Prompt card -->
    <div class="prompt-card" id="promptCard">
      <div class="prompt-text" id="promptText">Tap the grid to begin</div>
      <div class="prompt-right">
        <button class="btn-dry" id="btnDry" onclick="toggleDry()">DRY</button>
        <div class="score-delta" id="scoreDelta"></div>
      </div>
    </div>

    <!-- Progress countdown bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Sonar grid canvas -->
    <div class="grid-card" id="gridCard">
      <canvas id="sonarGrid"></canvas>
    </div>

    <!-- History strip -->
    <div class="history-strip" id="historyStrip"></div>

  </main>

  <!-- Footer -->
  <footer>
    <!-- Mode -->
    <div class="footer-row">
      <button class="ctrl-btn active" id="modeFreqPan" onclick="setMode('freqpan',this)">Freq + Pan</button>
      <button class="ctrl-btn"        id="modeFreq"    onclick="setMode('freq',this)">Freq Only</button>
      <button class="ctrl-btn"        id="modePan"     onclick="setMode('pan',this)">Pan Only</button>
    </div>
    <!-- Filter width + source -->
    <div class="footer-row">
      <button class="ctrl-btn active" id="qWide"   onclick="setQ(1,this)">Wide</button>
      <button class="ctrl-btn"        id="qMed"    onclick="setQ(2,this)">Medium</button>
      <button class="ctrl-btn"        id="qNarrow" onclick="setQ(4,this)">Narrow</button>
      <div class="row-divider"></div>
      <button class="ctrl-btn active" id="srcPink" onclick="setSource('pink')">Pink</button>
      <button class="ctrl-btn"        id="srcLoop" onclick="setSource('loop')">Loops</button>
    </div>
  </footer>

</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const SNAP_FREQS = [63, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
const FREQ_LABELS = {
  63:'63Hz', 125:'125', 250:'250', 500:'500',
  1000:'1k', 2000:'2k', 4000:'4k', 8000:'8k', 16000:'16k'
};
const FREQ_MIN = 63, FREQ_MAX = 16000;
const PAN_MIN = -1, PAN_MAX = 1;
const LOG_FMIN = Math.log10(FREQ_MIN), LOG_FMAX = Math.log10(FREQ_MAX);

const IOS_LOOPS = [
  'alex-morgan-acid-jazz-groove-517096.mp3',
  'alex-morgan-bebop-coffee-shop-517090.mp3',
  'atlasaudio-house-518082.mp3',
  'cyberwave-orchestra-orchestral-music-loop-287416.mp3',
  'joyinsound-corporate-background-music-quiet-progress-507151.mp3',
  'leberch-spain-518570.mp3',
  'mkgomez-minimal-techno-background-loop-475852.mp3',
  'nastelbom-lounge-house-314576.mp3',
  'ohpalmusic-passive-hip-hop-beat-90bpm-d-minor-177334.mp3',
  'openmindaudio-deep-club-organic-house-music-ashen-palms-524258.mp3',
  'openmindaudio-epic-organic-house-music-driftwood-ritual-524274.mp3',
  'prettyjohn1-chill-520383.mp3',
  'prettyjohn1-disco-funk-520385.mp3',
  'prettyjohn1-retro-funk-523181.mp3',
  'sonican-acoustic-senses-loop-313230.mp3',
  'sonican-feelgood-acoustic-loop-320856.mp3',
  'sonican-positive-corporate-music-optimistic-loop-464544.mp3',
  'sonofevan-gravel-in-my-lungs-470048.mp3',
  'the_mountain-deep-house-483808.mp3',
  'the_mountain-event-522459.mp3',
  'the_mountain-hi-tech-loop-151203.mp3',
  'the_mountain-loop-beat-130010.mp3',
  'the_mountain-soft-loop-130012.mp3',
  'the_mountain-vlog-522479.mp3',
  'tunetank-soft-house-music-348241.mp3',
];

// ── State ──────────────────────────────────────────────────────────────────────
let gameMode    = 'freqpan';
let bpQ         = 1;
let sourceType  = 'pink';
let targetFreq  = null;
let targetPan   = null;
let roundActive = false;
let answered    = false;
let gameStarted = false;
let isDry       = false;
let totalScore  = 0, streak = 0, totalRounds = 0, totalError = 0;
let nextTimeout = null;

// Canvas guess / target coords
let guessX = null, guessY = null;
let targetX = null, targetY = null;
let pingAnim = null;

// Audio
let audioCtx    = null;
let noiseSource = null;
let bpFilter    = null;
let pannerNode  = null;
let outGain     = null;
let isPlaying   = false;
let loopIdx     = 0;
let loopAudioEl = null, loopMediaSrc = null;

// Canvas
const canvas = document.getElementById('sonarGrid');
const ctx    = canvas.getContext('2d');

// ── Coordinate helpers ─────────────────────────────────────────────────────────
function panToX(pan, w)   { return ((pan - PAN_MIN) / (PAN_MAX - PAN_MIN)) * w; }
function freqToY(freq, h) { return h - ((Math.log10(freq) - LOG_FMIN) / (LOG_FMAX - LOG_FMIN)) * h; }
function xToPan(x, w)    { return PAN_MIN + (x / w) * (PAN_MAX - PAN_MIN); }
function yToFreq(y, h)   { return Math.pow(10, LOG_FMIN + ((h - y) / h) * (LOG_FMAX - LOG_FMIN)); }

function randNext(len, cur) {
  if (len <= 1) return 0;
  let n; do { n = Math.floor(Math.random() * len); } while (n === cur);
  return n;
}

// ── Canvas resize & draw ───────────────────────────────────────────────────────
function resizeCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const card = document.getElementById('gridCard');
  const W    = card.clientWidth;
  const H    = card.clientHeight;
  if (!W || !H) return;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  drawGrid();
}

function drawGrid() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, W, H);

  // ── Frequency grid lines + left-edge labels ──
  SNAP_FREQS.forEach(f => {
    const y = freqToY(f, H);
    ctx.strokeStyle = 'rgba(0,229,204,0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();

    ctx.fillStyle = 'rgba(0,229,204,0.38)';
    ctx.font = `9px 'IBM Plex Mono', monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(FREQ_LABELS[f], 5, y - 3);
  });

  // ── Pan grid lines ──
  [-1, -0.5, 0, 0.5, 1].forEach(p => {
    const x = panToX(p, W);
    ctx.strokeStyle = p === 0 ? 'rgba(0,229,204,0.16)' : 'rgba(0,229,204,0.06)';
    ctx.lineWidth   = p === 0 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  });

  // ── L / C / R labels at bottom ──
  [{ p: -1, label: 'L' }, { p: 0, label: 'C' }, { p: 1, label: 'R' }].forEach(({ p, label }) => {
    const x = panToX(p, W);
    ctx.fillStyle  = 'rgba(0,229,204,0.3)';
    ctx.font       = `9px 'IBM Plex Mono', monospace`;
    ctx.textAlign  = p === -1 ? 'left' : p === 1 ? 'right' : 'center';
    ctx.fillText(label, x + (p === -1 ? 4 : p === 1 ? -4 : 0), H - 5);
  });

  // ── Idle "tap to begin" overlay ──
  if (!gameStarted) {
    ctx.fillStyle = 'rgba(0,229,204,0.12)';
    ctx.font      = `500 15px 'IBM Plex Sans', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Tap to begin', W / 2, H / 2);
    return;
  }

  // ── Sonar ping animation ──
  if (pingAnim && pingAnim.progress < 1) {
    const { x, y, progress } = pingAnim;
    const maxR = Math.max(W, H) * 1.2;
    for (let i = 0; i < 3; i++) {
      const r     = maxR * Math.max(0, progress - i * 0.15);
      const alpha = Math.max(0, (1 - progress) * 0.35 * (1 - i * 0.3));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,229,204,${alpha})`;
      ctx.lineWidth   = 1.5 - i * 0.4;
      ctx.stroke();
    }
  }

  // ── Target crosshair (revealed after answer) ──
  if (answered && targetX !== null) {
    const tx = targetX, ty = targetY;
    ctx.strokeStyle = 'rgba(0,229,204,0.8)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(tx, 0);  ctx.lineTo(tx, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ty);  ctx.lineTo(W, ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,229,204,0.15)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,204,0.9)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#00e5cc'; ctx.fill();
  }

  // ── Guess marker ──
  if (guessX !== null) {
    const gx = guessX, gy = guessY;
    const err   = getError();
    const color = !answered          ? 'rgba(168,85,247,0.9)'
                : err < 15           ? 'rgba(62,207,142,0.9)'
                : err < 35           ? 'rgba(245,166,35,0.9)'
                :                      'rgba(244,91,105,0.9)';
    ctx.beginPath(); ctx.arc(gx, gy, 10, 0, Math.PI * 2);
    ctx.fillStyle = color.replace('0.9', '0.15'); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(gx, gy, 3, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();

    // Connector line to target
    if (answered && targetX !== null) {
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(targetX, targetY);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

// ── Error calculation ──────────────────────────────────────────────────────────
function getError() {
  if (!answered || guessX === null || targetX === null) return 0;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const panErr  = gameMode === 'freq' ? 0
    : Math.abs(xToPan(guessX, W) - targetPan) / 2 * 100;
  const freqErr = gameMode === 'pan'  ? 0
    : Math.abs(Math.log10(yToFreq(guessY, H)) - Math.log10(targetFreq)) / (LOG_FMAX - LOG_FMIN) * 100;
  return (panErr + freqErr) / (gameMode === 'freqpan' ? 2 : 1);
}

// ── Settings ───────────────────────────────────────────────────────────────────
function setMode(m, el) {
  gameMode = m;
  ['modeFreqPan', 'modeFreq', 'modePan'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
}

function setQ(q, el) {
  bpQ = q;
  ['qWide', 'qMed', 'qNarrow'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
  if (bpFilter && audioCtx && !isDry)
    bpFilter.Q.setTargetAtTime(q, audioCtx.currentTime, 0.01);
}

function setSource(type) {
  sourceType = type;
  document.getElementById('srcPink').classList.toggle('active', type === 'pink');
  document.getElementById('srcLoop').classList.toggle('active', type === 'loop');
}

// ── Sonar ping ─────────────────────────────────────────────────────────────────
function startSonarPing() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  pingAnim = { x: W / 2, y: H / 2, progress: 0 };
  let start = null;
  const dur = 2000;
  const animate = ts => {
    if (!start) start = ts;
    pingAnim.progress = Math.min(1, (ts - start) / dur);
    drawGrid();
    if (pingAnim.progress < 1) requestAnimationFrame(animate);
    else { pingAnim = null; drawGrid(); }
  };
  requestAnimationFrame(animate);
}

// ── Game flow ──────────────────────────────────────────────────────────────────
function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  gameStarted = true;
  newRound();
}

function newRound() {
  clearTimeout(nextTimeout);
  stopAudio();

  if (sourceType === 'loop')
    loopIdx = randNext(IOS_LOOPS.length, loopIdx);

  answered    = false;
  roundActive = true;
  isDry       = false;
  guessX = guessY = targetX = targetY = null;
  totalRounds++;

  // Pick target
  targetFreq = SNAP_FREQS[Math.floor(Math.random() * SNAP_FREQS.length)];
  targetPan  = Math.random() * 2 - 1;
  if (gameMode === 'freq') targetPan  = 0;
  if (gameMode === 'pan')  targetFreq = 1000;

  // Update prompt
  const modeStr = gameMode === 'freqpan' ? 'frequency & pan'
    : gameMode === 'freq' ? 'frequency' : 'pan position';
  document.getElementById('promptText').innerHTML =
    `Tap the grid — identify the <span>${modeStr}</span>`;
  document.getElementById('promptCard').classList.remove('correct-flash', 'wrong-flash');
  const sd = document.getElementById('scoreDelta');
  sd.className = 'score-delta'; sd.textContent = '';
  document.getElementById('progressBar').style.display = 'none';

  // Show dry button
  const dryBtn = document.getElementById('btnDry');
  dryBtn.style.display = 'block';
  dryBtn.classList.remove('active');
  dryBtn.textContent = 'DRY';

  startAudio();
  startSonarPing();
}

// ── Canvas touch ───────────────────────────────────────────────────────────────
canvas.addEventListener('touchend', e => {
  e.preventDefault();

  if (!gameStarted) { startGame(); return; }

  // Tap after answer = skip to next round immediately
  if (answered) {
    clearTimeout(nextTimeout);
    newRound();
    return;
  }

  if (!roundActive) return;

  const rect = canvas.getBoundingClientRect();
  const t    = e.changedTouches[0];
  guessX = t.clientX - rect.left;
  guessY = t.clientY - rect.top;

  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (gameMode === 'freq') guessX = W / 2;
  if (gameMode === 'pan')  guessY = freqToY(1000, H);

  submitGuess();
}, { passive: false });

// ── Submit guess ───────────────────────────────────────────────────────────────
function submitGuess() {
  if (!roundActive || answered || guessX === null) return;
  answered = true;
  stopAudio();

  // Hide dry button
  document.getElementById('btnDry').style.display = 'none';

  const W = canvas.clientWidth, H = canvas.clientHeight;
  targetX = panToX(targetPan, W);
  targetY = freqToY(targetFreq, H);

  const err = getError();
  const pts         = Math.round(Math.max(0, 100 - err * 1.8));
  const mult        = window.ScoringEngine ? ScoringEngine.multiplier('freq-hunter-ios', { mode: gameMode, qFactor: bpQ }) : 1;
  const weightedPts = Math.round(pts * mult);
  totalScore += weightedPts;
  totalError  = totalRounds <= 1 ? err : (totalError * (totalRounds - 1) + err) / totalRounds;
  if (pts >= 70) streak++; else streak = 0;

  document.getElementById('scoreVal').textContent  = totalScore;
  document.getElementById('streakVal').textContent = streak;
  document.getElementById('errorVal').textContent  = Math.round(totalError) + '%';

  if (window.SonicSandbox) {
    SonicSandbox.saveScore({ game: 'freq-hunter-ios', correct: pts >= 70, roundScore: weightedPts, rawScore: pts });
  }

  const tier      = pts >= 85 ? 'perfect' : pts >= 60 ? 'good' : pts >= 35 ? 'ok' : 'bad';
  const tierLabel = pts >= 85 ? '🎯 Perfect!' : pts >= 60 ? '👍 Good' : pts >= 35 ? '🔶 Close' : '🔻 Keep going';

  document.getElementById('promptCard').classList.add(pts >= 60 ? 'correct-flash' : 'wrong-flash');
  const sd = document.getElementById('scoreDelta');
  sd.textContent = `+${weightedPts} pts  ×${mult.toFixed(1)}`;
  sd.className   = `score-delta show ${pts >= 60 ? 'good' : pts >= 35 ? 'ok' : 'bad'}`;

  const tFreqLabel = targetFreq >= 1000 ? (targetFreq / 1000) + 'kHz' : targetFreq + 'Hz';
  const tPanLabel  = Math.abs(targetPan) < 0.02 ? 'C'
    : (targetPan > 0 ? 'R' : 'L') + Math.round(Math.abs(targetPan) * 100) + '%';
  const targetStr  = gameMode === 'freq'    ? tFreqLabel
                   : gameMode === 'pan'     ? tPanLabel
                   : `${tFreqLabel} ${tPanLabel}`;

  document.getElementById('promptText').innerHTML =
    `${tierLabel} · <span>${targetStr}</span>`;

  addHistory(tier);
  drawGrid();

  // Countdown → next round (or tap to skip)
  const delay = pts >= 60 ? 1500 : 2500;
  const bar   = document.getElementById('progressBar');
  const fill  = document.getElementById('progressFill');
  bar.style.display = 'block';
  fill.style.transition = 'none'; fill.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${delay}ms linear`;
    fill.style.width = '0%';
  }));
  nextTimeout = setTimeout(newRound, delay);
}

// ── History strip ──────────────────────────────────────────────────────────────
function addHistory(tier) {
  const strip = document.getElementById('historyStrip');
  const dot   = document.createElement('div');
  dot.className = `hist-dot ${tier}`;
  strip.appendChild(dot);
  while (strip.children.length > 30) strip.removeChild(strip.firstChild);
}

// ── Dry toggle ─────────────────────────────────────────────────────────────────
function toggleDry() {
  if (!roundActive || answered) return;
  isDry = !isDry;
  const btn = document.getElementById('btnDry');
  btn.classList.toggle('active', isDry);
  btn.textContent = isDry ? 'WET' : 'DRY';
  if (audioCtx && bpFilter && pannerNode) {
    bpFilter.frequency.setTargetAtTime(isDry ? 1000    : targetFreq, audioCtx.currentTime, 0.01);
    bpFilter.Q.setTargetAtTime        (isDry ? 0.1     : bpQ,        audioCtx.currentTime, 0.01);
    pannerNode.pan.setTargetAtTime    (isDry ? 0       : targetPan,   audioCtx.currentTime, 0.01);
    outGain.gain.setTargetAtTime      (isDry ? 0.55    : 0.45,        audioCtx.currentTime, 0.01);
  }
}

// ── Audio ──────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(secs) {
  const rate = audioCtx.sampleRate, len = Math.ceil(rate * secs);
  const buf  = audioCtx.createBuffer(1, len, rate);
  const d    = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.loop = true; return src;
}

function startAudio() {
  stopAudio();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // source → bandpass → panner → gain → output
  bpFilter = audioCtx.createBiquadFilter();
  bpFilter.type = 'bandpass';
  bpFilter.frequency.value = targetFreq;
  bpFilter.Q.value = bpQ;

  pannerNode = audioCtx.createStereoPanner();
  pannerNode.pan.value = targetPan;

  outGain = audioCtx.createGain();
  outGain.gain.value = 0.45;

  bpFilter.connect(pannerNode);
  pannerNode.connect(outGain);
  outGain.connect(audioCtx.destination);

  if (sourceType === 'loop') {
    if (!loopAudioEl) { loopAudioEl = new Audio(); loopAudioEl.loop = true; }
    if (!loopMediaSrc) { loopMediaSrc = audioCtx.createMediaElementSource(loopAudioEl); }
    const fname = IOS_LOOPS[loopIdx % IOS_LOOPS.length];
    if (loopAudioEl._currentFname !== fname) {
      loopAudioEl.src = `../../samples/loops/${fname}`;
      loopAudioEl._currentFname = fname;
    }
    loopMediaSrc.connect(bpFilter);
    loopAudioEl.play().catch(e => console.warn('loop blocked:', e));
    noiseSource = loopMediaSrc;
  } else {
    const src = makePinkNoise(5);
    src.connect(bpFilter);
    src.start(0);
    noiseSource = src;
  }

  isPlaying = true;
}

function stopAudio() {
  if (noiseSource && noiseSource !== loopMediaSrc) {
    try { noiseSource.stop(); } catch(e) {}
  }
  noiseSource = null;
  if (loopAudioEl) loopAudioEl.pause();
  if (loopMediaSrc) { try { loopMediaSrc.disconnect(); } catch(e) {} }
  if (bpFilter)   { try { bpFilter.disconnect();   } catch(e) {} bpFilter   = null; }
  if (pannerNode) { try { pannerNode.disconnect(); } catch(e) {} pannerNode = null; }
  if (outGain)    { try { outGain.disconnect();    } catch(e) {} outGain    = null; }
  isPlaying = false;
}

// ── Init ───────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resizeCanvas);
// Defer initial resize so flex layout has settled
requestAnimationFrame(() => resizeCanvas());
</script>
