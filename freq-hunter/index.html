<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freq Hunter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #070b0f;
    --bg2:      #0a0e14;
    --surface:  #0f1520;
    --surface2: #161e2e;
    --surface3: #1c2638;
    --border:   rgba(255,255,255,0.07);
    --border2:  rgba(255,255,255,0.13);
    --text:     #e0eaf8;
    --muted:    #4a5870;
    --accent:   #00e5cc;
    --accent2:  #50f0d8;
    --pan-col:  #a855f7;
    --pan2:     #c084fc;
    --green:    #3ecf8e;
    --red:      #f45b69;
    --amber:    #f5a623;
    --grid-line: rgba(0,229,204,0.06);
    --grid-line2: rgba(0,229,204,0.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: 40px;
    user-select: none;
  }

  header {
    width: 100%; max-width: 860px;
    padding: 20px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
  }

  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.06em;
  }
  .brand-name span { color: var(--accent); }

  .score-row { display:flex; gap:18px; align-items:center; }
  .stat { text-align:center; }
  .stat-val { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:var(--accent2); }
  .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; }
  .vdiv { width:1px; height:20px; background:var(--border2); }

  .main {
    width: 100%; max-width: 860px;
    padding: 14px 24px 0;
    display: flex; flex-direction: column; gap: 12px;
  }

  .settings-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 12px;
  }

  .label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap;
  }

  .pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,229,204,0.08); }

  select {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border2);
    padding: 4px 10px; border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }

  kbd {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }

  /* ── Main 2D sonar grid ── */
  .grid-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }

  .grid-wrap {
    position: relative;
    display: flex;
  }

  /* Y-axis frequency labels */
  .y-axis {
    width: 44px;
    flex-shrink: 0;
    position: relative;
    background: var(--surface2);
    border-right: 1px solid var(--border);
  }
  .y-label {
    position: absolute;
    right: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    transform: translateY(-50%);
    white-space: nowrap;
  }

  canvas#sonarGrid {
    display: block;
    flex: 1;
    cursor: crosshair;
    touch-action: none;
  }

  /* X-axis pan labels */
  .x-axis {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px 5px;
    margin-left: 44px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .x-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; color: var(--muted);
  }
  .x-label.center { color: var(--border2); }

  /* ── Prompt / result bar ── */
  .prompt-bar {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 16px;
    min-height: 56px;
    flex-wrap: wrap;
    transition: border-color 0.3s;
  }
  .prompt-bar.correct-flash { border-color: var(--green); box-shadow: 0 0 16px rgba(62,207,142,0.15); }
  .prompt-bar.wrong-flash   { border-color: var(--red);   box-shadow: 0 0 16px rgba(244,91,105,0.12); }

  .prompt-text {
    font-size: 14px; color: var(--text); flex: 1;
  }
  .prompt-text span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .score-delta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px; font-weight: 700;
    opacity: 0; transition: opacity 0.15s;
    white-space: nowrap;
  }
  .score-delta.show { opacity: 1; }
  .score-delta.good { color: var(--green); }
  .score-delta.ok   { color: var(--amber); }
  .score-delta.bad  { color: var(--red); }

  .next-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .next-fill { height: 100%; border-radius: 2px; background: var(--accent); width: 100%; transition: none; }

  /* ── Audio controls ── */
  .audio-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }

  button {
    border: none; border-radius: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 8px 16px; transition: all 0.15s;
  }
  .btn-listen {
    background: var(--surface2); color: var(--accent);
    border: 1px solid rgba(0,229,204,0.3);
    display: flex; align-items: center; gap: 6px;
  }
  .btn-listen:hover { background: rgba(0,229,204,0.08); border-color: rgba(0,229,204,0.6); }
  .btn-listen.playing { background: rgba(0,229,204,0.12); border-color: var(--accent); }
  .btn-listen:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-action {
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border2);
    font-size: 12px; padding: 7px 13px; border-radius: 8px;
    display: flex; align-items: center; gap: 5px;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action.dry-active { background: rgba(245,166,35,0.08); border-color: var(--amber); color: var(--amber); }
  .btn-action.paused { background: rgba(244,91,105,0.08); border-color: var(--red); color: var(--red); }
  .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

  .source-wrap {
    display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap;
  }
  .source-pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 5px 12px; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .source-pill:hover { border-color: var(--accent); color: var(--text); }
  .source-pill.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,229,204,0.07); }

  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    animation: pdot 1.1s infinite;
  }
  @keyframes pdot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.3;transform:scale(0.6);} }

  /* ── History ── */
  .history-strip { display:flex; gap:5px; flex-wrap:wrap; min-height:14px; }
  .hist-dot { width:10px; height:10px; border-radius:50%; }
  .hist-dot.perfect { background: var(--accent2); }
  .hist-dot.good    { background: var(--green); }
  .hist-dot.ok      { background: var(--amber); }
  .hist-dot.bad     { background: var(--red); }

  /* ── Toast ── */
  .toast {
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:10px; padding:10px 16px; font-size:13px; color:var(--text);
    opacity:0; transition:all 0.2s; pointer-events:none; z-index:999; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <!-- Sonar rings -->
        <circle cx="9" cy="9" r="2" fill="black"/>
        <circle cx="9" cy="9" r="5" stroke="black" stroke-width="1.5" fill="none" opacity="0.7"/>
        <circle cx="9" cy="9" r="8" stroke="black" stroke-width="1" fill="none" opacity="0.4"/>
        <line x1="9" y1="9" x2="15" y2="4" stroke="black" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
      </svg>
    </div>
    <span class="brand-name">FREQ <span>HUNTER</span></span>
  </div>
  <div class="score-row">
    <div class="stat">
      <div class="stat-val" id="scoreVal">0</div>
      <div class="stat-label">Score</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-label">Streak</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="accuracyVal">—</div>
      <div class="stat-label">Avg Error</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="roundVal">0</div>
      <div class="stat-label">Round</div>
    </div>
  </div>
</header>

<div class="main">

  <!-- Settings -->
  <div class="settings-row">
    <span class="label">Mode</span>
    <div class="pill active" id="modeFreqPan" onclick="setMode('freqpan',this)">Freq + Pan</div>
    <div class="pill"        id="modeFreq"    onclick="setMode('freq',this)">Freq Only</div>
    <div class="pill"        id="modePan"     onclick="setMode('pan',this)">Pan Only</div>
    <div class="vdiv"></div>
    <span class="label">Width</span>
    <select id="bpqSelect" onchange="setBPQ(+this.value)">
      <option value="1">Wide (Q=1)</option>
      <option value="2" selected>Medium (Q=2)</option>
      <option value="4">Narrow (Q=4)</option>
      <option value="8">Very Narrow (Q=8)</option>
    </select>
    <div class="vdiv" style="margin-left:auto;"></div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap;">
      <kbd>Space</kbd>/<kbd>D</kbd> dry &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>F</kbd> restart &nbsp;·&nbsp; click to guess
    </span>
  </div>

  <!-- Prompt -->
  <div class="prompt-bar" id="promptBar">
    <div style="flex:1;">
      <div class="prompt-text" id="promptText">Click <span>Play</span> to begin — then click the grid to place your guess</div>
      <div class="next-bar" id="nextBar" style="display:none;"><div class="next-fill" id="nextFill"></div></div>
    </div>
    <div class="score-delta" id="scoreDelta">+0</div>
  </div>

  <!-- Sonar Grid -->
  <div class="grid-card">
    <div class="grid-wrap">
      <div class="y-axis" id="yAxis"></div>
      <canvas id="sonarGrid"></canvas>
    </div>
    <div class="x-axis">
      <span class="x-label">L 100%</span>
      <span class="x-label">L 50%</span>
      <span class="x-label center">C</span>
      <span class="x-label">R 50%</span>
      <span class="x-label">R 100%</span>
    </div>
  </div>

  <!-- History -->
  <div class="history-strip" id="historyStrip"></div>

  <!-- Audio controls -->
  <div class="audio-bar">
    <button class="btn-listen" id="btnPlay" onclick="startRound()">
      <span id="playDot"></span> Play
    </button>
    <button class="btn-action" id="btnDry"     onclick="toggleDry()"    disabled>Dry</button>
    <button class="btn-action" id="btnPause"   onclick="togglePause()"  disabled>&#9646;&#9646; Pause</button>
    <button class="btn-action" id="btnRestart" onclick="restartAudio()" disabled>&#9654; Restart</button>

    <div class="source-wrap">
      <span class="label">Source</span>
      <div class="source-pill active" id="srcPink"    onclick="setSource('pink')">Pink Noise</div>
      <div class="source-pill"        id="srcBuiltin" onclick="setSource('builtin')">Sample One-shots</div>
      <div class="source-pill"        id="srcCustom"  onclick="triggerUpload()" style="border-style:dashed;">
        <span id="uploadLabel">📁 Upload Music</span>
      </div>
      <input type="file" id="folderInput" webkitdirectory directory multiple
             onchange="handleFolderUpload(event)" style="display:none;">
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const FREQ_MIN = 63, FREQ_MAX = 16000;
const PAN_MIN = -1, PAN_MAX = 1;  // -1=full left, 0=center, +1=full right
const LOG_FMIN = Math.log10(FREQ_MIN), LOG_FMAX = Math.log10(FREQ_MAX);

// Snap frequencies (same as FreqQuiz)
const SNAP_FREQS = [63,125,250,500,1000,2000,4000,8000,16000];

// ── State ─────────────────────────────────────────────────────────────────────
let gameMode   = 'freqpan';  // 'freqpan' | 'freq' | 'pan'
let bpQ        = 2;
let targetFreq = null;
let targetPan  = null;
let roundActive= false;
let answered   = false;
let totalScore = 0, streak = 0, totalRounds = 0;
let totalError = 0; // accumulate for avg error display

// Audio
let audioCtx      = null;
let noiseSource   = null;
let bpFilter      = null;
let pannerNode    = null;
let outGain       = null;
let isDry         = false;
let isPaused      = false;
let isPlaying     = false;
let shotLoopTimer = null;
let sourceType    = 'pink';
let customBuffers = [], customIdx = 0, musicOffset = 0, musicStartedAt = 0;
let builtinBuffers= [], builtinLoaded=false, builtinIdx=0;
let currentShotSrc= null;

// Canvas
const canvas = document.getElementById('sonarGrid');
const ctx     = canvas.getContext('2d');
let guessX    = null; // pixel coords
let guessY    = null;
let targetX   = null;
let targetY   = null;
let pingAnim  = null; // sonar ping animation state

// ── Coordinate helpers ────────────────────────────────────────────────────────
function panToX(pan, w) {
  return ((pan - PAN_MIN) / (PAN_MAX - PAN_MIN)) * w;
}
function freqToY(freq, h) {
  return h - ((Math.log10(freq) - LOG_FMIN) / (LOG_FMAX - LOG_FMIN)) * h;
}
function xToPan(x, w) {
  return PAN_MIN + (x / w) * (PAN_MAX - PAN_MIN);
}
function yToFreq(y, h) {
  return Math.pow(10, LOG_FMIN + ((h - y) / h) * (LOG_FMAX - LOG_FMIN));
}

// ── Build Y-axis labels ───────────────────────────────────────────────────────
function buildYAxis() {
  const axis = document.getElementById('yAxis');
  axis.innerHTML = '';
  const h = canvas.clientHeight || 400;
  SNAP_FREQS.forEach(f => {
    const pct = ((Math.log10(f) - LOG_FMIN) / (LOG_FMAX - LOG_FMIN));
    const top  = (1 - pct) * 100;
    const lbl  = document.createElement('div');
    lbl.className = 'y-label';
    lbl.style.top = top + '%';
    lbl.textContent = f >= 1000 ? (f/1000)+'k' : f;
    axis.appendChild(lbl);
  });
}

// ── Draw grid ─────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const card = canvas.parentElement.parentElement; // grid-card
  const W    = card.clientWidth - 44; // subtract y-axis width
  const H    = Math.round(W * 0.52);  // aspect ratio
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  document.getElementById('yAxis').style.height = H + 'px';
  buildYAxis();
  drawGrid();
}

function drawGrid() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, W, H);

  // Frequency grid lines (horizontal)
  SNAP_FREQS.forEach(f => {
    const y = freqToY(f, H);
    ctx.strokeStyle = 'rgba(0,229,204,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  });

  // Pan grid lines (vertical) — every 25%
  [-1, -0.5, 0, 0.5, 1].forEach(p => {
    const x = panToX(p, W);
    ctx.strokeStyle = p === 0 ? 'rgba(0,229,204,0.14)' : 'rgba(0,229,204,0.06)';
    ctx.lineWidth = p === 0 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  });

  // Sonar ping animation
  if (pingAnim && pingAnim.progress < 1) {
    const { x, y, progress } = pingAnim;
    const maxR = Math.max(W, H) * 1.2;
    for (let i = 0; i < 3; i++) {
      const r   = maxR * Math.max(0, progress - i * 0.15);
      const alpha = Math.max(0, (1 - progress) * 0.4 * (1 - i * 0.3));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,229,204,${alpha})`;
      ctx.lineWidth = 1.5 - i*0.4;
      ctx.stroke();
    }
  }

  // Target marker (revealed after answer)
  if (answered && targetX !== null) {
    const x = targetX, y = targetY;
    // Crosshair lines
    ctx.strokeStyle = 'rgba(0,229,204,0.8)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.setLineDash([]);
    // Target circle
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,229,204,0.15)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,204,0.9)'; ctx.lineWidth = 2; ctx.stroke();
    // Inner dot
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2);
    ctx.fillStyle = 'var(--accent)'; ctx.fill();
  }

  // Guess marker
  if (guessX !== null) {
    const x = guessX, y = guessY;
    const color = answered
      ? (getError() < 15 ? 'rgba(62,207,142,0.9)' : getError() < 35 ? 'rgba(245,166,35,0.9)' : 'rgba(244,91,105,0.9)')
      : 'rgba(168,85,247,0.9)';

    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2);
    ctx.fillStyle = color.replace('0.9','0.15'); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();

    // Error line from guess to target
    if (answered && targetX !== null) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(targetX, targetY);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // Hover cursor guide (drawn in mousemove)
}

function getError() {
  if (!answered || guessX === null || targetX === null) return 0;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  // Normalised pan error (0-100 scale)
  const gPan  = xToPan(guessX, W), tPan = targetPan;
  const gFreq = yToFreq(guessY, H), tFreq = targetFreq;
  const panErr  = gameMode === 'freq' ? 0 : Math.abs(gPan - tPan) / 2 * 100;
  const freqErr = gameMode === 'pan'  ? 0 : Math.abs(Math.log10(gFreq) - Math.log10(tFreq)) / (LOG_FMAX - LOG_FMIN) * 100;
  return (panErr + freqErr) / (gameMode === 'freqpan' ? 2 : 1);
}

// ── Mode / settings ───────────────────────────────────────────────────────────
function setMode(m, el) {
  gameMode = m;
  ['modeFreqPan','modeFreq','modePan'].forEach(id => document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
}
function setBPQ(v) { bpQ = v; }

// ── Round ─────────────────────────────────────────────────────────────────────
function startRound() {
  if (roundActive && !answered) return; // don't restart mid-round
  clearTimeout(window._nextTimeout);
  answered   = false;
  guessX = guessY = targetX = targetY = null;
  roundActive = true;
  totalRounds++;
  document.getElementById('roundVal').textContent = totalRounds;

  // Randomise target
  const snapIdx  = Math.floor(Math.random() * SNAP_FREQS.length);
  targetFreq = SNAP_FREQS[snapIdx];
  targetPan  = (Math.random() * 2 - 1); // -1 to +1
  if (gameMode === 'freq') targetPan  = 0;
  if (gameMode === 'pan')  targetFreq = 1000; // fixed 1kHz bandpass

  document.getElementById('promptBar').classList.remove('correct-flash','wrong-flash');
  const sd = document.getElementById('scoreDelta');
  sd.className = 'score-delta'; sd.textContent = '';
  document.getElementById('nextBar').style.display = 'none';

  const modeLabel = gameMode === 'freqpan' ? 'frequency <span>&</span> pan position' :
                    gameMode === 'freq'    ? 'frequency' : 'pan position';
  document.getElementById('promptText').innerHTML =
    `Listen and click the grid to identify the <span>${modeLabel === 'frequency <span>&</span> pan position' ? 'frequency & pan' : modeLabel}</span>`;

  document.getElementById('btnDry').disabled = false;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnRestart').disabled = false;

  drawGrid();
  startAudio();
  startSonarPing();
}

// ── Sonar ping animation ──────────────────────────────────────────────────────
function startSonarPing() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  // Ping emanates from the target position (but we don't reveal it)
  // Use center of grid for the ping origin to avoid revealing position
  const cx = W/2, cy = H/2;
  pingAnim = { x: cx, y: cy, progress: 0 };
  let start = null;
  const dur  = 2200;
  const animate = (ts) => {
    if (!start) start = ts;
    pingAnim.progress = Math.min(1, (ts - start) / dur);
    drawGrid();
    if (pingAnim.progress < 1) requestAnimationFrame(animate);
    else { pingAnim = null; drawGrid(); }
  };
  requestAnimationFrame(animate);
}

// ── Canvas interaction ────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (!roundActive || answered) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  // Draw hover guide
  const W = canvas.clientWidth, H = canvas.clientHeight;
  drawGrid();
  ctx.strokeStyle = 'rgba(168,85,247,0.25)'; ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  ctx.setLineDash([]);
  // Show freq/pan readout
  const freq = yToFreq(y, H), pan = xToPan(x, W);
  ctx.fillStyle = 'rgba(168,85,247,0.7)';
  ctx.font = '10px IBM Plex Mono, monospace';
  const freqLabel = freq>=1000 ? (freq/1000).toFixed(1)+'kHz' : Math.round(freq)+'Hz';
  const panLabel  = pan === 0 ? 'C' : (pan > 0 ? 'R':'L')+Math.round(Math.abs(pan)*100)+'%';
  let label = gameMode==='freq' ? freqLabel : gameMode==='pan' ? panLabel : `${freqLabel}  ${panLabel}`;
  ctx.fillText(label, x+8, y-6 < 12 ? y+16 : y-6);
});

canvas.addEventListener('mouseleave', () => { if (roundActive && !answered) drawGrid(); });

canvas.addEventListener('click', e => {
  if (!roundActive || answered) return;
  const rect = canvas.getBoundingClientRect();
  guessX = e.clientX - rect.left;
  guessY = e.clientY - rect.top;

  // In freq-only mode: snap X to center; in pan-only mode: snap Y to 1kHz
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (gameMode === 'freq') guessX = W/2;
  if (gameMode === 'pan')  guessY = freqToY(1000, H);

  submitGuess();
});

canvas.addEventListener('touchend', e => {
  if (!roundActive || answered) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t    = e.changedTouches[0];
  guessX = t.clientX - rect.left;
  guessY = t.clientY - rect.top;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (gameMode === 'freq') guessX = W/2;
  if (gameMode === 'pan')  guessY = freqToY(1000, H);
  submitGuess();
}, { passive: false });

// ── Score guess ───────────────────────────────────────────────────────────────
function submitGuess() {
  if (!roundActive || answered || guessX === null) return;
  answered = true;

  const W = canvas.clientWidth, H = canvas.clientHeight;
  targetX = panToX(targetPan, W);
  targetY = freqToY(targetFreq, H);

  const err = getError(); // 0–100, lower=better
  const pts  = Math.round(Math.max(0, 100 - err * 1.8));

  totalScore += pts;
  totalError  = totalError === 0 ? err : (totalError * (totalRounds-1) + err) / totalRounds;
  if (pts >= 70) streak++;
  else streak = 0;

  document.getElementById('scoreVal').textContent   = totalScore;
  document.getElementById('streakVal').textContent  = streak;
  document.getElementById('accuracyVal').textContent = Math.round(totalError) + '%';

  // Classify result
  const tier = pts >= 85 ? 'perfect' : pts >= 60 ? 'good' : pts >= 35 ? 'ok' : 'bad';
  const tierLabel = pts >= 85 ? '🎯 Perfect!' : pts >= 60 ? '👍 Good' : pts >= 35 ? '🔶 Close' : '🔻 Keep going';
  const gFreq = yToFreq(guessY, H);
  const gPan  = xToPan(guessX, W);

  document.getElementById('promptBar').classList.add(pts >= 60 ? 'correct-flash' : 'wrong-flash');
  const sd = document.getElementById('scoreDelta');
  sd.textContent = `+${pts}`;
  sd.className   = `score-delta show ${tier === 'perfect' || tier === 'good' ? 'good' : tier === 'ok' ? 'ok' : 'bad'}`;

  document.getElementById('promptText').innerHTML =
    `${tierLabel} &nbsp;·&nbsp; Target: <span>${targetFreq>=1000?(targetFreq/1000)+'kHz':targetFreq+'Hz'} ${targetPan===0?'C':(targetPan>0?'R':'L')+Math.round(Math.abs(targetPan)*100)+'%'}</span>`;

  addHistory(tier);
  drawGrid();

  // Auto advance
  const delay = pts >= 60 ? 1500 : 2500;
  const bar = document.getElementById('nextBar');
  const fill = document.getElementById('nextFill');
  bar.style.display = 'block';
  fill.style.transition = 'none'; fill.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${delay}ms linear`; fill.style.width = '0%';
  }));
  window._nextTimeout = setTimeout(startRound, delay);
}

// ── History strip ─────────────────────────────────────────────────────────────
function addHistory(tier) {
  const strip = document.getElementById('historyStrip');
  const dot = document.createElement('div');
  dot.className = `hist-dot ${tier}`;
  strip.appendChild(dot);
  while (strip.children.length > 40) strip.removeChild(strip.firstChild);
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(secs) {
  const rate=audioCtx.sampleRate, len=Math.ceil(rate*secs);
  const buf=audioCtx.createBuffer(1,len,rate);
  const d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  const src=audioCtx.createBufferSource();
  src.buffer=buf; src.loop=true;
  return src;
}

function startAudio() {
  stopAudio();
  initAudio();
  if (audioCtx.state==='suspended') audioCtx.resume();

  // Build graph: source → bandpass → panner → gain → destination
  bpFilter = audioCtx.createBiquadFilter();
  bpFilter.type      = 'bandpass';
  bpFilter.frequency.value = isDry ? 1000 : targetFreq;
  bpFilter.Q.value   = isDry ? 0.1 : bpQ; // near-flat when dry

  pannerNode = audioCtx.createStereoPanner();
  pannerNode.pan.value = isDry ? 0 : targetPan;

  outGain = audioCtx.createGain(); outGain.gain.value = isDry ? 0.55 : 0.45;
  bpFilter.connect(pannerNode); pannerNode.connect(outGain); outGain.connect(audioCtx.destination);

  if (sourceType === 'builtin') {
    startBuiltinLoop();
  } else if (sourceType === 'custom' && customBuffers.length > 0) {
    const buf = customBuffers[customIdx % customBuffers.length];
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(bpFilter); src.start(0, musicOffset);
    noiseSource = src; musicStartedAt = audioCtx.currentTime - musicOffset;
  } else {
    const src = makePinkNoise(5);
    src.connect(bpFilter); src.start(0);
    noiseSource = src;
  }

  isPlaying = true;
  document.getElementById('playDot').className = 'pulse-dot';
  document.getElementById('btnPlay').classList.add('playing');
}

function stopAudio() {
  if (shotLoopTimer) { clearInterval(shotLoopTimer); shotLoopTimer = null; }
  if (noiseSource)     { try { noiseSource.stop(); }     catch(e){} noiseSource = null; }
  if (currentShotSrc) { try { currentShotSrc.stop(); } catch(e){} currentShotSrc = null; }
  if (bpFilter)  { try { bpFilter.disconnect(); }    catch(e){} bpFilter = null; }
  if (pannerNode){ try { pannerNode.disconnect(); }  catch(e){} pannerNode = null; }
  if (outGain)   { try { outGain.disconnect(); }     catch(e){} outGain = null; }
  isPlaying = false;
  document.getElementById('playDot').className = '';
  document.getElementById('btnPlay').classList.remove('playing');
}

function startBuiltinLoop() {
  if (!builtinBuffers.length) return;
  const fire = () => {
    if (!isPlaying || sourceType !== 'builtin') return;
    const sample = builtinBuffers[builtinIdx % builtinBuffers.length];
    const src = audioCtx.createBufferSource();
    src.buffer = sample.buffer;
    src.connect(bpFilter); src.start(0);
    currentShotSrc = src;
  };
  fire(); shotLoopTimer = setInterval(fire, 5000);
}

// ── Dry / Pause / Restart ─────────────────────────────────────────────────────
function toggleDry() {
  if (!roundActive) return;
  isDry = !isDry;
  const btn = document.getElementById('btnDry');
  btn.classList.toggle('dry-active', isDry);
  btn.textContent = isDry ? 'Wet' : 'Dry';
  if (audioCtx && bpFilter && pannerNode) {
    bpFilter.frequency.setTargetAtTime(isDry ? 1000 : targetFreq, audioCtx.currentTime, 0.01);
    bpFilter.Q.setTargetAtTime(isDry ? 0.1 : bpQ, audioCtx.currentTime, 0.01);
    pannerNode.pan.setTargetAtTime(isDry ? 0 : targetPan, audioCtx.currentTime, 0.01);
    outGain.gain.setTargetAtTime(isDry ? 0.55 : 0.45, audioCtx.currentTime, 0.01);
  }
}

function togglePause() {
  if (!roundActive || !audioCtx) return;
  const btn = document.getElementById('btnPause');
  if (isPaused) {
    audioCtx.resume().then(() => {
      isPaused = false;
      btn.innerHTML = '&#9646;&#9646; Pause'; btn.classList.remove('paused');
      if (sourceType === 'builtin' && isPlaying) {
        if (shotLoopTimer) clearInterval(shotLoopTimer);
        const fire = () => {
          if (!isPlaying) return;
          const s = builtinBuffers[builtinIdx % builtinBuffers.length];
          const src = audioCtx.createBufferSource();
          src.buffer = s.buffer;
          if (bpFilter) src.connect(bpFilter); src.start(0); currentShotSrc = src;
        };
        fire(); shotLoopTimer = setInterval(fire, 5000);
      }
    });
  } else {
    if (shotLoopTimer) { clearInterval(shotLoopTimer); shotLoopTimer = null; }
    audioCtx.suspend().then(() => {
      isPaused = true;
      btn.innerHTML = '&#9654; Resume'; btn.classList.add('paused');
    });
  }
}

function restartAudio() {
  if (!roundActive) return;
  if (isPaused && audioCtx) {
    audioCtx.resume(); isPaused = false;
    const btn = document.getElementById('btnPause');
    btn.innerHTML = '&#9646;&#9646; Pause'; btn.classList.remove('paused');
  }
  musicOffset = 0;
  startAudio();
  showToast('Restarted');
}

// ── Source ────────────────────────────────────────────────────────────────────
function setSource(type) {
  if (type==='builtin' && !builtinLoaded) {
    showToast('Loading samples…');
    loadBuiltinSamples().then(() => { sourceType='builtin'; updateSourceUI(); if(roundActive&&isPlaying)startAudio(); });
    return;
  }
  sourceType=type; updateSourceUI();
  if (roundActive && isPlaying) startAudio();
}
function updateSourceUI() {
  document.getElementById('srcPink').classList.toggle('active',    sourceType==='pink');
  document.getElementById('srcCustom').classList.toggle('active',  sourceType==='custom');
  document.getElementById('srcBuiltin').classList.toggle('active', sourceType==='builtin');
}
function triggerUpload() {
  if (customBuffers.length>0){setSource('custom');return;}
  document.getElementById('folderInput').click();
}
async function handleFolderUpload(e) {
  const files=Array.from(e.target.files).filter(f=>f.type.startsWith('audio/'));
  if(!files.length)return;
  initAudio(); customBuffers=[]; showToast(`Loading ${files.length} tracks…`);
  for(const f of files){
    try{const ab=await f.arrayBuffer();customBuffers.push(await audioCtx.decodeAudioData(ab));}
    catch(err){console.warn('decode error',f.name);}
  }
  if(customBuffers.length>0){
    document.getElementById('uploadLabel').textContent=`📁 Folder (${customBuffers.length} tracks)`;
    setSource('custom'); showToast('Music loaded!');
  }
}

const SAMPLE_FILES = [
  'CLAP_DEEP_001.wav','CLAP_DEEP_002.wav','CLAP_DEEP_003.wav',
  'CLAP_DEEP_004.wav','CLAP_DEEP_005.wav',
  'CLAP_LAYER_001.wav','CLAP_LAYER_002.wav','CLAP_LAYER_003.wav','CLAP_LAYER_004.wav',
  'SNARE_DEEP_001.wav','SNARE_DEEP_002.wav','SNARE_DEEP_003.wav',
  'SNARE_DEEP_004.wav','SNARE_DEEP_005.wav','SNARE_DEEP_006.wav',
];
async function loadBuiltinSamples() {
  if(builtinLoaded)return;
  initAudio(); builtinBuffers=[];
  await Promise.all(SAMPLE_FILES.map(async fname=>{
    try{
      const r=await fetch(`./samples/${fname}`);
      if(!r.ok)throw new Error(`${r.status}`);
      builtinBuffers.push({name:fname.replace(/\.\w+$/,''),buffer:await audioCtx.decodeAudioData(await r.arrayBuffer())});
    }catch(e){console.warn('Could not load',fname);}
  }));
  builtinBuffers.sort((a,b)=>a.name.localeCompare(b.name));
  builtinLoaded=builtinBuffers.length>0;
  if(!builtinLoaded){showToast('No samples found');sourceType='pink';updateSourceUI();}
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if (e.code!=='KeyP' && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  if (e.code==='Space')  { e.preventDefault(); toggleDry(); }
  if (e.code==='KeyD')   { e.preventDefault(); toggleDry(); }
  if (e.code==='KeyP')   { e.preventDefault(); togglePause(); }
  if (e.code==='KeyF')   { e.preventDefault(); restartAudio(); }
  if (e.code==='Enter')  { startRound(); }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { resizeCanvas(); if(roundActive)drawGrid(); });
resizeCanvas();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.log('SW registered'))
      .catch(e=>console.warn('SW failed',e));
  });
}
