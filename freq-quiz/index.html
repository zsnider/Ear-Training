<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freq Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #080a0e;
    --bg2:      #0c0f14;
    --surface:  #111520;
    --surface2: #181e2e;
    --surface3: #1f2638;
    --border:   rgba(255,255,255,0.07);
    --border2:  rgba(255,255,255,0.13);
    --text:     #e8edf8;
    --muted:    #5a6480;
    --accent:   #00d4ff;
    --accent2:  #60e8ff;
    --boost:    #f0b429;
    --boost2:   #ffd166;
    --cut:      #f45b69;
    --cut2:     #ff8a94;
    --green:    #3ecf8e;
    --correct:  #3ecf8e;
    --wrong:    #f45b69;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
    user-select: none;
  }

  /* ── Header ── */
  header {
    width: 100%; max-width: 820px;
    padding: 22px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
  }

  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.06em; color: var(--text);
  }
  .brand-name span { color: var(--accent); }

  .score-row { display:flex; gap:20px; align-items:center; }
  .stat { text-align:center; }
  .stat-val { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--accent2); }
  .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .vdiv { width:1px; height:22px; background:var(--border2); }

  /* ── Main ── */
  .main {
    width: 100%; max-width: 820px;
    padding: 16px 24px 0;
    display: flex; flex-direction: column; gap: 14px;
  }

  /* ── Settings row ── */
  .settings-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 12px;
  }

  .label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap;
  }

  select {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border2);
    padding: 5px 10px; border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; outline: none; cursor: pointer;
  }
  select:hover, select:focus { border-color: var(--accent); }

  .pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
    font-family: 'IBM Plex Sans', sans-serif; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,212,255,0.08); }
  .pill.inactive { opacity: 0.4; }

  /* ── Prompt card ── */
  .prompt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    min-height: 80px;
    transition: border-color 0.3s;
    position: relative; overflow: hidden;
  }
  .prompt-card.correct-flash { border-color: var(--correct); box-shadow: 0 0 20px rgba(62,207,142,0.2); }
  .prompt-card.wrong-flash   { border-color: var(--wrong);   box-shadow: 0 0 20px rgba(244,91,105,0.2); }

  .prompt-left { display:flex; flex-direction:column; gap:6px; }

  .direction-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 6px;
    width: fit-content;
  }
  .direction-badge.boost { background: rgba(240,180,41,0.15); color: var(--boost2); border: 1px solid rgba(240,180,41,0.3); }
  .direction-badge.cut   { background: rgba(244,91,105,0.12); color: var(--cut2);   border: 1px solid rgba(244,91,105,0.25); }

  .prompt-question {
    font-size: 17px; font-weight: 500; color: var(--text); line-height: 1.3;
  }
  .prompt-question span { color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .result-msg-inline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px; font-weight: 700;
    opacity: 0; transition: opacity 0.15s;
    white-space: nowrap;
  }
  .result-msg-inline.show-correct { opacity: 1; color: var(--correct); }
  .result-msg-inline.show-wrong   { opacity: 1; color: var(--wrong); }

  /* ── EQ curve canvas ── */
  .eq-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  canvas#eqCanvas {
    display: block; width: 100%; height: 100px;
    transition: filter 0.2s, opacity 0.2s;
  }
  canvas#eqCanvas.hidden-eq {
    filter: blur(12px);
    opacity: 0;
  }

  .btn-action {
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border2);
    font-size: 12px; padding: 7px 13px; border-radius: 8px;
    cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action.active { background: rgba(0,212,255,0.08); border-color: var(--accent2); color: var(--accent2); }
  .btn-action.dry-active { background: rgba(245,166,35,0.08); border-color: var(--boost2); color: var(--boost2); }
  .btn-action.paused { background: rgba(244,91,105,0.08); border-color: var(--cut2); color: var(--cut2); }
  .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Frequency buttons ── */
  .freq-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
  }

  @media (max-width: 600px) {
    .freq-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .freq-btn {
    background: var(--surface);
    border: 1.5px solid var(--border2);
    border-radius: 12px;
    padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'IBM Plex Sans', sans-serif;
    position: relative; overflow: hidden;
  }
  .freq-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,212,255,0.12);
  }
  .freq-btn:active:not(:disabled) { transform: translateY(0); }
  .freq-btn:disabled { cursor: not-allowed; }

  /* Hidden freq stays in its grid slot — invisible but occupies space */
  .freq-btn.freq-off {
    visibility: hidden;
    pointer-events: none;
  }

  .freq-hz {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em;
  }
  .freq-sub {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* Answer states */
  .freq-btn.correct {
    background: rgba(62,207,142,0.15);
    border-color: var(--correct);
    box-shadow: 0 0 16px rgba(62,207,142,0.2);
  }
  .freq-btn.correct .freq-hz { color: var(--correct); }
  .freq-btn.wrong {
    background: rgba(244,91,105,0.12);
    border-color: var(--wrong);
  }
  .freq-btn.wrong .freq-hz { color: var(--wrong); }
  .freq-btn.dimmed { opacity: 0.25; }

  /* Correct answer reveal when user was wrong */
  .freq-btn.reveal {
    background: rgba(62,207,142,0.08);
    border-color: rgba(62,207,142,0.5);
    border-style: dashed;
  }
  .freq-btn.reveal .freq-hz { color: var(--correct); }

  /* ── Audio controls bar ── */
  .audio-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }

  /* Thin vertical divider inside the audio bar */
  .audio-bar .bar-divider {
    width: 1px; height: 22px; background: var(--border2); flex-shrink: 0;
  }

  button.ctrl-btn {
    border: none; border-radius: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 9px 16px; transition: all 0.15s;
  }
  .btn-listen {
    background: var(--surface2); color: var(--accent);
    border: 1px solid rgba(0,212,255,0.3);
    display: flex; align-items: center; gap: 6px;
  }
  .btn-listen:hover { background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.6); }
  .btn-listen.playing { background: rgba(0,212,255,0.12); border-color: var(--accent); }
  .btn-listen:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-skip {
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border2);
  }
  .btn-skip:hover { border-color: var(--accent); color: var(--accent); }
  .btn-skip:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Source pills — no longer pushed to the right */
  .source-select-wrap {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }

  .source-pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 6px 12px; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .source-pill:hover { border-color: var(--accent); color: var(--text); }
  .source-pill.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,212,255,0.08); }

  /* Pulse dot */
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    animation: pdot 1.1s infinite;
  }
  @keyframes pdot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.3;transform:scale(0.6);} }

  /* ── History strip ── */
  .history-strip {
    display: flex; gap: 5px; flex-wrap: wrap; min-height: 14px;
  }
  .hist-dot {
    width: 10px; height: 10px; border-radius: 50%;
    transition: all 0.2s;
  }
  .hist-dot.c { background: var(--correct); }
  .hist-dot.w { background: var(--wrong); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 16px; font-size: 13px; color: var(--text);
    opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  kbd {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }

  /* ── Next round countdown ── */
  .next-bar {
    height: 3px; background: var(--border2);
    border-radius: 2px; overflow: hidden; margin-top: 2px;
  }
  .next-fill {
    height: 100%; border-radius: 2px;
    background: var(--accent); width: 100%;
    transition: none;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M1 9 Q3 5 5 9 Q7 13 9 9 Q11 5 13 9 Q15 13 17 9"
              stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <span class="brand-name">FREQ <span>QUIZ</span></span>
  </div>
  <div class="score-row">
    <div class="stat">
      <div class="stat-val" id="scoreVal">0</div>
      <div class="stat-label">Score</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-label">Streak</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="accuracyVal">—</div>
      <div class="stat-label">Accuracy</div>
    </div>
    <div class="vdiv"></div>
    <div class="stat">
      <div class="stat-val" id="roundVal">0</div>
      <div class="stat-label">Round</div>
    </div>
  </div>
</header>

<div class="main">

  <!-- Settings -->
  <div class="settings-row">
    <span class="label">Gain</span>
    <select id="gainSelect" onchange="setGainAmount(+this.value)">
      <option value="12">± 12 dB (Easy)</option>
      <option value="9">± 9 dB</option>
      <option value="6" selected>± 6 dB (Medium)</option>
      <option value="4">± 4 dB</option>
      <option value="3">± 3 dB (Hard)</option>
      <option value="2">± 2 dB (Expert)</option>
    </select>
    <div class="vdiv"></div>
    <span class="label">Direction</span>
    <div class="pill active" id="dirBoth"  onclick="setDirection('both',this)">Both</div>
    <div class="pill"        id="dirBoost" onclick="setDirection('boost',this)">Boost Only</div>
    <div class="pill"        id="dirCut"   onclick="setDirection('cut',this)">Cut Only</div>
    <div class="vdiv" style="margin-left:auto;"></div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap;">
      <kbd>Space</kbd>/<kbd>D</kbd> dry &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>F</kbd> restart &nbsp;·&nbsp; <kbd>←→</kbd> seek 10s &nbsp;·&nbsp; <kbd>↑↓</kbd> track &nbsp;·&nbsp; <kbd>1–9</kbd> answer
    </span>
  </div>

  <!-- Prompt -->
  <div class="prompt-card" id="promptCard">
    <div class="prompt-left">
      <div class="direction-badge boost" id="dirBadge">↑ Boost</div>
      <div class="prompt-question" id="promptText">
        Press <span>Play</span> to start
      </div>
      <div class="next-bar" id="nextBar" style="display:none;"><div class="next-fill" id="nextFill"></div></div>
    </div>
    <div class="result-msg-inline" id="resultInline">Correct!</div>
  </div>

  <!-- EQ Curve -->
  <div class="eq-card">
    <canvas id="eqCanvas" class="hidden-eq"></canvas>
  </div>

  <!-- Frequency buttons -->
  <div class="freq-grid" id="freqGrid"></div>

  <!-- History -->
  <div class="history-strip" id="historyStrip"></div>

  <!-- Audio controls -->
  <div class="audio-bar">
    <button class="ctrl-btn btn-listen" id="btnPlay" onclick="playCurrentRound()">
      <span id="playDot"></span> Play
    </button>
    <button class="btn-action" id="btnDry"     onclick="toggleDry()"    disabled title="Dry signal (D)">Dry</button>
    <button class="btn-action" id="btnPause"   onclick="togglePause()"  disabled title="Pause / Resume (P)">&#9646;&#9646; Pause</button>
    <button class="btn-action" id="btnRestart" onclick="restartAudio()" disabled title="Restart (F)">&#9654; Restart</button>
    <button class="ctrl-btn btn-skip" id="btnSkip" onclick="skipRound()" disabled>Skip</button>

    <div class="bar-divider"></div>

    <div class="source-select-wrap">
      <span class="label">Source</span>
      <div class="source-pill active" id="srcPink"    onclick="setSource('pink')">Pink Noise</div>
      <div class="source-pill"        id="srcBuiltin" onclick="setSource('builtin')">Sample One-shots</div>
      <div class="source-pill"        id="srcCustom"  onclick="triggerUpload()" style="border-style:dashed;">
        <span id="uploadLabel">📁 Upload Music</span>
      </div>
      <input type="file" id="folderInput" webkitdirectory directory multiple
             onchange="handleFolderUpload(event)" style="display:none;">
    </div>
  </div>

  <!-- Frequency toggles -->
  <div class="settings-row" id="freqTogglesRow">
    <span class="label">Freqs</span>
    <!-- pills injected by buildFreqToggles() -->
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const FREQS = [63, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
const FREQ_LABELS = ['63', '125', '250', '500', '1k', '2k', '4k', '8k', '16k'];
const FREQ_SUBS   = ['Hz','Hz','Hz','Hz','kHz','kHz','kHz','kHz','kHz'];
const LOG_MIN = Math.log10(20), LOG_MAX = Math.log10(22000);

// ── State ─────────────────────────────────────────────────────────────────────
let gainAmount  = 6;
let direction   = 'both';   // 'both' | 'boost' | 'cut'
let targetFreq  = null;     // Hz
let targetGain  = null;     // +/- gainAmount
let roundActive = false;
let answered    = false;
let score=0, streak=0, totalRounds=0, correctCount=0;

// Frequency toggles — which freqs are included in the quiz pool
let activeFreqs = new Set(FREQS);

// Audio
let audioCtx      = null;
let noiseSource   = null;
let eqFilter      = null;
let outGain       = null;
let isPlaying     = false;
let isDry         = false;
let isPaused      = false;
let shotLoopTimer = null;
let playTimeout   = null;
let nextTimeout   = null;
let sourceType    = 'pink';
let customBuffers = [], customIdx = 0, musicOffset = 0, musicStartedAt = 0;
let builtinBuffers= [], builtinLoaded=false, builtinIdx=0;
let currentShotSrc = null; // track one-shot for stopping

const canvas = document.getElementById('eqCanvas');
const ctx2d  = canvas.getContext('2d');

// ── Settings ──────────────────────────────────────────────────────────────────
function setGainAmount(v) {
  gainAmount = v;
  if (roundActive && !answered) newRound();
}

function setDirection(d, el) {
  direction = d;
  ['dirBoth','dirBoost','dirCut'].forEach(id => document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
  if (roundActive && !answered) newRound();
}

// ── Frequency toggles ─────────────────────────────────────────────────────────
function buildFreqToggles() {
  const row = document.getElementById('freqTogglesRow');
  FREQS.forEach((f, i) => {
    const pill = document.createElement('div');
    pill.className = 'pill active';
    pill.id = `ftog-${f}`;
    pill.textContent = FREQ_LABELS[i];
    pill.title = `${FREQ_LABELS[i]} ${FREQ_SUBS[i]} — click to exclude`;
    pill.addEventListener('click', () => toggleFreq(f, pill));
    row.appendChild(pill);
  });
}

function toggleFreq(f, pill) {
  if (activeFreqs.has(f)) {
    // Don't allow fewer than 2 active frequencies
    if (activeFreqs.size <= 2) {
      showToast('Need at least 2 frequencies active');
      return;
    }
    activeFreqs.delete(f);
    pill.classList.remove('active');
    pill.classList.add('inactive');
  } else {
    activeFreqs.add(f);
    pill.classList.add('active');
    pill.classList.remove('inactive');
  }
  // Update visibility of freq buttons — hidden ones stay in grid position
  applyFreqVisibility();
  // If the current round's target freq was just disabled, start a new round
  if (roundActive && !answered && targetFreq && !activeFreqs.has(targetFreq)) {
    newRound();
  }
}

function applyFreqVisibility() {
  FREQS.forEach(f => {
    const btn = document.getElementById(`freq-${f}`);
    if (!btn) return;
    if (activeFreqs.has(f)) {
      btn.classList.remove('freq-off');
    } else {
      btn.classList.add('freq-off');
    }
  });
}

// ── EQ curve draw ─────────────────────────────────────────────────────────────
function freqToX(f, w) {
  return ((Math.log10(f) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * w;
}
function gainToY(g, h) {
  return h/2 - (g / 18) * (h/2 - 6);
}
function getBandGain(f, centerFreq, gain) {
  if (!centerFreq) return 0;
  const Q      = 3.0;
  const bw     = centerFreq / Q;
  const dist   = (f - centerFreq) / bw;
  return gain * Math.exp(-0.5 * dist * dist);
}

function drawEQ(centerFreq, gain) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth, H = 100;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx2d.scale(dpr, dpr);

  ctx2d.fillStyle = '#0c0f14';
  ctx2d.fillRect(0, 0, W, H);

  // Grid
  for (const f of [63,125,250,500,1000,2000,4000,8000,16000]) {
    const x = freqToX(f, W);
    ctx2d.strokeStyle = 'rgba(255,255,255,0.05)'; ctx2d.lineWidth = 1;
    ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,H); ctx2d.stroke();
  }
  // 0dB line
  ctx2d.strokeStyle = 'rgba(255,255,255,0.1)'; ctx2d.lineWidth = 1;
  ctx2d.beginPath(); ctx2d.moveTo(0,H/2); ctx2d.lineTo(W,H/2); ctx2d.stroke();

  if (!centerFreq) return;

  const N = 400;
  const isBoost = gain > 0;
  const curveColor = isBoost ? 'rgba(240,180,41,0.9)' : 'rgba(244,91,105,0.9)';
  const fillColor  = isBoost ? 'rgba(240,180,41,0.08)' : 'rgba(244,91,105,0.08)';

  ctx2d.beginPath();
  for (let i=0; i<=N; i++) {
    const f = Math.pow(10, LOG_MIN + (i/N)*(LOG_MAX-LOG_MIN));
    const g = getBandGain(f, centerFreq, gain);
    const x = freqToX(f, W), y = gainToY(g, H);
    i===0 ? ctx2d.moveTo(x,y) : ctx2d.lineTo(x,y);
  }
  ctx2d.strokeStyle = curveColor; ctx2d.lineWidth = 2.5; ctx2d.stroke();
  ctx2d.lineTo(W,H/2); ctx2d.lineTo(0,H/2); ctx2d.closePath();
  ctx2d.fillStyle = fillColor; ctx2d.fill();

  // Peak dot
  const px = freqToX(centerFreq, W), py = gainToY(gain, H);
  ctx2d.beginPath(); ctx2d.arc(px, py, 5, 0, Math.PI*2);
  ctx2d.fillStyle = curveColor; ctx2d.fill();
}

// ── Build freq buttons ────────────────────────────────────────────────────────
function buildFreqGrid() {
  const grid = document.getElementById('freqGrid');
  grid.innerHTML = '';
  FREQS.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'freq-btn';
    btn.id = `freq-${f}`;
    btn.dataset.freq = f;
    btn.disabled = true;
    btn.innerHTML = `<div class="freq-hz">${FREQ_LABELS[i]}</div><div class="freq-sub">${FREQ_SUBS[i]}</div>`;
    btn.addEventListener('click', () => submitAnswer(f));
    grid.appendChild(btn);
  });
  applyFreqVisibility();
}

// ── Round ─────────────────────────────────────────────────────────────────────
function newRound() {
  clearTimeout(nextTimeout);
  stopPlayback();
  musicOffset = 0;
  // Advance music track each new round
  if (sourceType === 'custom' && customBuffers.length > 0) {
    customIdx = (customIdx + 1) % customBuffers.length;
  }
  answered = false;
  roundActive = true;
  // Reset dry and pause states
  if (isDry) { isDry = false; const db=document.getElementById('btnDry'); if(db){db.classList.remove('dry-active');db.textContent='Dry';} }
  if (isPaused && audioCtx) { audioCtx.resume(); isPaused=false; const pb=document.getElementById('btnPause'); if(pb){pb.innerHTML='&#9646;&#9646; Pause';pb.classList.remove('paused');} }

  // Pick random frequency from active set only
  const activeArr = FREQS.filter(f => activeFreqs.has(f));
  if (activeArr.length === 0) return;
  const idx = Math.floor(Math.random() * activeArr.length);
  targetFreq = activeArr[idx];

  // Pick direction
  if (direction === 'boost') targetGain = gainAmount;
  else if (direction === 'cut') targetGain = -gainAmount;
  else targetGain = Math.random() > 0.5 ? gainAmount : -gainAmount;

  totalRounds++;
  document.getElementById('roundVal').textContent = totalRounds;

  // Update prompt
  const isBoost = targetGain > 0;
  const badge = document.getElementById('dirBadge');
  badge.textContent = isBoost ? `↑ Boost  ${gainAmount} dB` : `↓ Cut  ${gainAmount} dB`;
  badge.className = `direction-badge ${isBoost ? 'boost' : 'cut'}`;

  document.getElementById('promptText').innerHTML = `Which frequency is being <span>${isBoost ? 'boosted' : 'cut'}</span>?`;

  const card = document.getElementById('promptCard');
  card.classList.remove('correct-flash','wrong-flash');

  const ri = document.getElementById('resultInline');
  ri.className = 'result-msg-inline';

  document.getElementById('nextBar').style.display = 'none';

  // Reset freq buttons — active ones enabled, inactive ones stay hidden
  FREQS.forEach(f => {
    const btn = document.getElementById(`freq-${f}`);
    btn.className = 'freq-btn';
    if (activeFreqs.has(f)) {
      btn.disabled = false;
      // visibility is controlled by freq-off class — don't override here
    } else {
      btn.disabled = true;
      btn.classList.add('freq-off');
    }
  });

  document.getElementById('btnSkip').disabled = false;

  // Draw EQ hidden until answer
  drawEQ(null, 0);
  document.getElementById('eqCanvas').classList.add('hidden-eq');

  // Enable action buttons
  document.getElementById('btnDry').disabled = false;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnRestart').disabled = false;

  // Auto-play
  playCurrentRound();
}

// ── Play / stop ───────────────────────────────────────────────────────────────
function playCurrentRound() {
  if (!roundActive) { newRound(); return; }
  stopPlayback();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Draw EQ curve (still hidden until answer)
  drawEQ(targetFreq, targetGain);

  if (sourceType === 'builtin') {
    playBuiltinShot();
  } else {
    playNoiseBurst();
  }

  // Show playing state
  const dot = document.getElementById('playDot');
  dot.className = 'pulse-dot';
  dot.style.cssText = '';
  document.getElementById('btnPlay').classList.add('playing');
}

function playNoiseBurst(offset) {
  // Build EQ filter (or bypass if dry)
  eqFilter = audioCtx.createBiquadFilter();
  eqFilter.type = 'peaking';
  eqFilter.frequency.value = targetFreq;
  eqFilter.Q.value = 3.0;
  eqFilter.gain.value = isDry ? 0 : targetGain;

  outGain = audioCtx.createGain(); outGain.gain.value = 0.6;
  eqFilter.connect(outGain); outGain.connect(audioCtx.destination);

  let src;
  if (sourceType === 'custom' && customBuffers.length > 0) {
    const buf = customBuffers[customIdx % customBuffers.length];
    src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = false;
    const startOffset = Math.min(offset ?? musicOffset, buf.duration - 0.1);
    musicStartedAt = audioCtx.currentTime - startOffset;
    musicOffset = startOffset;

    // When a song ends, advance to next track
    src.onended = () => {
      if (!isPlaying) return;
      customIdx = (customIdx + 1) % customBuffers.length;
      musicOffset = 0;
      if (noiseSource === src) {
        // Rebuild with next track
        if (eqFilter && outGain) {
          const nextSrc = audioCtx.createBufferSource();
          nextSrc.buffer = customBuffers[customIdx];
          nextSrc.loop = false;
          nextSrc.connect(eqFilter);
          nextSrc.start(0);
          noiseSource = nextSrc;
          musicStartedAt = audioCtx.currentTime;
          nextSrc.onended = src.onended; // chain
        }
      }
    };
    src.start(0, startOffset);
  } else {
    // Pink noise: generate a long looping buffer
    src = makePinkNoise(5);
    src.loop = true;
    src.start(0);
    musicOffset = 0; musicStartedAt = audioCtx.currentTime;
  }
  src.connect(eqFilter);
  noiseSource = src;
  isPlaying = true;
  // No timeout — plays until stopped
}

function playBuiltinShot() {
  if (!builtinBuffers.length) return;

  // Set up shared filter + gain (reused each shot)
  eqFilter = audioCtx.createBiquadFilter();
  eqFilter.type = 'peaking';
  eqFilter.frequency.value = targetFreq;
  eqFilter.Q.value = 3.0;
  eqFilter.gain.value = isDry ? 0 : targetGain;

  outGain = audioCtx.createGain(); outGain.gain.value = 0.8;
  eqFilter.connect(outGain); outGain.connect(audioCtx.destination);

  isPlaying = true;

  const fireShot = () => {
    if (!isPlaying || sourceType !== 'builtin') return;
    const sample = builtinBuffers[builtinIdx % builtinBuffers.length];
    const src = audioCtx.createBufferSource();
    src.buffer = sample.buffer;
    src.connect(eqFilter);
    src.start(0);
    currentShotSrc = src;
  };

  fireShot(); // play immediately
  shotLoopTimer = setInterval(fireShot, 5000); // repeat every 5s
}

function stopPlayback() {
  clearTimeout(playTimeout);
  if (shotLoopTimer) { clearInterval(shotLoopTimer); shotLoopTimer = null; }
  if (noiseSource)     { try { noiseSource.stop(); }     catch(e){} noiseSource = null; }
  if (currentShotSrc) { try { currentShotSrc.stop(); } catch(e){} currentShotSrc = null; }
  if (eqFilter)  { try { eqFilter.disconnect(); }  catch(e){} eqFilter = null; }
  if (outGain)   { try { outGain.disconnect(); }   catch(e){} outGain = null; }
  isPlaying = false;
  const dot = document.getElementById('playDot');
  dot.className = ''; dot.style.cssText = '';
  document.getElementById('btnPlay').classList.remove('playing');
}

// ── Answer ────────────────────────────────────────────────────────────────────
function submitAnswer(clickedFreq) {
  if (!roundActive || answered) return;
  if (!activeFreqs.has(clickedFreq)) return; // guard against clicking hidden btns
  answered = true;
  // Reveal EQ curve
  document.getElementById('eqCanvas').classList.remove('hidden-eq');
  stopPlayback();

  const isCorrect = (clickedFreq === targetFreq);

  // Update stats
  if (isCorrect) { score++; streak++; correctCount++; }
  else streak = 0;

  document.getElementById('scoreVal').textContent   = score;
  document.getElementById('streakVal').textContent  = streak;
  document.getElementById('accuracyVal').textContent =
    totalRounds > 0 ? Math.round(correctCount/totalRounds*100)+'%' : '—';

  // Visual feedback on buttons (only for active freqs)
  FREQS.forEach(f => {
    const btn = document.getElementById(`freq-${f}`);
    btn.disabled = true;
    if (!activeFreqs.has(f)) {
      // Keep hidden, don't add answer classes
      btn.classList.add('freq-off');
      return;
    }
    if (f === targetFreq && isCorrect) {
      btn.classList.add('correct');
    } else if (f === clickedFreq && !isCorrect) {
      btn.classList.add('wrong');
    } else if (f === targetFreq && !isCorrect) {
      btn.classList.add('reveal'); // show correct answer
    } else {
      btn.classList.add('dimmed');
    }
  });

  // Prompt card flash
  const card = document.getElementById('promptCard');
  card.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');

  // Inline result
  const ri = document.getElementById('resultInline');
  ri.textContent = isCorrect ? '✓ Correct!' : `✗ ${fmtFreq(targetFreq)}`;
  ri.className = `result-msg-inline ${isCorrect ? 'show-correct' : 'show-wrong'}`;

  // History dot
  addHistory(isCorrect);

  // Auto-advance countdown bar
  const delay = isCorrect ? 1200 : 2000;
  const bar = document.getElementById('nextBar');
  const fill = document.getElementById('nextFill');
  bar.style.display = 'block';
  fill.style.transition = 'none';
  fill.style.width = '100%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      fill.style.transition = `width ${delay}ms linear`;
      fill.style.width = '0%';
    });
  });

  nextTimeout = setTimeout(() => {
    newRound();
  }, delay);

  document.getElementById('btnSkip').disabled = true;
}

function skipRound() {
  if (!roundActive || answered) return;
  answered = true;
  document.getElementById('eqCanvas').classList.remove('hidden-eq');
  stopPlayback();
  streak = 0;
  document.getElementById('streakVal').textContent = streak;

  FREQS.forEach(f => {
    const btn = document.getElementById(`freq-${f}`);
    btn.disabled = true;
    if (!activeFreqs.has(f)) {
      btn.classList.add('freq-off');
      return;
    }
    btn.classList.add(f === targetFreq ? 'reveal' : 'dimmed');
  });

  const ri = document.getElementById('resultInline');
  ri.textContent = `→ ${fmtFreq(targetFreq)}`;
  ri.className = 'result-msg-inline show-wrong';

  addHistory(false);

  const bar = document.getElementById('nextBar');
  const fill = document.getElementById('nextFill');
  bar.style.display = 'block';
  fill.style.transition = 'none'; fill.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = 'width 1800ms linear'; fill.style.width = '0%';
  }));
  nextTimeout = setTimeout(newRound, 1800);
  document.getElementById('btnSkip').disabled = true;
}

// ── History strip ─────────────────────────────────────────────────────────────
function addHistory(correct) {
  const strip = document.getElementById('historyStrip');
  const dot = document.createElement('div');
  dot.className = `hist-dot ${correct ? 'c' : 'w'}`;
  strip.appendChild(dot);
  // Keep last 40
  while (strip.children.length > 40) strip.removeChild(strip.firstChild);
  strip.scrollLeft = strip.scrollWidth;
}

// ── Audio setup ───────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function makePinkNoise(durationSecs) {
  const rate = audioCtx.sampleRate;
  const len  = Math.ceil(rate * durationSecs);
  const buf  = audioCtx.createBuffer(1, len, rate);
  const d    = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i=0;i<len;i++){
    const w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  const src=audioCtx.createBufferSource();
  src.buffer=buf; src.loop=false;
  return src;
}

// ── Source ────────────────────────────────────────────────────────────────────
function setSource(type) {
  if (type === 'builtin' && !builtinLoaded) {
    showToast('Loading samples…');
    loadBuiltinSamples().then(() => {
      sourceType = 'builtin'; updateSourceUI();
    });
    return;
  }
  sourceType = type; updateSourceUI();
}
function updateSourceUI() {
  document.getElementById('srcPink').classList.toggle('active',    sourceType==='pink');
  document.getElementById('srcCustom').classList.toggle('active',  sourceType==='custom');
  document.getElementById('srcBuiltin').classList.toggle('active', sourceType==='builtin');
}
function triggerUpload() {
  if (customBuffers.length > 0) { setSource('custom'); return; }
  document.getElementById('folderInput').click();
}
async function handleFolderUpload(e) {
  const files = Array.from(e.target.files).filter(f=>f.type.startsWith('audio/'));
  if (!files.length) return;
  initAudio(); customBuffers=[]; showToast(`Loading ${files.length} tracks…`);
  for (const f of files) {
    try { const ab=await f.arrayBuffer(); customBuffers.push(await audioCtx.decodeAudioData(ab)); }
    catch(err) { console.warn('decode error', f.name); }
  }
  if (customBuffers.length > 0) {
    document.getElementById('uploadLabel').textContent=`📁 Folder (${customBuffers.length} tracks)`;
    setSource('custom'); showToast('Music loaded!');
  }
}

const SAMPLE_FILES = [
  'CLAP_DEEP_001.wav','CLAP_DEEP_002.wav','CLAP_DEEP_003.wav',
  'CLAP_DEEP_004.wav','CLAP_DEEP_005.wav',
  'CLAP_LAYER_001.wav','CLAP_LAYER_002.wav','CLAP_LAYER_003.wav','CLAP_LAYER_004.wav',
  'SNARE_DEEP_001.wav','SNARE_DEEP_002.wav','SNARE_DEEP_003.wav',
  'SNARE_DEEP_004.wav','SNARE_DEEP_005.wav','SNARE_DEEP_006.wav',
];
async function loadBuiltinSamples() {
  if (builtinLoaded) return;
  initAudio(); builtinBuffers=[];
  const fetches = SAMPLE_FILES.map(async fname => {
    try {
      const resp=await fetch(`./samples/${fname}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const ab=await resp.arrayBuffer();
      builtinBuffers.push({ name:fname.replace(/\.\w+$/,''), buffer:await audioCtx.decodeAudioData(ab) });
    } catch(e) { console.warn('Could not load',fname,e.message); }
  });
  await Promise.all(fetches);
  builtinBuffers.sort((a,b)=>a.name.localeCompare(b.name));
  builtinLoaded = builtinBuffers.length > 0;
  if (!builtinLoaded) { showToast('No samples found — check samples/ folder'); sourceType='pink'; updateSourceUI(); }
}

// ── Dry toggle ────────────────────────────────────────────────────────────────
function toggleDry() {
  if (!roundActive) return;
  isDry = !isDry;
  const btn = document.getElementById('btnDry');
  btn.classList.toggle('dry-active', isDry);
  btn.textContent = isDry ? 'Wet' : 'Dry';
  // If currently playing, update EQ filter gain live
  if (eqFilter && audioCtx) {
    eqFilter.gain.setTargetAtTime(isDry ? 0 : targetGain, audioCtx.currentTime, 0.01);
  }
}

// ── Pause / Resume ────────────────────────────────────────────────────────────
function togglePause() {
  if (!roundActive || !audioCtx) return;
  const btn = document.getElementById('btnPause');
  if (isPaused) {
    audioCtx.resume().then(() => {
      isPaused = false;
      btn.innerHTML = '&#9646;&#9646; Pause';
      btn.classList.remove('paused');
      // Restart one-shot loop if builtin
      if (sourceType === 'builtin' && isPlaying) {
        if (shotLoopTimer) clearInterval(shotLoopTimer);
        const fireShot = () => {
          if (!isPlaying) return;
          const sample = builtinBuffers[builtinIdx % builtinBuffers.length];
          const src = audioCtx.createBufferSource();
          src.buffer = sample.buffer;
          if (eqFilter) src.connect(eqFilter);
          src.start(0); currentShotSrc = src;
        };
        fireShot(); shotLoopTimer = setInterval(fireShot, 5000);
      }
    });
  } else {
    if (shotLoopTimer) { clearInterval(shotLoopTimer); shotLoopTimer = null; }
    audioCtx.suspend().then(() => {
      isPaused = true;
      btn.innerHTML = '&#9654; Resume';
      btn.classList.add('paused');
    });
  }
}

// ── Restart ───────────────────────────────────────────────────────────────────
function restartAudio() {
  if (!roundActive) return;
  initAudio();
  if (isPaused) { audioCtx.resume(); isPaused = false;
    const btn = document.getElementById('btnPause');
    btn.innerHTML = '&#9646;&#9646; Pause'; btn.classList.remove('paused'); }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicOffset = 0; // restart from beginning
  stopPlayback();
  playCurrentRound();
  showToast('Restarted');
}

// ── Seek within current track (custom music only, ±10s) ──────────────────────
function seekMusic(deltaSecs) {
  if (!roundActive || sourceType !== 'custom' || customBuffers.length === 0) return;
  if (!isPlaying || !audioCtx) return;

  const buf = customBuffers[customIdx % customBuffers.length];

  // Current playback position = time elapsed since we started this source + the offset we started from
  const elapsedSinceStart = audioCtx.currentTime - musicStartedAt;
  const currentPos = musicOffset + elapsedSinceStart;
  const newOffset  = Math.max(0, Math.min(buf.duration - 0.5, currentPos + deltaSecs));

  // Stop old source node without triggering onended chain
  if (noiseSource) {
    noiseSource.onended = null; // detach so it doesn't chain to next track
    try { noiseSource.stop(); } catch(e){}
    noiseSource = null;
  }

  // Create a new source node on the EXISTING filter/gain graph
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = false;
  src.connect(eqFilter);

  musicOffset    = newOffset;
  musicStartedAt = audioCtx.currentTime;

  // Rewire onended to cycle to next track when this seek-to position reaches the end
  src.onended = () => {
    if (!isPlaying || noiseSource !== src) return;
    customIdx  = (customIdx + 1) % customBuffers.length;
    musicOffset = 0;
    if (eqFilter && outGain) {
      const nextSrc = audioCtx.createBufferSource();
      nextSrc.buffer = customBuffers[customIdx];
      nextSrc.loop   = false;
      nextSrc.connect(eqFilter);
      musicStartedAt = audioCtx.currentTime;
      nextSrc.onended = src.onended;
      nextSrc.start(0);
      noiseSource = nextSrc;
    }
  };

  src.start(0, newOffset);
  noiseSource = src;
  showToast(`${deltaSecs > 0 ? '+' : ''}${deltaSecs}s`);
}

// ── Skip track (custom music only, ±1 track) ──────────────────────────────────
function skipTrack(delta) {
  if (!roundActive || sourceType !== 'custom' || customBuffers.length === 0) return;
  if (!isPlaying || !audioCtx) return;

  // Detach current source's onended so it doesn't chain
  if (noiseSource) {
    noiseSource.onended = null;
    try { noiseSource.stop(); } catch(e){}
    noiseSource = null;
  }

  // Advance or reverse track index
  customIdx   = ((customIdx + delta) % customBuffers.length + customBuffers.length) % customBuffers.length;
  musicOffset = 0;

  // Start new track on existing filter/gain graph
  const buf = customBuffers[customIdx];
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop   = false;
  src.connect(eqFilter);
  musicStartedAt = audioCtx.currentTime;

  src.onended = () => {
    if (!isPlaying || noiseSource !== src) return;
    customIdx   = (customIdx + 1) % customBuffers.length;
    musicOffset = 0;
    if (eqFilter && outGain) {
      const nextSrc = audioCtx.createBufferSource();
      nextSrc.buffer     = customBuffers[customIdx];
      nextSrc.loop       = false;
      nextSrc.connect(eqFilter);
      musicStartedAt     = audioCtx.currentTime;
      nextSrc.onended    = src.onended;
      nextSrc.start(0);
      noiseSource = nextSrc;
    }
  };

  src.start(0);
  noiseSource = src;

  showToast(`Track ${customIdx + 1} / ${customBuffers.length}`);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code !== 'KeyP' && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  if (e.code === 'Space') {
    e.preventDefault();
    toggleDry(); // Space = A/B (dry/wet toggle)
  }
  if (e.code === 'KeyD') { e.preventDefault(); toggleDry(); }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); seekMusic(-10); }
  if (e.code === 'ArrowRight') { e.preventDefault(); seekMusic(+10); }
  if (e.code === 'ArrowUp')    { e.preventDefault(); skipTrack(+1); }
  if (e.code === 'ArrowDown')  { e.preventDefault(); skipTrack(-1); }
  if (e.code === 'KeyP') { e.preventDefault(); togglePause(); }
  if (e.code === 'KeyF') { e.preventDefault(); restartAudio(); }

  // 1–9 keys map to FREQS
  const numMatch = e.key.match(/^[1-9]$/);
  if (numMatch && roundActive && !answered) {
    const idx = parseInt(e.key) - 1;
    if (idx < FREQS.length && activeFreqs.has(FREQS[idx])) submitAnswer(FREQS[idx]);
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtFreq(f) {
  return f >= 1000 ? (f/1000)+'kHz' : f+'Hz';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildFreqToggles();
buildFreqGrid();
drawEQ(null, 0);
window.addEventListener('resize', () => {
  if (roundActive) drawEQ(answered ? targetFreq : targetFreq, targetGain);
  else drawEQ(null, 0);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.log('SW registered'))
      .catch(err=>console.warn('SW failed',err));
  });
}
